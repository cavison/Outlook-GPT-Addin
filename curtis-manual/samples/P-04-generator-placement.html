<html><body style="margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif">
<svg width="1100" height="720" viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg">
<rect x="10" y="10" width="1080" height="700" fill="none" stroke="#111" stroke-width="3"/>
<rect x="10" y="10" width="1080" height="64" fill="#111"/>
<text x="30" y="52" fill="#fff" font-size="30" font-weight="bold">MODULE P-04 · Generator Placement</text>
<text x="1070" y="52" fill="#f5a623" font-size="22" font-weight="bold" text-anchor="end">🟥 72 HRS</text>
<!-- house -->
<polygon points="60,300 210,190 360,300" fill="none" stroke="#111" stroke-width="4"/>
<rect x="80" y="300" width="260" height="220" fill="none" stroke="#111" stroke-width="4"/>
<rect x="110" y="340" width="60" height="55" fill="#cfe8ff" stroke="#111" stroke-width="3"/>
<rect x="250" y="400" width="55" height="120" fill="none" stroke="#111" stroke-width="3"/>
<text x="210" y="555" font-size="20" text-anchor="middle" font-weight="bold">HOUSE</text>
<text x="140" y="420" font-size="14" text-anchor="middle">window</text>
<!-- CO alarm -->
<circle cx="300" cy="330" r="16" fill="#fff" stroke="#c0392b" stroke-width="3"/><text x="300" y="336" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">CO</text>
<!-- distance -->
<line x1="345" y1="600" x2="760" y2="600" stroke="#111" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="470" y="575" width="170" height="44" fill="#fff"/>
<text x="555" y="607" font-size="28" text-anchor="middle" font-weight="bold">20+ FEET</text>
<!-- generator -->
<rect x="700" y="440" width="140" height="90" rx="8" fill="#f5a623" stroke="#111" stroke-width="4"/>
<circle cx="725" cy="540" r="14" fill="#111"/><circle cx="815" cy="540" r="14" fill="#111"/>
<text x="770" y="492" font-size="18" text-anchor="middle" font-weight="bold">GEN</text>
<!-- exhaust -->
<path d="M845,470 q40,-20 70,0 t70,0" fill="none" stroke="#888" stroke-width="4" stroke-dasharray="8 6"/>
<path d="M845,495 q40,-20 70,0 t70,0" fill="none" stroke="#888" stroke-width="4" stroke-dasharray="8 6"/>
<text x="990" y="455" font-size="15" text-anchor="end" fill="#555">exhaust points AWAY</text>
<!-- cord -->
<path d="M700,500 C600,500 520,470 340,470" fill="none" stroke="#111" stroke-width="3"/>
<text x="520" y="460" font-size="15" text-anchor="middle">heavy-duty outdoor cord</text>
<!-- steps -->
<g font-size="17">
<text x="440" y="120" font-weight="bold" font-size="20">STEPS</text>
<text x="440" y="150">1  Place OUTSIDE, 20+ ft from house, on dry ground.</text>
<text x="440" y="178">2  Point exhaust away from windows, doors, vents.</text>
<text x="440" y="206">3  Battery CO alarm on every floor inside.</text>
<text x="440" y="234">4  Let it cool before refueling. Never refuel hot.</text>
<text x="440" y="262">5  Plug appliances into the generator, or use a</text>
<text x="463" y="288">licensed transfer switch. NEVER backfeed an outlet.</text>
</g>
<rect x="440" y="315" width="630" height="92" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="455" y="345" font-size="18" font-weight="bold" fill="#c0392b">⚠ CAUTION</text>
<text x="455" y="372" font-size="16">Never in a garage, even with the door open. CO is invisible.</text>
<text x="455" y="396" font-size="16">Headache + dizziness + nausea in several people = GET OUT.</text>
<rect x="30" y="640" width="1040" height="55" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="45" y="675" font-size="16"><tspan font-weight="bold" fill="#2e7d32">💡 FIELD NOTE: </tspan>In Michigan winters, snow can drift over the exhaust. Clear around it every few hours. Source: CDC, CPSC</text>
</svg></body></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-04 · Disinfect Water with Bleach</text>
<rect x="40" y="120" width="90" height="150" rx="10" fill="none" stroke="#111" stroke-width="4"/><rect x="60" y="100" width="50" height="20" rx="0" fill="none" stroke="#111" stroke-width="3"/><text x="85" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">BLEACH</text><text x="85" y="212" font-size="16" text-anchor="middle" fill="#111">6% or</text><text x="85" y="232" font-size="16" text-anchor="middle" fill="#111">8.25%</text><text x="85" y="290" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">unscented</text><circle cx="40" cy="105" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="111" font-size="17" font-weight="bold" text-anchor="middle">1</text><path d="M150,150 l10,15 a8,8 0 1 1 -12,0 z" fill="#2b7bb9" stroke="#2b7bb9" stroke-width="3"/><line x1="150" y1="180" x2="220" y2="230" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><circle cx="170" cy="130" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="170" y="136" font-size="17" font-weight="bold" text-anchor="middle">2</text><rect x="220" y="253.0" width="80" height="77.0" fill="#d6eaf8"/><rect x="220" y="220" width="80" height="110" rx="8" fill="none" stroke="#111" stroke-width="3"/><rect x="248.0" y="206" width="24.0" height="14" rx="0" fill="none" stroke="#111" stroke-width="3"/><path d="M300,232 q18,0 18,18 q0,18 -18,18" fill="none" stroke="#111" stroke-width="3"/><text x="260" y="350" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">1 gal</text><circle cx="330" cy="210" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="330" y="216" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="330" cy="120" r="30" fill="none" stroke="#111" stroke-width="3"/><line x1="330" y1="120" x2="330" y2="100" stroke="#111" stroke-width="3"/><line x1="330" y1="120" x2="345" y2="128" stroke="#111" stroke-width="3"/><text x="330" y="175" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">30 min</text><circle cx="380" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="380" y="96" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Unscented 6% or 8.25% bleach.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Settle and filter cloudy water.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Add drops (6%: 8/gal clear, 16 cloudy.</text>
<text x="444" y="171" font-size="17" text-anchor="start" fill="#111">8.25%: 6/gal, 12 cloudy).</text>
<circle cx="420" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="201" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="201" font-size="17" text-anchor="start" fill="#111">Wait 30 min. Faint chlorine smell.</text>
<circle cx="420" cy="225" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="231" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="444" y="231" font-size="17" text-anchor="start" fill="#111">Store covered and clean.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>No scented or splash-less bleach. Does not remove fuel or chemicals.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Old bleach is weak. Date the cap and replace about yearly.</text>
</svg>
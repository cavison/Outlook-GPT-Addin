<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">P-07 · Power Station + Solar Sizing</text><rect x="250" y="270" width="150" height="110" rx="10" fill="#fff" stroke="#111" stroke-width="4"/><text x="325" y="310" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">1,000 Wh</text><text x="325" y="335" font-size="16" text-anchor="middle" fill="#111">x 0.85 =</text><text x="325" y="360" font-size="16" text-anchor="middle" fill="#2e7d32" font-weight="bold">850 Wh usable</text><polygon points="40,330 160,330 200,200 80,200" fill="#d6eaf8" stroke="#111" stroke-width="4"/><line x1="100" y1="330" x2="140" y2="200" stroke="#111" stroke-width="1.5"/><line x1="140" y1="330" x2="180" y2="200" stroke="#111" stroke-width="1.5"/><text x="60" y="370" font-size="16" text-anchor="start" fill="#111">100 W panel</text><circle cx="80" cy="110" r="26" fill="none" stroke="#e67e22" stroke-width="3"/><text x="120" y="100" font-size="16" text-anchor="start" fill="#111" font-weight="bold">W x sun hrs x 0.75</text><line x1="180" y1="290" x2="245" y2="310" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="40" y="420" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Device W x hours = Wh</text><text x="40" y="445" font-size="18" text-anchor="start" fill="#111" font-weight="bold">Days = usable Wh / daily Wh</text><text x="40" y="475" font-size="16" text-anchor="start" fill="#2e7d32">850 / 445 = about 1.9 days</text><line x1="400" y1="320" x2="460" y2="320" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="470" y="300" font-size="16" text-anchor="start" fill="#111"></text><circle cx="30" cy="420" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="30" y="426" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="420" cy="280" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="286" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="220" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="220" y="116" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="200" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="200" y="256" font-size="17" font-weight="bold" text-anchor="middle">6</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">W x hours = Wh</text><circle cx="530" cy="145" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="151" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="151" font-size="16" text-anchor="start" fill="#111">Add up a day</text><circle cx="530" cy="181" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="187" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Use about 85% of Wh</text><circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="553" y="223" font-size="16" text-anchor="start" fill="#111">Usable / daily = days</text><circle cx="530" cy="253" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="259" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="553" y="259" font-size="16" text-anchor="start" fill="#111">Solar: W x sun hrs</text><text x="553" y="279" font-size="16" text-anchor="start" fill="#111">x 0.75</text><circle cx="530" cy="309" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="315" font-size="17" font-weight="bold" text-anchor="middle">6</text><text x="553" y="315" font-size="16" text-anchor="start" fill="#111">Face south, steep,</text><text x="553" y="335" font-size="16" text-anchor="start" fill="#111">clear snow</text><circle cx="530" cy="365" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="371" font-size="17" font-weight="bold" text-anchor="middle">7</text><text x="553" y="371" font-size="16" text-anchor="start" fill="#111">Skip high-watt items</text></svg>

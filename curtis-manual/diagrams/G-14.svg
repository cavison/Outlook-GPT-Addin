<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-14 · Trapping Small Game Legally</text>
<rect x="80" y="220" width="320" height="120" stroke="#111" stroke-width="3" fill="none"/><line x1="100" y1="220" x2="100" y2="340" stroke="#888" stroke-width="2"/><line x1="120" y1="220" x2="120" y2="340" stroke="#888" stroke-width="2"/><line x1="140" y1="220" x2="140" y2="340" stroke="#888" stroke-width="2"/><line x1="160" y1="220" x2="160" y2="340" stroke="#888" stroke-width="2"/><line x1="180" y1="220" x2="180" y2="340" stroke="#888" stroke-width="2"/><line x1="200" y1="220" x2="200" y2="340" stroke="#888" stroke-width="2"/><line x1="220" y1="220" x2="220" y2="340" stroke="#888" stroke-width="2"/><line x1="240" y1="220" x2="240" y2="340" stroke="#888" stroke-width="2"/><line x1="260" y1="220" x2="260" y2="340" stroke="#888" stroke-width="2"/><line x1="280" y1="220" x2="280" y2="340" stroke="#888" stroke-width="2"/><line x1="300" y1="220" x2="300" y2="340" stroke="#888" stroke-width="2"/><line x1="320" y1="220" x2="320" y2="340" stroke="#888" stroke-width="2"/><line x1="340" y1="220" x2="340" y2="340" stroke="#888" stroke-width="2"/><line x1="360" y1="220" x2="360" y2="340" stroke="#888" stroke-width="2"/><line x1="380" y1="220" x2="380" y2="340" stroke="#888" stroke-width="2"/><line x1="80" y1="250" x2="400" y2="250" stroke="#888" stroke-width="2"/><line x1="80" y1="310" x2="400" y2="310" stroke="#888" stroke-width="2"/><path d="M80,220 L40,180" stroke="#111" stroke-width="4"/><text x="30" y="170" font-size="16" text-anchor="start" fill="#111">door open</text><ellipse cx="365" cy="325" rx="16" ry="12" fill="#e67e22" stroke="#111" stroke-width="2"/><text x="365" y="370" font-size="16" text-anchor="middle" fill="#111">bait at far end</text><line x1="20" y1="340" x2="480" y2="340" stroke="#111" stroke-width="3"/><path d="M100,215 q30,-40 60,0 M300,215 q30,-40 60,0" stroke="#2e7d32" stroke-width="3" fill="none"/><text x="240" y="200" font-size="16" text-anchor="middle" fill="#2e7d32">brush on sides</text><rect x="300" y="90" width="180" height="70" fill="#fff" stroke="#111" stroke-width="3"/><text x="390" y="118" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">DNR Digest:</text><text x="390" y="142" font-size="16" text-anchor="middle" fill="#111">license · season</text><text x="240" y="410" font-size="18" text-anchor="middle" fill="#c0392b" font-weight="bold">check every day</text><circle cx="280" cy="105" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="280" y="111" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="380" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="380" y="306" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="230" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="181" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="120" cy="400" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="406" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Check DNR Digest + license</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Landowner permission</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Scout runs, tracks</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Cage trap level, bait far end</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">Brush sides lightly</text>
<circle cx="530" cy="252" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="258" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="257" font-size="16" text-anchor="start" fill="#111">Check at least daily</text>
<circle cx="530" cy="287" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="293" font-size="17" font-weight="bold" text-anchor="middle">7</text>
<text x="553" y="292" font-size="16" text-anchor="start" fill="#111">Release non-targets</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Snares and body-grip traps are heavily restricted in Michigan and</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">kill pets and protected animals. Don't improvise them.</text>
</svg>

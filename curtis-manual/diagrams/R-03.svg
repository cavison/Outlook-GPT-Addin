<text x="22" y="40" font-size="24" font-weight="bold" fill="#fff" text-anchor="start">R-03 · Fix a Bicycle Flat</text>
<circle cx="160" cy="270" r="110" fill="none" stroke="#111" stroke-width="4"/><circle cx="160" cy="270" r="5" fill="#111"/><circle cx="160" cy="270" r="95" fill="none" stroke="#111" stroke-width="4"/><circle cx="160" cy="270" r="5" fill="#111"/><line x1="160" y1="270" x2="160" y2="160" stroke="#111" stroke-width="2"/><path d="M260,190 l40,-40" stroke="#2e7d32" stroke-width="8" stroke-linecap="round"/><path d="M300,330 l40,20" stroke="#c0392b" stroke-width="4"/><text x="345" y="375" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">thorn</text><circle cx="310" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="310" y="146" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text><circle cx="330" cy="320" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="330" y="326" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">4</text>
<text x="410" y="88" font-size="18" font-weight="bold" fill="#111" text-anchor="start">STEPS</text>
<circle cx="422" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="115" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">1</text>
<text x="446" y="115" font-size="16" fill="#111" text-anchor="start">Remove the wheel</text>
<circle cx="422" cy="142" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="148" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text>
<text x="446" y="148" font-size="16" fill="#111" text-anchor="start">Lever one side of tire off</text>
<circle cx="422" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="181" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">3</text>
<text x="446" y="181" font-size="16" fill="#111" text-anchor="start">Find leak (water bucket)</text>

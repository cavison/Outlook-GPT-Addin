<text x="34" y="438" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">⚠ CAUTION</text>
<text x="34" y="464" font-size="16" fill="#111" text-anchor="start">Remove the thorn or the new tube goes flat too.</text>

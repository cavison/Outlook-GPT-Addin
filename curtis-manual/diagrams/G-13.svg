<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-13 · Ice Fishing and Ice Safety</text>
<path d="M30,180 L480,180" stroke="#111" stroke-width="3"/><rect x="30" y="180" width="200" height="60" fill="#d6eaf8" stroke="#111" stroke-width="3"/><text x="130" y="216" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">clear / blue-black</text><rect x="250" y="180" width="230" height="35" fill="#ddd" stroke="#111" stroke-width="3" stroke-dasharray="6 4"/><text x="365" y="203" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">gray / slushy</text><rect x="30" y="240" width="450" height="170" fill="#d6eaf8" fill-opacity="0.4" stroke="none"/><line x1="245" y1="180" x2="245" y2="240" stroke="#111" stroke-width="2"/><text x="130" y="265" font-size="18" text-anchor="middle" fill="#2e7d32" font-weight="bold">4+ in. clear ice</text><text x="130" y="287" font-size="16" text-anchor="middle" fill="#111">to walk (commonly cited)</text><text x="365" y="250" font-size="18" text-anchor="middle" fill="#c0392b" font-weight="bold">✘ STAY OFF</text><circle cx="100" cy="130" r="12" stroke="#111" stroke-width="3" fill="none"/><line x1="100" y1="142" x2="100" y2="165" stroke="#111" stroke-width="3" fill="none"/><line x1="100" y1="165" x2="90" y2="180" stroke="#111" stroke-width="3" fill="none"/><line x1="100" y1="165" x2="110" y2="180" stroke="#111" stroke-width="3" fill="none"/><line x1="100" y1="150" x2="140" y2="120" stroke="#111" stroke-width="3" fill="none"/><line x1="140" y1="120" x2="145" y2="180" stroke="#111" stroke-width="4"/><text x="150" y="130" font-size="16" text-anchor="start" fill="#111">spud bar</text><rect x="200" y="180" width="14" height="60" fill="#fff" stroke="#111" stroke-width="2"/><line x1="207" y1="240" x2="207" y2="330" stroke="#111" stroke-width="2"/><ellipse cx="207" cy="335" rx="5" ry="7" fill="#e67e22" stroke="#111" stroke-width="2"/><path d="M300,330 q20,-20 40,0 q20,20 40,0" stroke="#2b7bb9" stroke-width="3" fill="none" marker-end="url(#ah)"/><text x="340" y="370" font-size="16" text-anchor="middle" fill="#111">inlets, current,</text><text x="340" y="390" font-size="16" text-anchor="middle" fill="#111">springs: weak</text><text x="260" y="100" font-size="16" text-anchor="start" fill="#111" font-weight="bold">ice picks + rope + buddy</text><circle cx="240" cy="95" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="240" y="101" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="165" cy="160" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="165" y="166" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="50" cy="265" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="50" y="271" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="455" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="455" y="256" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="450" cy="375" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="450" y="381" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="230" cy="335" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="341" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Buddy; tell someone</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Spud-test every few steps</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Measure: 4+ in. clear</text>
<text x="553" y="171" font-size="16" text-anchor="start" fill="#111">ice to walk</text>
<circle cx="530" cy="201" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="207" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="206" font-size="16" text-anchor="start" fill="#111">Gray/slushy: stay off</text>
<circle cx="530" cy="236" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="242" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="241" font-size="16" text-anchor="start" fill="#111">Avoid inlets, current</text>
<circle cx="530" cy="271" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="277" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="276" font-size="16" text-anchor="start" fill="#111">Jig near bottom</text>
<circle cx="530" cy="306" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="312" font-size="17" font-weight="bold" text-anchor="middle">7</text>
<text x="553" y="311" font-size="16" text-anchor="start" fill="#111">Fall in: turn back,</text>
<text x="553" y="330" font-size="16" text-anchor="start" fill="#111">kick, pick out, roll</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Michigan DNR: no ice is ever 100% safe. Thickness varies across</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">a lake; river ice (Grand River) is weakened by current.</text>
</svg>

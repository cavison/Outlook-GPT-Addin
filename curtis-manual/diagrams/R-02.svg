<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="50" fill="#111"/>
<text x="22" y="40" font-size="24" font-weight="bold" fill="#fff" text-anchor="start">R-02 · Small Engine Basics</text>
<rect x="80" y="200" width="200" height="140" rx="10" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="140" cy="270" r="35" fill="none" stroke="#111" stroke-width="4"/><rect x="230" y="160" width="20" height="40" fill="#fff" stroke="#111" stroke-width="3"/><text x="240" y="150" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">plug</text><rect x="290" y="230" width="60" height="60" fill="#fff" stroke="#111" stroke-width="3"/><text x="320" y="310" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">filter</text><text x="110" y="180" font-size="18" font-weight="bold" fill="#111" text-anchor="start">FUEL · SPARK · AIR</text><circle cx="140" cy="360" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="366" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">1</text><circle cx="270" cy="170" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="270" y="176" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">3</text>
<text x="410" y="88" font-size="18" font-weight="bold" fill="#111" text-anchor="start">STEPS</text>
<circle cx="422" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="115" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">1</text>
<text x="446" y="115" font-size="16" fill="#111" text-anchor="start">Check oil (level ground)</text>
<circle cx="422" cy="142" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="148" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text>
<text x="446" y="148" font-size="16" fill="#111" text-anchor="start">Fresh stabilized fuel</text>
<circle cx="422" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="181" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">3</text>
<text x="446" y="181" font-size="16" fill="#111" text-anchor="start">Plug: clean, gap per manual</text>
<circle cx="422" cy="208" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="214" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">4</text>
<text x="446" y="214" font-size="16" fill="#111" text-anchor="start">Clean/replace air filter</text>
<circle cx="422" cy="241" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="247" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">5</text>
<text x="446" y="247" font-size="16" fill="#111" text-anchor="start">Fuel valve open, choke, start</text>
<circle cx="422" cy="274" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="280" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">6</text>
<text x="446" y="280" font-size="16" fill="#111" text-anchor="start">Run carb dry before storage</text>
<rect x="20" y="412" width="760" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="34" y="438" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">⚠ CAUTION</text>
<text x="34" y="464" font-size="16" fill="#111" text-anchor="start">Cool down before refueling. Hot engine + gas = fire.</text>
</svg>

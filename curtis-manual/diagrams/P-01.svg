<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">P-01 · Lanterns and Headlamps</text><circle cx="120" cy="160" r="40" fill="#fff" stroke="#111" stroke-width="3"/><path d="M80,160 h80" stroke="#111" stroke-width="5"/><rect x="105" y="145" width="30" height="20" fill="#f1c40f" stroke="#111" stroke-width="2"/><text x="120" y="230" font-size="16" text-anchor="middle" fill="#111">headlamp each</text><rect x="280" y="210" width="110" height="160" rx="18" fill="#d6eaf8" stroke="#111" stroke-width="4"/><rect x="315" y="185" width="40" height="25" fill="#fff" stroke="#111" stroke-width="3"/><rect x="320" y="365" width="30" height="16" fill="#f1c40f" stroke="#111" stroke-width="2"/><line x1="335" y1="365" x2="335" y2="300" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><line x1="335" y1="290" x2="250" y2="240" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><line x1="335" y1="290" x2="420" y2="240" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><line x1="335" y1="290" x2="250" y2="330" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><line x1="335" y1="290" x2="420" y2="330" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="335" y="420" font-size="16" text-anchor="middle" fill="#111">headlamp under jug of water</text><text x="335" y="440" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">= room lantern</text><circle cx="120" cy="330" r="16" fill="#c0392b"/><text x="120" y="375" font-size="16" text-anchor="middle" fill="#111">red mode</text><circle cx="60" cy="130" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="136" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="410" cy="200" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="410" y="206" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="70" cy="330" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="70" y="336" font-size="17" font-weight="bold" text-anchor="middle">4</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">One headlamp each</text><circle cx="530" cy="145" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="151" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="151" font-size="16" text-anchor="start" fill="#111">Lantern hung high</text><circle cx="530" cy="181" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="187" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Jug lantern: light</text><text x="553" y="207" font-size="16" text-anchor="start" fill="#111">into water jug</text><circle cx="530" cy="237" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x
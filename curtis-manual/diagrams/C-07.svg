<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="50" fill="#111"/>
<text x="22" y="40" font-size="24" font-weight="bold" fill="#fff" text-anchor="start">C-07 · Get Your Ham Radio License</text>
<rect x="40" y="100" width="240" height="170" rx="8" fill="#fff" stroke="#111" stroke-width="4"/><text x="160" y="135" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">TECHNICIAN EXAM</text><circle cx="70" cy="165" r="8" fill="none" stroke="#111" stroke-width="2"/><line x1="90" y1="165" x2="250" y2="165" stroke="#888" stroke-width="3"/><circle cx="70" cy="195" r="8" fill="none" stroke="#111" stroke-width="2"/><line x1="90" y1="195" x2="250" y2="195" stroke="#888" stroke-width="3"/><circle cx="70" cy="225" r="8" fill="none" stroke="#111" stroke-width="2"/><line x1="90" y1="225" x2="250" y2="225" stroke="#888" stroke-width="3"/><text x="160" y="300" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">35 questions · no Morse</text><rect x="260" y="300" width="120" height="80" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><text x="320" y="335" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">FCC</text><text x="320" y="360" font-size="15" fill="#111" text-anchor="middle">callsign</text><line x1="240" y1="280" x2="280" y2="310" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><circle cx="60" cy="330" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="336" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text>
<text x="410" y="88" font-size="18" font-weight="bold" fill="#111" text-anchor="start">STEPS</text>
<circle cx="422" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="115" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">1</text>
<text x="446" y="115" font-size="16" fill="#111" text-anchor="start">Get FRN (FCC CORES)</text>
<circle cx="422" cy="142" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="148" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text>
<text x="446" y="148" font-size="16" fill="#111" text-anchor="start">Study pool: 35 questions, no Morse</text>
<circle cx="422" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="181" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">3</text>
<text x="446" y="181" font-size="16" fill="#111" text-anchor="start">Practice tests until passing</text>
<circle cx="422" cy="208" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="214" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">4</text>
<text x="446" y="214" font-size="16" fill="#111" text-anchor="start">Find a VE session (ARRL/HamStudy)</text>
<circle cx="422" cy="241" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="247" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">5</text>
<text x="446" y="247" font-size="16" fill="#111" text-anchor="start">Take exam; graded on site</text>
<circle cx="422" cy="274" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="280" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">6</text>
<text x="446" y="280" font-size="16" fill="#111" text-anchor="start">Pay FCC fee; watch ULS for call</text>
<circle cx="422" cy="307" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="313" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">7</text>
<text x="446" y="313" font-size="16" fill="#111" text-anchor="start">Join ARES/RACES or a club net</text>
<rect x="20" y="412" width="760" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="34" y="438" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">⚠ CAUTION</text>
<text x="34" y="464" font-size="16" fill="#111" text-anchor="start">Wait for your callsign in FCC ULS before transmitting.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">Q-04 · Fridge and Freezer Clock</text>
<text x="780" y="40" font-size="18" text-anchor="end" fill="#f5a623" font-weight="bold">QUICK START</text>
<line x1="30" y1="300" x2="770" y2="300" stroke="#111" stroke-width="4"/><line x1="40" y1="285" x2="40" y2="315" stroke="#111" stroke-width="4"/><text x="40" y="340" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">0 h</text><text x="40" y="365" font-size="16" text-anchor="middle" fill="#111">Power out</text><line x1="190" y1="285" x2="190" y2="315" stroke="#111" stroke-width="4"/><text x="190" y="340" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">4 h</text><text x="190" y="365" font-size="16" text-anchor="middle" fill="#111">Fridge limit*</text><line x1="420" y1="285" x2="420" y2="315" stroke="#111" stroke-width="4"/><text x="420" y="340" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">24 h</text><text x="420" y="365" font-size="16" text-anchor="middle" fill="#111">Half-full freezer</text><line x1="700" y1="285" x2="700" y2="315" stroke="#111" stroke-width="4"/><text x="700" y="340" font-size="22" text-anchor="middle" fill="#111" font-weight="bold">48 h</text><text x="700" y="365" font-size="16" text-anchor="middle" fill="#111">Full freezer</text><rect x="40" y="240" width="150" height="40" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="3"/><rect x="190" y="240" width="510" height="40" rx="0" fill="#eee" stroke="#111" stroke-width="3"/><text x="115" y="266" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">FRIDGE OK</text><text x="445" y="266" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">FREEZER (door shut)</text><text x="30" y="90" font-size="22" text-anchor="start" fill="#111" font-weight="bold">Keep doors SHUT. Every opening shortens these times.</text><circle cx="40" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="146" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="64" y="147" font-size="20" text-anchor="start" fill="#111">Note time power went out.</text><circle cx="40" cy="180" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="186" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="64" y="187" font-size="20" text-anchor="start" fill="#111">Use a thermometer: 40°F or below = safe.</text><circle cx="420" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="146" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="444" y="147" font-size="20" text-anchor="start" fill="#111">Cooler + ice for milk/meds.</text><circle cx="420" cy="180" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="186" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="444" y="187" font-size="20" text-anchor="start" fill="#c0392b" font-weight="bold">Above 40°F for 2+ h = toss.</text><text x="190" y="385" font-size="14" text-anchor="start" fill="#111">* if unopened</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Never taste-test. Spoiled food can look and smell fine.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Winter porch isn't a fridge: sun warms coolers. Use a thermometer.</text>
</svg>
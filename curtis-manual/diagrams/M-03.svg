<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="52" fill="#111"/>
<text x="22" y="41" fill="#fff" font-size="24" font-weight="bold">M-03 · Clean a Wound</text>
<path d="M40,250 L420,230 L420,300 L40,320 Z" stroke="#111" stroke-width="4" fill="none"/><line x1="260" y1="262" x2="320" y2="270" stroke="#c0392b" stroke-width="4"/><path d="M270,120 L330,120 L320,200 L280,200 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><line x1="290" y1="205" x2="290" y2="245" stroke="#2b7bb9" stroke-width="3" stroke-dasharray="6 5"/><line x1="300" y1="205" x2="300" y2="245" stroke="#2b7bb9" stroke-width="3" stroke-dasharray="6 5"/><line x1="310" y1="205" x2="310" y2="245" stroke="#2b7bb9" stroke-width="3" stroke-dasharray="6 5"/><text x="220" y="110" font-size="16" >clean running water</text><text x="40" y="400" font-size="16" >Then: thin layer of ointment + clean dressing.</text>
<text x="470" y="86" font-size="18" font-weight="bold">STEPS</text>
<circle cx="486" cy="110" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="116" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="512" y="116" font-size="16" >Wash your hands; gloves</text>
<text x="512" y="135" font-size="16" >if you have them.</text>
<circle cx="486" cy="176" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="182" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="512" y="182" font-size="16" >Stop bleeding first.</text>
<circle cx="486" cy="223" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="229" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="512" y="229" font-size="16" >Rinse under clean water</text>
<text x="512" y="248" font-size="16" >for several minutes.</text>
<circle cx="486" cy="289" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="295" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="512" y="295" font-size="16" >Pick out dirt with</text>
<text x="512" y="314" font-size="16" >clean tweezers.</text>
<circle cx="486" cy="355" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="361" font-size="18" font-weight="bold" text-anchor="middle">5</text>
<text x="512" y="361" font-size="16" >Cover; change daily or</text>
<text x="512" y="380" font-size="16" >when wet/dirty.</text>
<circle cx="350" cy="160" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="350" y="166" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<circle cx="240" cy="300" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="240" y="306" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<circle cx="60" cy="380" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="386" font-size="18" font-weight="bold" text-anchor="middle">5</text>
</svg>
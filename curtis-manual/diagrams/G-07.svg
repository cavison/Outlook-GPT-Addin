<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-07 · Foraging Rules — Ten Plants</text>
<rect x="30" y="70" width="210" height="340" fill="#eef6ee" stroke="#2e7d32" stroke-width="3"/><text x="135" y="98" font-size="17" text-anchor="middle" fill="#2e7d32" font-weight="bold">✔ OK if 100% sure</text><text x="50" y="130" font-size="16" text-anchor="start" fill="#111">dandelion</text><text x="50" y="157" font-size="16" text-anchor="start" fill="#111">plantain</text><text x="50" y="184" font-size="16" text-anchor="start" fill="#111">lamb's quarters</text><text x="50" y="211" font-size="16" text-anchor="start" fill="#111">purslane</text><text x="50" y="238" font-size="16" text-anchor="start" fill="#111">clover</text><text x="50" y="265" font-size="16" text-anchor="start" fill="#111">garlic mustard</text><text x="50" y="292" font-size="16" text-anchor="start" fill="#111">cattail (not iris)</text><text x="50" y="319" font-size="16" text-anchor="start" fill="#111">raspberry/blackberry</text><text x="50" y="346" font-size="16" text-anchor="start" fill="#111">staghorn sumac (red)</text><text x="50" y="373" font-size="16" text-anchor="start" fill="#111">black walnut</text><rect x="260" y="70" width="230" height="340" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="375" y="98" font-size="17" text-anchor="middle" fill="#c0392b" font-weight="bold">✘ NEVER</text><line x1="375" y1="230" x2="375" y2="150" stroke="#111" stroke-width="3"/><line x1="375" y1="150" x2="335" y2="125" stroke="#111" stroke-width="2"/><circle cx="335" cy="122" r="5" fill="#fff" stroke="#111" stroke-width="2"/><line x1="375" y1="150" x2="355" y2="125" stroke="#111" stroke-width="2"/><circle cx="355" cy="122" r="5" fill="#fff" stroke="#111" stroke-width="2"/><line x1="375" y1="150" x2="375" y2="125" stroke="#111" stroke-width="2"/><circle cx="375" cy="122" r="5" fill="#fff" stroke="#111" stroke-width="2"/><line x1="375" y1="150" x2="395" y2="125" stroke="#111" stroke-width="2"/><circle cx="395" cy="122" r="5" fill="#fff" stroke="#111" stroke-width="2"/><line x1="375" y1="150" x2="415" y2="125" stroke="#111" stroke-width="2"/><circle cx="415" cy="122" r="5" fill="#fff" stroke="#111" stroke-width="2"/><text x="375" y="260" font-size="16" text-anchor="middle" fill="#111">white umbrella flowers</text><text x="375" y="280" font-size="16" text-anchor="middle" fill="#111">(carrot family:</text><text x="375" y="300" font-size="16" text-anchor="middle" fill="#111">water / poison hemlock)</text><text x="375" y="340" font-size="16" text-anchor="middle" fill="#111">roadsides, sprayed</text><text x="375" y="360" font-size="16" text-anchor="middle" fill="#111">lawns, tracks,</text><text x="375" y="380" font-size="16" text-anchor="middle" fill="#111">floodwater areas</text><circle cx="30" cy="70" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="30" y="76" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="290" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="290" y="146" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="290" cy="345" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="290" y="351" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">100% ID or leave it</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Skip carrot family</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Clean sites only</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Small taste, wait a day</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">Wash; cook if unsure</text>
<circle cx="530" cy="252" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="258" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="257" font-size="16" text-anchor="start" fill="#111">Permission + DNR rules</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Hemlocks kill. No 'edibility test' or watching animals</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">proves a plant is safe. Use a photo field guide.</text>
</svg>

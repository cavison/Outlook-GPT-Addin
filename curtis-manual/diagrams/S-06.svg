ze="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="240" cy="170" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="240" y="176" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="450" cy="400" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="450" y="406" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>

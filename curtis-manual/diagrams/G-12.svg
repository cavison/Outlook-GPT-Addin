<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-12 · Fish Safety</text>
<rect x="20" y="65" width="230" height="350" fill="#eef6ee" stroke="#2e7d32" stroke-width="3"/><text x="135" y="92" font-size="18" text-anchor="middle" fill="#2e7d32" font-weight="bold">✔ FRESH</text><path d="M45,150 Q120,100 200,145 L230,125 L225,150 L230,175 L200,155 Q120,200 45,150Z" stroke="#111" stroke-width="3" fill="none"/><circle cx="75" cy="145" r="6" fill="#111"/><text x="40" y="235" font-size="16" text-anchor="start" fill="#111">mild smell</text><text x="40" y="261" font-size="16" text-anchor="start" fill="#111">firm, springs back</text><text x="40" y="287" font-size="16" text-anchor="start" fill="#111">clear eyes</text><text x="40" y="313" font-size="16" text-anchor="start" fill="#111">red gills</text><text x="40" y="339" font-size="16" text-anchor="start" fill="#111">cook to 145°F,</text><text x="40" y="365" font-size="16" text-anchor="start" fill="#111">opaque + flaky</text><rect x="260" y="65" width="230" height="350" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="375" y="92" font-size="18" text-anchor="middle" fill="#c0392b" font-weight="bold">✘ THROW OUT</text><path d="M285,150 Q360,110 440,145 L470,125 L465,150 L470,175 L440,155 Q360,190 285,150Z" stroke="#888" stroke-width="3" fill="none" stroke-dasharray="6 4"/><line x1="310" y1="140" x2="324" y2="152" stroke="#111" stroke-width="3"/><line x1="324" y1="140" x2="310" y2="152" stroke="#111" stroke-width="3"/><text x="280" y="235" font-size="16" text-anchor="start" fill="#111">sour / ammonia smell</text><text x="280" y="261" font-size="16" text-anchor="start" fill="#111">slimy, mushy</text><text x="280" y="287" font-size="16" text-anchor="start" fill="#111">dull, sunken eyes</text><text x="280" y="313" font-size="16" text-anchor="start" fill="#111">brown/gray gills</text><text x="280" y="339" font-size="16" text-anchor="start" fill="#111">from flood or</text><text x="280" y="365" font-size="16" text-anchor="start" fill="#111">sewage water</text><circle cx="135" cy="395" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="135" y="401" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="30" cy="70" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="30" y="76" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="270" cy="70" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="270" y="76" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="225" cy="365" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="225" y="371" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="470" cy="365" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="371" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Check MDHHS Eat Safe Fish</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">No flood/sewage water</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Fresh: smell + look</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Spoiled? Throw out</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">Cook to 145°F (63°C)</text>
<circle cx="530" cy="252" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="258" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="257" font-size="16" text-anchor="start" fill="#111">Pick smaller fish</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Never eat freshwater fish raw (parasites). Kids, pregnant and</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">nursing people follow the stricter MDHHS limits.</text>
</svg>

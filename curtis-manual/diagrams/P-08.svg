<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">P-08 · Use Your Car as a Charger</text><path d="M50,330 l40,-70 h170 l50,70 h70 v60 h-330 z" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="110" cy="395" r="26" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="310" cy="395" r="26" fill="#fff" stroke="#111" stroke-width="4"/><rect x="150" y="275" width="40" height="40" fill="#d6eaf8" stroke="#111" stroke-width="2"/><text x="170" y="250" font-size="16" text-anchor="middle" fill="#111">window cracked</text><rect x="385" y="370" width="20" height="10" fill="#111"/><path d="M410,375 q15,-15 30,0 t30,0" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="6 4"/><text x="450" y="410" font-size="16" text-anchor="middle" fill="#111">tailpipe</text><text x="450" y="430" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">clear of snow</text><rect x="230" y="290" width="22" height="34" rx="4" fill="#fff" stroke="#111" stroke-width="2"/><text x="240" y="345" font-size="14" text-anchor="middle" fill="#111">USB</text><path d="M50,140 h160 v80" stroke="#c0392b" stroke-width="3" fill="none"/><text x="40" y="120" font-size="18" text-anchor="start" fill="#c0392b" font-weight="bold">✘ Never in a garage</text><text x="40" y="470" font-size="18" text-anchor="start" fill="#2e7d32" font-weight="bold">✔ Outside, engine running</text><circle cx="390" cy="340" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="390" y="346" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="280" cy="270" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="280" y="276" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="220" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="220" y="306" font-size="17" font-weight="bold" text-anchor="middle">4</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">Car outside, pipe clear</text><circle cx="530" cy="145" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="151" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="151" font-size="16" text-anchor="start" fill="#111">Start engine, then plug</text><circle cx="530" cy="181" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="187" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Charge all at once</text><circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="553" y="223" font-size="16" text-anchor="start" fill="#111">Keep inverter load small</text><circle cx="530" cy="253" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="259" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="553" y="259" font-size="16" text-anchor="start" fill="#111">Window cracked, awake</text><circle cx="530" cy="289" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="295" font-size="17" font-weight="bold" text-anchor="middle">6</text><text x="553" y="295" font-size="16" text-anchor="start" fill="#111">Unplug, then shut off</text><circle cx="530" cy="325" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="331" font-size="17" font-weight="bold" text-anchor="middle">7</text><text x="553" y="331" font-size="16" text-anchor="start" fill="#111">Watch fuel level</text></svg>

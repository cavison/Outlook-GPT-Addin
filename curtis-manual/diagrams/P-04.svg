<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">P-04 · Generator Placement</text><polygon points="20,240 105.0,163.5 190,240" stroke="#111" fill="none" stroke-width="3"/><rect x="30" y="240" width="150" height="170" stroke="#111" fill="none" stroke-width="3"/><rect x="50" y="270" width="45" height="40" fill="#d6eaf8" stroke="#111" stroke-width="3"/><rect x="125" y="330" width="35" height="80" fill="none" stroke="#111" stroke-width="3"/><circle cx="140" cy="280" r="14" fill="#fff" stroke="#c0392b" stroke-width="3"/><text x="140" y="285" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">CO</text><line x1="185" y1="440" x2="355" y2="440" stroke="#111" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="270" y="470" font-size="20" text-anchor="middle" fill="#111" font-weight="bold">20+ FEET</text><rect x="355" y="365" width="90" height="60" rx="8" fill="#e67e22" stroke="#111" stroke-width="4"/><circle cx="370" cy="430" r="10" fill="#111"/><circle cx="430" cy="430" r="10" fill="#111"/><text x="400" y="402" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">GEN</text><path d="M445,380 q15,-15 30,0 t30,0" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="6 4"/><text x="470" y="360" font-size="16" text-anchor="end" fill="#111">exhaust away</text><path d="M355,400 C300,400 260,380 180,380" stroke="#111" stroke-width="3" fill="none"/><text x="270" y="370" font-size="16" text-anchor="middle" fill="#111">outdoor cord</text><rect x="210" y="90" width="110" height="90" fill="none" stroke="#c0392b" stroke-width="3"/><text x="265" y="110" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">GARAGE</text><rect x="245" y="135" width="40" height="28" fill="#e67e22" stroke="#111" stroke-width="2"/><line x1="215" y1="95" x2="315" y2="175" stroke="#c0392b" stroke-width="4"/><line x1="315" y1="95" x2="215" y2="175" stroke="#c0392b" stroke-width="4"/><text x="210" y="205" font-size="18" text-anchor="start" fill="#c0392b" font-weight="bold">✘ never in garage</text><circle cx="400" cy="300" r="22" fill="none" stroke="#111" stroke-width="2"/><text x="400" y="306" font-size="16" text-anchor="middle" fill="#111">❄</text><circle cx="400" cy="340" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="400" y="346" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="490" cy="385" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="490" y="391" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="140" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="256" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="455" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="455" y="306" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="220" cy="395" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="220" y="401" font-size="17" font-weight="bold" text-anchor="middle">5</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">Outside, 20+ ft,</text><text x="553" y="135" font-size="16" text-anchor="start" fill="#111">dry ground</text><circle cx="530" cy="165" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="171" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="171" font-size="16" text-anchor="start" fill="#111">Exhaust away from</text><text x="553" y="191" font-size="16" text-anchor="start" fill="#111">doors, windows</text><circle cx="530" cy="221" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="227" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="227" font-size="16" text-anchor="start" fill="#111">CO alarm every floor</text><circle cx="530" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="263" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="553" y="263" font-size="16" text-anchor="start" fill="#111">Cool down before</text><text x="553" y="283" font-size="16" text-anchor="start" fill="#111">refueling</text><circle cx="530" cy="313" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="319" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="553" y="319" font-size="16" text-anchor="start" fill="#111">Cords or transfer</text><text x="553" y="339" font-size="16" text-anchor="start" fill="#111">switch. NO backfeed</text><rect x="512" y="367" width="272" height="64" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="522" y="387" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">⚠ CAUTION</text><text x="522" y="407" font-size="16" text-anchor="start" fill="#111">Never in a garage, even</text><text x="522" y="427" font-size="16" text-anchor="start" fill="#111">with the door open.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-17 · Backyard Chickens</text>
<path d="M50,180 L170,100 L290,180Z" fill="#fff" stroke="#111" stroke-width="3"/><rect x="60" y="180" width="220" height="150" stroke="#111" stroke-width="3" fill="none"/><line x1="80" y1="230" x2="200" y2="230" stroke="#5b3a1a" stroke-width="6"/><text x="140" y="220" font-size="16" text-anchor="middle" fill="#111">roost</text><rect x="210" y="270" width="60" height="50" fill="#f3e3a0" stroke="#111" stroke-width="3"/><text x="240" y="350" font-size="16" text-anchor="middle" fill="#111">nest box</text><rect x="290" y="200" width="190" height="130" fill="none" stroke="#111" stroke-width="3"/><line x1="309" y1="200" x2="309" y2="330" stroke="#888" stroke-width="1.5"/><line x1="328" y1="200" x2="328" y2="330" stroke="#888" stroke-width="1.5"/><line x1="347" y1="200" x2="347" y2="330" stroke="#888" stroke-width="1.5"/><line x1="366" y1="200" x2="366" y2="330" stroke="#888" stroke-width="1.5"/><line x1="385" y1="200" x2="385" y2="330" stroke="#888" stroke-width="1.5"/><line x1="404" y1="200" x2="404" y2="330" stroke="#888" stroke-width="1.5"/><line x1="423" y1="200" x2="423" y2="330" stroke="#888" stroke-width="1.5"/><line x1="442" y1="200" x2="442" y2="330" stroke="#888" stroke-width="1.5"/><line x1="461" y1="200" x2="461" y2="330" stroke="#888" stroke-width="1.5"/><line x1="290" y1="219" x2="480" y2="219" stroke="#888" stroke-width="1.5"/><line x1="290" y1="238" x2="480" y2="238" stroke="#888" stroke-width="1.5"/><line x1="290" y1="257" x2="480" y2="257" stroke="#888" stroke-width="1.5"/><line x1="290" y1="276" x2="480" y2="276" stroke="#888" stroke-width="1.5"/><line x1="290" y1="295" x2="480" y2="295" stroke="#888" stroke-width="1.5"/><line x1="290" y1="314" x2="480" y2="314" stroke="#888" stroke-width="1.5"/><text x="385" y="190" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">hardware cloth run + roof</text><path d="M290,330 L290,360 L250,360 M480,330 L480,360 L520,360" stroke="#2e7d32" stroke-width="3" fill="none"/><text x="385" y="385" font-size="16" text-anchor="middle" fill="#2e7d32">apron along ground</text><ellipse cx="370" cy="300" rx="25" ry="18" stroke="#111" stroke-width="3" fill="none"/><circle cx="395" cy="280" r="9" stroke="#111" stroke-width="3" fill="none"/><path d="M403,280 l8,3 l-8,3" fill="#e67e22" stroke="#111" stroke-width="1"/><text x="170" y="420" font-size="18" text-anchor="middle" fill="#c0392b" font-weight="bold">lock in at dusk</text><circle cx="470" cy="230" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="236" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="120" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="306" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="210" cy="260" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="210" y="266" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="340" cy="260" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="266" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Predator-proof; lock at dusk</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Feed + unfrozen water</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Crushed shell for calcium</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Collect eggs daily</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">Broilers: ~6–8 weeks</text>
<circle cx="530" cy="252" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="258" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="257" font-size="16" text-anchor="start" fill="#111">Old hens: stew slowly</text>
<circle cx="530" cy="287" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="293" font-size="17" font-weight="bold" text-anchor="middle">7</text>
<text x="553" y="292" font-size="16" text-anchor="start" fill="#111">Cook chicken to 165°F</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Live poultry carry Salmonella. Wash hands, keep birds out of</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">kitchen. Check ordinances; report die-offs to MDARD.</text>
</svg>

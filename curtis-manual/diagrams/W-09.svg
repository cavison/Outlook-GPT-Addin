<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-09 · Solar Disinfection (SODIS)</text>
<circle cx="80" cy="110" r="35" fill="none" stroke="#e67e22" stroke-width="4"/><line x1="130" y1="110" x2="145" y2="110" stroke="#e67e22" stroke-width="4"/><line x1="80" y1="160" x2="80" y2="175" stroke="#e67e22" stroke-width="4"/><line x1="30" y1="110" x2="15" y2="110" stroke="#e67e22" stroke-width="4"/><line x1="80" y1="60" x2="80" y2="45" stroke="#e67e22" stroke-width="4"/><line x1="115.0" y1="145.0" x2="125.5" y2="155.5" stroke="#e67e22" stroke-width="4"/><line x1="45.0" y1="145.0" x2="34.5" y2="155.5" stroke="#e67e22" stroke-width="4"/><line x1="115.0" y1="75.0" x2="125.5" y2="64.5" stroke="#e67e22" stroke-width="4"/><rect x="130" y="260" width="220" height="40" rx="18" fill="#d6eaf8" stroke="#111" stroke-width="3"/><rect x="130" y="260" width="220" height="40" rx="18" fill="none" stroke="#111" stroke-width="3"/><rect x="350" y="270" width="20" height="20" rx="0" fill="none" stroke="#111" stroke-width="3"/><line x1="110" y1="310" x2="380" y2="310" stroke="#888" stroke-width="6"/><text x="240" y="340" font-size="16" text-anchor="middle" fill="#111">metal roof or foil, on its side</text><circle cx="210" cy="230" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="210" y="236" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="300" cy="230" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="236" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="140" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="116" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="200" y="160" font-size="22" text-anchor="start" fill="#111" font-weight="bold">6 h sun</text><text x="200" y="190" font-size="18" text-anchor="start" fill="#111">2 days if cloudy</text><circle cx="360" cy="160" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="166" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Clear water only.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">3/4 fill, shake, top off.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">On side in full sun.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">6 h sun, or 2 days if cloudy.</text>
<circle cx="420" cy="204" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="210" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="444" y="210" font-size="17" text-anchor="start" fill="#111">Drink from the bottle.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Cloudy water, glass, or bottles over 2 L: SODIS fails.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Unreliable in Michigan winter: low sun and lake-effect clouds.</text>
</svg>
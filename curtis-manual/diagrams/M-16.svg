<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="50" fill="#111"/>
<text x="22" y="40" font-size="24" font-weight="bold" fill="#fff">M-16 · Rabies and Animal Bites</text>
<path d="M60,90 L60,130 L110,130" stroke="#111" stroke-width="4" fill="none"/>
<line x1="110" y1="135" x2="110" y2="175" stroke="#2b7bb9" stroke-width="4" marker-end="url(#ah)"/>
<ellipse cx="130" cy="210" rx="90" ry="28" fill="#f2d7c9" stroke="#111" stroke-width="3"/>
<text x="130" y="270" font-size="18" font-weight="bold" fill="#2b7bb9" text-anchor="middle">soap + water 15 min</text>
<circle cx="220" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="220" y="146" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">1</text>
<path d="M250,320 Q280,290 310,320 Q340,290 370,320 L310,340 Z" fill="#888" stroke="#111" stroke-width="3"/>
<text x="310" y="365" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">bats: call even if no bite</text>
<circle cx="380" cy="290" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="380" y="296" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">7</text>
<text x="40" y="320" font-size="16" font-weight="bold" fill="#111" text-anchor="start">Report to Ottawa</text>
<text x="40" y="342" font-size="16" font-weight="bold" fill="#111" text-anchor="start">County Health</text>
<circle cx="150" cy="380" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="150" y="386" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">4</text>
<text x="410" y="88" font-size="18" font-weight="bold" fill="#111" text-anchor="start">STEPS</text>
<circle cx="422" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="115" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">1</text>
<text x="446" y="115" font-size="16" fill="#111" text-anchor="start">Wash 15 min, soap + water</text>
<circle cx="422" cy="139" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="145" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text>
<text x="446" y="145" font-size="16" fill="#111" text-anchor="start">Clean and cover wound</text>
<circle cx="422" cy="169" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="175" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">3</text>
<text x="446" y="175" font-size="16" fill="#111" text-anchor="start">Write down animal, place, time</text>
<circle cx="422" cy="199" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="205" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">4</text>
<text x="446" y="205" font-size="16" fill="#111" text-anchor="start">Call county health / doctor</text>
<circle cx="422" cy="229" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="235" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">5</text>
<text x="446" y="235" font-size="16" fill="#111" text-anchor="start">PEP is urgent — don't wait</text>
<circle cx="422" cy="259" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="265" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">6</text>
<text x="446" y="265" font-size="16" fill="#111" text-anchor="start">Confine biting pet</text>
<circle cx="422" cy="289" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="295" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">7</text>
<text x="446" y="295" font-size="16" fill="#111" text-anchor="start">Bat in sleeping room: report</text>
<circle cx="422" cy="319" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="325" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">8</text>
<text x="446" y="325" font-size="16" fill="#111" text-anchor="start">Watch for infection</text>
<rect x="20" y="412" width="760" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="34" y="438" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">⚠ CAUTION</text>
<text x="34" y="464" font-size="16" fill="#111" text-anchor="start">Not a substitute for professional care. Never handle strange-acting wild animals.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-15 · Clean Small Game Safely</text>
<path d="M80,80 l40,0 l-10,40 l-20,0z" fill="#fff" stroke="#2b7bb9" stroke-width="3"/><path d="M130,80 l40,0 l-10,40 l-20,0z" fill="#fff" stroke="#2b7bb9" stroke-width="3"/><text x="125" y="145" font-size="16" text-anchor="middle" fill="#2b7bb9" font-weight="bold">gloves on</text><ellipse cx="300" cy="220" rx="120" ry="55" stroke="#111" stroke-width="3" fill="none"/><line x1="180" y1="220" x2="420" y2="220" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/><text x="300" y="200" font-size="16" text-anchor="middle" fill="#111">pull skin apart</text><path d="M290,215 l-30,-25 M310,225 l30,25" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><path d="M60,330 q50,-50 100,0 q-50,40 -100,0z" fill="#fff" stroke="#111" stroke-width="3"/><text x="110" y="380" font-size="16" text-anchor="middle" fill="#2e7d32" font-weight="bold">smooth liver: OK</text><path d="M270,330 q50,-50 100,0 q-50,40 -100,0z" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="290" cy="325" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/><circle cx="304" cy="333" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/><circle cx="318" cy="325" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/><circle cx="332" cy="333" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/><circle cx="346" cy="325" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="320" y="380" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">white spots: DISCARD</text><text x="300" y="410" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">cook to 160°F (71°C)</text><circle cx="60" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="96" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="440" cy="200" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="440" y="206" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="250" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="306" font-size="17" font-weight="bold" text-anchor="middle">6</text><circle cx="450" cy="400" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="450" y="406" font-size="17" font-weight="bold" text-anchor="middle">7</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Gloves the whole time</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Skip sick-acting animals</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Skin: pull like a sweater</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Off: head, feet</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">Gut; don't cut intestines</text>
<circle cx="530" cy="252" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="258" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="257" font-size="16" text-anchor="start" fill="#111">Spotted liver? Discard all</text>
<circle cx="530" cy="287" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="293" font-size="17" font-weight="bold" text-anchor="middle">7</text>
<text x="553" y="292" font-size="16" text-anchor="start" fill="#111">Rinse, chill, cook 160°F</text>
<circle cx="530" cy="322" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="328" font-size="17" font-weight="bold" text-anchor="middle">8</text>
<text x="553" y="327" font-size="16" text-anchor="start" fill="#111">Bleach tools, wash hands</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Rabbits/rodents can carry tularemia (cuts, eyes, undercooked</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">meat). Gloves + thorough cooking. Don't eat brains.</text>
</svg>

text><circle cx="170" cy="260" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="170" y="266" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="300" cy="150" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="156" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="470" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="306" font-size="17" font-weight="bold" text-anchor="middle">6</text>

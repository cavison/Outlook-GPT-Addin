<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Keep apples and pears away from potatoes and carrots (ethylene).</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">Keep potatoes dark — green ones contain solanine.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="52" fill="#111"/>
<text x="22" y="41" fill="#fff" font-size="24" font-weight="bold">M-10 · Medication Reserve</text>
<rect x="60" y="200" width="70" height="120" rx="8" stroke="#111" stroke-width="3" fill="none"/><rect x="60" y="180" width="70" height="20" fill="#fff" stroke="#111" stroke-width="3"/><rect x="160" y="200" width="70" height="120" rx="8" stroke="#111" stroke-width="3" fill="none"/><rect x="160" y="180" width="70" height="20" fill="#fff" stroke="#111" stroke-width="3"/><rect x="260" y="200" width="70" height="120" rx="8" stroke="#111" stroke-width="3" fill="none"/><rect x="260" y="180" width="70" height="20" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="360" font-size="16" font-weight="bold">Rotate: first in, first out</text><text x="60" y="390" font-size="16" >Store cool, dry, dark</text><text x="60" y="440" font-size="16" >Ask doctor + pharmacist + insurer</text>
<text x="470" y="86" font-size="18" font-weight="bold">STEPS</text>
<circle cx="486" cy="110" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="116" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="512" y="116" font-size="16" >List every med, dose,</text>
<text x="512" y="135" font-size="16" >prescriber.</text>
<circle cx="486" cy="176" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="182" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="512" y="182" font-size="16" >Ask doctor about</text>
<text x="512" y="201" font-size="16" >90-day supplies.</text>
<circle cx="486" cy="242" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="248" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="512" y="248" font-size="16" >Use mail-order or</text>
<text x="512" y="267" font-size="16" >early-refill rules.</text>
<circle cx="486" cy="308" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="314" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="512" y="314" font-size="16" >Rotate oldest first;</text>
<text x="512" y="333" font-size="16" >keep cool + dry.</text>
<circle cx="95" cy="160" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="95" y="166" font-size="18" font-weight="bold" text-anchor="middle">1</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-10 · Rain Barrel and Roof Catchment</text>
<polygon points="30,170 120.0,94.0 210,170" fill="none" stroke="#111" stroke-width="4"/><rect x="40" y="170" width="160" height="190" rx="0" fill="none" stroke="#111" stroke-width="4"/><path d="M200,170 h30 v120" fill="none" stroke="#111" stroke-width="4"/><circle cx="230" cy="150" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="156" font-size="17" font-weight="bold" text-anchor="middle">1</text><rect x="220" y="220" width="20" height="60" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="260" y="250" font-size="16" text-anchor="start" fill="#111">first flush</text><circle cx="300" cy="230" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="236" font-size="17" font-weight="bold" text-anchor="middle">2</text><rect x="210" y="290" width="70" height="80" rx="8" fill="#d6eaf8" stroke="#111" stroke-width="3"/><rect x="210" y="290" width="70" height="80" rx="8" fill="none" stroke="#111" stroke-width="4"/><line x1="210" y1="300" x2="280" y2="300" stroke="#888" stroke-width="2" stroke-dasharray="4 3"/><circle cx="300" cy="310" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="316" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="245" y="390" font-size="16" text-anchor="middle" fill="#111">screened lid</text><line x1="330" y1="330" x2="380" y2="330" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><text x="330" y="360" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">treat</text><circle cx="380" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="380" y="306" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Barrel on a level, solid base.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Divert the first flush.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Screen and lid on.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Treat before drinking.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Roof water carries droppings and chemicals. Always treat it.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Drain barrels before hard freezes; they crack in Michigan winters.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="52" fill="#111"/>
<text x="22" y="41" fill="#fff" font-size="24" font-weight="bold">M-12 · Spot Infection Early</text>
<path d="M40,250 L420,230 L420,300 L40,320 Z" stroke="#111" stroke-width="4" fill="none"/><line x1="270" y1="265" x2="310" y2="270" stroke="#111" stroke-width="4"/><ellipse cx="290" cy="268" rx="50" ry="22" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/><path d="M240,268 L120,270" stroke="#c0392b" stroke-width="3"/><text x="110" y="215" font-size="16" fill="#c0392b">red streak spreading</text><text x="40" y="380" font-size="16" font-weight="bold">Pen-mark the red edge + time.</text><text x="40" y="405" font-size="16" >Growing? Fever? Streak? → get help.</text>
<text x="470" y="86" font-size="18" font-weight="bold">STEPS</text>
<circle cx="486" cy="110" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="116" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="512" y="116" font-size="16" >Check wound daily</text>
<text x="512" y="135" font-size="16" >in good light.</text>
<circle cx="486" cy="176" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="182" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="512" y="182" font-size="16" >Mark red edge with pen;</text>
<text x="512" y="201" font-size="16" >write date/time.</text>
<circle cx="486" cy="242" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="248" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="512" y="248" font-size="16" >Red, warm, swelling,</text>
<text x="512" y="267" font-size="16" >pus, worse pain = infection.</text>
<circle cx="486" cy="308" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="314" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="512" y="314" font-size="16" >Spreading, streaks, fever</text>
<text x="512" y="333" font-size="16" >= seek care now.</text>
<circle cx="350" cy="230" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="350" y="236" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<circle cx="100" cy="270" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="100" y="276" font-size="18" font-weight="bold" text-anchor="middle">4</text>
</svg>
"#111" stroke-width="3"/><text x="40" y="196" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="100" cy="220" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="100" y="226" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="140" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="306" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="270" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="270" y="181" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="470" cy="220" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="226" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="320" cy="390" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="320" y="396" font-size="17" font-weight="bold" text-anchor="middle">6</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="52" fill="#111"/>
<text x="22" y="41" fill="#fff" font-size="24" font-weight="bold">M-04 · Close a Wound — or Not</text>
<rect x="40" y="110" width="190" height="130" stroke="#111" stroke-width="3" fill="none"/><text x="50" y="145" font-size="30" fill="#2e7d32" font-weight="bold">✔</text><text x="85" y="140" font-size="16" >Clean, small,</text><text x="85" y="160" font-size="16" >fresh, edges meet</text><rect x="80" y="185" width="14" height="40" fill="#fff" stroke="#111" stroke-width="3"/><rect x="120" y="185" width="14" height="40" fill="#fff" stroke="#111" stroke-width="3"/><rect x="160" y="185" width="14" height="40" fill="#fff" stroke="#111" stroke-width="3"/><line x1="70" y1="205" x2="200" y2="205" stroke="#c0392b" stroke-width="3"/><rect x="240" y="110" width="200" height="300" stroke="#111" stroke-width="3" fill="none"/><text x="250" y="145" font-size="30" fill="#c0392b" font-weight="bold">✘</text><text x="285" y="140" font-size="16" font-weight="bold">Leave OPEN:</text><text x="255" y="170" font-size="16" >bites (animal/human)</text><text x="255" y="194" font-size="16" >punctures</text><text x="255" y="218" font-size="16" >dirty / crushed</text><text x="255" y="242" font-size="16" >older than hours</text><text x="255" y="266" font-size="16" >deep, gaping, face,</text><text x="255" y="290" font-size="16" >hand, joint</text><text x="255" y="314" font-size="16" >→ pack + cover,</text><text x="255" y="338" font-size="16" >get care</text>
<text x="470" y="86" font-size="18" font-weight="bold">STEPS</text>
<circle cx="486" cy="110" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="116" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="512" y="116" font-size="16" >Clean thoroughly first.</text>
<circle cx="486" cy="157" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="163" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="512" y="163" font-size="16" >Only close clean, small,</text>
<text x="512" y="182" font-size="16" >fresh cuts.</text>
<circle cx="486" cy="223" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="229" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="512" y="229" font-size="16" >Pull edges together; apply</text>
<text x="512" y="248" font-size="16" >strips across the cut.</text>
<circle cx="486" cy="289" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="295" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="512" y="295" font-size="16" >Leave dirty wounds/bites</text>
<text x="512" y="314" font-size="16" >open; dress loosely.</text>
<circle cx="486" cy="355" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="361" font-size="18" font-weight="bold" text-anchor="middle">5</text>
<text x="512" y="361" font-size="16" >Watch daily for infection.</text>
<circle cx="210" cy="125" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="210" y="131" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<circle cx="200" cy="230" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="200" y="236" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<circle cx="420" cy="125" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="131" font-size="18" font-weight="bold" text-anchor="middle">4</text>
</svg>
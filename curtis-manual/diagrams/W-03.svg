<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-03 · Bathtub and Container Storage</text>
<rect x="40" y="220" width="220" height="100" rx="30" fill="#d6eaf8" stroke="#111" stroke-width="3"/><rect x="40" y="220" width="220" height="100" rx="30" fill="none" stroke="#111" stroke-width="4"/><text x="150" y="275" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">tub: flush/wash</text><circle cx="40" cy="205" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="211" font-size="17" font-weight="bold" text-anchor="middle">1</text><rect x="50" y="131.0" width="50" height="49.0" fill="#d6eaf8"/><rect x="50" y="110" width="50" height="70" rx="8" fill="none" stroke="#111" stroke-width="3"/><rect x="67.5" y="96" width="15.0" height="14" rx="0" fill="none" stroke="#111" stroke-width="3"/><path d="M100,122 q18,0 18,18 q0,18 -18,18" fill="none" stroke="#111" stroke-width="3"/><rect x="130" y="131.0" width="50" height="49.0" fill="#d6eaf8"/><rect x="130" y="110" width="50" height="70" rx="8" fill="none" stroke="#111" stroke-width="3"/><rect x="147.5" y="96" width="15.0" height="14" rx="0" fill="none" stroke="#111" stroke-width="3"/><path d="M180,122 q18,0 18,18 q0,18 -18,18" fill="none" stroke="#111" stroke-width="3"/><text x="50" y="98" font-size="16" text-anchor="start" fill="#2e7d32" font-weight="bold">✔ food-grade</text><circle cx="205" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="205" y="126" font-size="17" font-weight="bold" text-anchor="middle">2</text><rect x="260" y="110" width="50" height="70" rx="8" fill="none" stroke="#111" stroke-width="3"/><rect x="277.5" y="96" width="15.0" height="14" rx="0" fill="none" stroke="#111" stroke-width="3"/><path d="M310,122 q18,0 18,18 q0,18 -18,18" fill="none" stroke="#111" stroke-width="3"/><text x="250" y="98" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">✘ milk jug</text><circle cx="340" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="126" font-size="17" font-weight="bold" text-anchor="middle">3</text><rect x="290" y="230" width="100" height="90" rx="0" fill="#eee" stroke="#111" stroke-width="3"/><text x="340" y="280" font-size="16" text-anchor="middle" fill="#111">dark, cool</text><circle cx="300" cy="215" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="221" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="80" y="360" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">no toddlers near open water</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Tub: flushing and washing.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Food-grade jugs or soda bottles.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">No milk jugs or chemical jugs.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Cap, store cool and dark.</text>
<circle cx="420" cy="204" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="210" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="444" y="210" font-size="17" text-anchor="start" fill="#111">Keep away from gas and paint.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Open water drowns toddlers. Cover buckets, shut the bathroom door.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Freeze filled 2-liter bottles: they keep food cold, then you drink them.</text>
</svg>
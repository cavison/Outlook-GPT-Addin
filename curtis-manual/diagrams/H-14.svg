<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">H-14 · Extinguishers and Escape</text><rect x="80" y="160" width="70" height="200" rx="25" fill="#c0392b" stroke="#111" stroke-width="4"/><text x="115" y="270" font-size="18" text-anchor="middle" fill="#fff" font-weight="bold">ABC</text><path d="M115,160 v-30 h60 v40" stroke="#111" stroke-width="5" fill="none"/><path d="M220,330 q40,-30 80,0" stroke="#111" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M260,380 c-12.0,-14.0 -6.0,-30.0 0,-42.0 c6.0,12.0 12.0,28.0 0,42.0z" fill="#e67e22" stroke="#111" stroke-width="2"/><text x="260" y="410" font-size="16" text-anchor="middle" fill="#111">aim at BASE</text><text x="60" y="410" font-size="22" text-anchor="start" fill="#111" font-weight="bold">P-A-S-S</text><rect x="330" y="90" width="140" height="120" fill="none" stroke="#111" stroke-width="3"/><text x="400" y="125" font-size="16" text-anchor="middle" fill="#111">2 ways out</text><line x1="400" y1="160" x2="330" y2="160" stroke="#2e7d32" stroke-width="3" marker-end="url(#arG)"/><line x1="400" y1="160" x2="470" y2="160" stroke="#2e7d32" stroke-width="3" marker-end="url(#arG)"/><path d="M340,470 q60,-40 120,0" fill="none" stroke="#888" stroke-width="3"/><text x="400" y="445" font-size="16" text-anchor="middle" fill="#111">crawl under smoke</text><circle cx="360" cy="230" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="236" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="60" cy="380" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="386" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="470" cy="430" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="436" font-size="17" font-weight="bold" text-anchor="middle">5</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">2 ways out + meet spot</text><circle cx="530" cy="145" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="151" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="151" font-size="16" text-anchor="start" fill="#111">Fight only small fire,</text><text x="553" y="171" font-size="16" text-anchor="start" fill="#111">exit at your back</text><circle cx="530" cy="201" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="207" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="207" font-size="16" text-anchor="start" fill="#111">Pull, Aim, Squeeze, Sweep</text><circle cx="530" cy="237" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="243" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="553" y="243" font-size="16" text-anchor="start" fill="#111">Growing? Leave, shut door</text><circle cx="530" cy="273" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="279" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="553" y="279" font-size="16" text-anchor="start" fill="#111">Crawl low, test door</text><text x="553" y="299" font-size="16" text-anchor="start" fill="#111">with back of hand</text><circle cx="530" cy="329" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="335" font-size="17" font-weight="bold" text-anchor="middle">6</text><text x="553" y="335" font-size="16" text-anchor="start" fill="#111">Stay out, call 911</text><circle cx="530" cy="365" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="371" font-size="17" font-weight="bold" text-anchor="middle">7</text><text x="553" y="371" font-size="16" text-anchor="start" fill="#111">Drill in the dark</text></svg>

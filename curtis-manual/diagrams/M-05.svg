<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="52" fill="#111"/>
<text x="22" y="41" fill="#fff" font-size="24" font-weight="bold">M-05 · Treat Burns</text>
<path d="M40,250 L420,230 L420,300 L40,320 Z" stroke="#111" stroke-width="4" fill="none"/><ellipse cx="300" cy="268" rx="40" ry="16" fill="#e67e22" opacity="0.6"/><path d="M270,120 L330,120 L320,190 L280,190 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><line x1="290" y1="195" x2="290" y2="240" stroke="#2b7bb9" stroke-width="3" stroke-dasharray="6 5"/><line x1="300" y1="195" x2="300" y2="240" stroke="#2b7bb9" stroke-width="3" stroke-dasharray="6 5"/><line x1="310" y1="195" x2="310" y2="240" stroke="#2b7bb9" stroke-width="3" stroke-dasharray="6 5"/><text x="210" y="110" font-size="16" font-weight="bold">COOL running water</text><text x="40" y="400" font-size="30" fill="#c0392b" font-weight="bold">✘</text><text x="75" y="395" font-size="16" >No ice, butter, or popping blisters</text>
<text x="470" y="86" font-size="18" font-weight="bold">STEPS</text>
<circle cx="486" cy="110" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="116" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="512" y="116" font-size="16" >Stop the burning;</text>
<text x="512" y="135" font-size="16" >remove rings/tight items.</text>
<circle cx="486" cy="176" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="182" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="512" y="182" font-size="16" >Cool with cool (not cold)</text>
<text x="512" y="201" font-size="16" >water ~20 min.</text>
<circle cx="486" cy="242" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="248" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="512" y="248" font-size="16" >Cover loosely with</text>
<text x="512" y="267" font-size="16" >clean non-stick dressing.</text>
<circle cx="486" cy="308" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="314" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="512" y="314" font-size="16" >Large, deep, face/hands/</text>
<text x="512" y="333" font-size="16" >genitals, chemical: get help.</text>
<circle cx="360" cy="300" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="306" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<circle cx="350" cy="160" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="350" y="166" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<circle cx="230" cy="300" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="306" font-size="18" font-weight="bold" text-anchor="middle">3</text>

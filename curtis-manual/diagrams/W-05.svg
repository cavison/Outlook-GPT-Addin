<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-05 · Boil Water Safely</text>
<rect x="90" y="210" width="200" height="110" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="4"/><rect x="90" y="210" width="200" height="110" rx="0" fill="none" stroke="#111" stroke-width="4"/><line x1="70" y1="210" x2="310" y2="210" stroke="#111" stroke-width="4"/><circle cx="120" cy="240" r="8" fill="none" stroke="#2b7bb9" stroke-width="3"/><circle cx="155" cy="260" r="8" fill="none" stroke="#2b7bb9" stroke-width="3"/><circle cx="190" cy="240" r="8" fill="none" stroke="#2b7bb9" stroke-width="3"/><circle cx="225" cy="260" r="8" fill="none" stroke="#2b7bb9" stroke-width="3"/><circle cx="260" cy="240" r="8" fill="none" stroke="#2b7bb9" stroke-width="3"/><path d="M120,350 q10,-20 0,-30 M170,350 q10,-20 0,-30 M220,350 q10,-20 0,-30 M270,350 q10,-20 0,-30" fill="none" stroke="#e67e22" stroke-width="4"/><circle cx="70" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="70" y="256" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="190" y="180" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">ROLLING BOIL</text><circle cx="300" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="181" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="330" cy="110" r="30" fill="none" stroke="#111" stroke-width="3"/><line x1="330" y1="110" x2="330" y2="90" stroke="#111" stroke-width="3"/><line x1="330" y1="110" x2="345" y2="118" stroke="#111" stroke-width="3"/><text x="330" y="160" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">1 min</text><circle cx="380" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="380" y="96" font-size="17" font-weight="bold" text-anchor="middle">3</text><rect x="60" y="116.5" width="40" height="38.5" fill="#d6eaf8"/><rect x="60" y="100" width="40" height="55" rx="8" fill="none" stroke="#111" stroke-width="3"/><rect x="74.0" y="86" width="12.0" height="14" rx="0" fill="none" stroke="#111" stroke-width="3"/><path d="M100,112 q18,0 18,18 q0,18 -18,18" fill="none" stroke="#111" stroke-width="3"/><circle cx="40" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="96" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Settle and filter cloudy water.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Rolling boil.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Keep boiling 1 minute.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Cool covered; store clean.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Stoves and grills outside only. Boiling won't remove fuel or lead.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Use a lid: faster boil, less fuel. Michigan = always 1 minute.</text>
</svg>
<text x="354" y="128" font-size="22" text-anchor="start" fill="#111" font-weight="bold">Blankets over windows at night.</text>
<circle cx="330" cy="160" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="330" y="166" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="354" y="166" font-size="22" text-anchor="start" fill="#111" font-weight="bold">Bed in a blanket tent.</text>

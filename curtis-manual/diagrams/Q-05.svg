<text x="354" y="204" font-size="22" text-anchor="start" fill="#111" font-weight="bold">Everyone in. Pets too.</text>
<circle cx="330" cy="236" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="330" y="242" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="354" y="242" font-size="22" text-anchor="start" fill="#111" font-weight="bold">Dry layers, hats, socks.</text>

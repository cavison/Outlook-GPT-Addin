<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-12 · Sprout Seeds and Beans</text>
<path d="M120,120 L220,120 L230,330 L110,330 Z" fill="#fff" stroke="#111" stroke-width="3"/><rect x="115" y="105" width="110" height="15" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><line x1="120" y1="112" x2="220" y2="112" stroke="#888" stroke-width="2" stroke-dasharray="4 3"/><circle cx="140" cy="300" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="153" cy="293" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="166" cy="286" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="179" cy="279" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="192" cy="272" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="205" cy="265" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="148" cy="298" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="161" cy="291" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="174" cy="284" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="187" cy="277" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="200" cy="270" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><circle cx="143" cy="263" r="5" fill="#e8d8a0" stroke="#111" stroke-width="1"/><line x1="110" y1="200" x2="230" y2="200" stroke="#2b7bb9" stroke-width="3"/><text x="170" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">soak 8-12 h</text><circle cx="90" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="90" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="250" cy="220" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="226" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><g transform="rotate(135 360 260)"><path d="M310,180 L410,180 L420,340 L300,340 Z" fill="#fff" stroke="#111" stroke-width="3"/></g><path d="M300,330 Q360,380 420,330" fill="none" stroke="#111" stroke-width="3"/><line x1="300" y1="330" x2="420" y2="330" stroke="#111" stroke-width="3"/><path d="M330,310 l-5,20 M345,305 l0,20" fill="none" stroke="#2b7bb9" stroke-width="2"/><text x="360" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">tilt to drain</text><circle cx="440" cy="200" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="440" y="206" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><text x="60" y="410" font-size="16" font-weight="bold" text-anchor="start" fill="#111">rinse 2-3x/day</text><circle cx="40" cy="404" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="410" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Measure seeds into jar</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Soak 8-12 hours</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Drain, tilt upside down</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Rinse 2-3 times daily</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Out of sun, 3-5 days</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Sour or slimy? Toss</text>
<circle cx="528" cy="288" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="294" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="294" font-size="16" text-anchor="start" fill="#111">Cook for at-risk people</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Use seeds sold for sprouting, never garden seed (often treated with</text>
<text x="25" y="477" font-size="16" text-anchor="start" fill="#111">fungicide).</text>
</svg>

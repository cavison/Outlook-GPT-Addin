<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">F-17 · Butcher Day Without Refrigeration</text>
<rect x="30" y="80" width="200" height="22" fill="#d6eaf8" stroke="#111" stroke-width="2"/><text x="130" y="97" font-size="16" text-anchor="middle" fill="#111">0-2 h: cool core</text><rect x="30" y="102" width="200" height="0"/><line x1="30" y1="130" x2="470" y2="130" stroke="#111" stroke-width="3" fill="none"/><line x1="40" y1="122" x2="40" y2="138" stroke="#111" stroke-width="3"/><text x="40" y="158" font-size="16" text-anchor="middle" fill="#111">Kill</text><line x1="140" y1="122" x2="140" y2="138" stroke="#111" stroke-width="3"/><text x="140" y="158" font-size="16" text-anchor="middle" fill="#111">2 h</text><line x1="260" y1="122" x2="260" y2="138" stroke="#111" stroke-width="3"/><text x="260" y="158" font-size="16" text-anchor="middle" fill="#111">4-6 h</text><line x1="400" y1="122" x2="400" y2="138" stroke="#111" stroke-width="3"/><text x="400" y="158" font-size="16" text-anchor="middle" fill="#111">Day 1 end</text><rect x="40" y="185" width="120" height="110" stroke="#111" stroke-width="3" fill="none"/><text x="100" y="215" font-size="16" text-anchor="middle" fill="#e67e22" font-weight="bold">COOK</text><text x="100" y="240" font-size="16" text-anchor="middle" fill="#111">organs,</text><text x="100" y="260" font-size="16" text-anchor="middle" fill="#111">ground,</text><text x="100" y="280" font-size="16" text-anchor="middle" fill="#111">scraps</text><rect x="180" y="185" width="120" height="110" stroke="#111" stroke-width="3" fill="none"/><text x="240" y="215" font-size="16" text-anchor="middle" fill="#2b7bb9" font-weight="bold">CAN</text><text x="240" y="240" font-size="16" text-anchor="middle" fill="#111">pressure</text><text x="240" y="260" font-size="16" text-anchor="middle" fill="#111">canner</text><text x="240" y="280" font-size="16" text-anchor="middle" fill="#111">only</text><rect x="320" y="185" width="140" height="110" stroke="#111" stroke-width="3" fill="none"/><text x="390" y="215" font-size="16" text-anchor="middle" fill="#2e7d32" font-weight="bold">DRY / CURE</text><text x="390" y="240" font-size="16" text-anchor="middle" fill="#111">thin strips,</text><text x="390" y="260" font-size="16" text-anchor="middle" fill="#111">heat to 160°F</text><text x="390" y="280" font-size="16" text-anchor="middle" fill="#111">then dry</text><text x="40" y="330" font-size="16" text-anchor="start" fill="#2b7bb9">Winter: under 40°F shade, off ground</text><text x="40" y="355" font-size="16" text-anchor="start" fill="#c0392b">Summer: work at dawn, process same day</text><text x="40" y="390" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">Danger zone 40-140°F</text><text x="40" y="412" font-size="16" text-anchor="start" fill="#111">Safe cook: whole cuts 145°F+rest, ground 160°F, poultry 165°F</text><circle cx="250" cy="91" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="97" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="470" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="106" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="40" cy="185" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="191" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="180" cy="185" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="180" y="191" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="320" cy="185" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="320" y="191" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="470" cy="345" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="351" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Plan: cool day, early start</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Cool carcass fast, in shade</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Cook organs + scraps today</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Pressure-can per USDA</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">Dry/cure: heat first, then dry</text>
<circle cx="530" cy="252" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="258" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="257" font-size="16" text-anchor="start" fill="#111">Winter vs summer timing</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Meat in 40-140°F over 2 hours (1 hour above 90°F) is unsafe.</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">Low-acid meat: pressure canner only (USDA).</text>
</svg>
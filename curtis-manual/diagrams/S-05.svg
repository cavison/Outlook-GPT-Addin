<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">S-05 · Sponge Bath, One Quart</text>
<path d="M60,300 L200,300 L180,360 L80,360 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><text x="130" y="390" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">2/3 soapy</text><rect x="240" y="310" width="50" height="50" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="3"/><text x="265" y="390" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">1/3 rinse</text><path d="M330,300 Q330,280 350,280 L365,280 L365,265 L385,265 L385,280 Q390,280 390,300 L390,360 L330,360 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><text x="360" y="390" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">1 quart</text><circle cx="250" cy="110" r="30" fill="#fff" stroke="#111" stroke-width="3"/><line x1="250" y1="140" x2="250" y2="230" stroke="#111" stroke-width="3"/><line x1="250" y1="160" x2="200" y2="200" stroke="#111" stroke-width="3"/><line x1="250" y1="160" x2="300" y2="200" stroke="#111" stroke-width="3"/><line x1="250" y1="230" x2="220" y2="280" stroke="#111" stroke-width="3"/><line x1="250" y1="230" x2="280" y2="280" stroke="#111" stroke-width="3"/><path d="M330,110 L330,260" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="345" y="120" font-size="16" text-anchor="start" fill="#111">top</text><text x="345" y="260" font-size="16" font-weight="bold" text-anchor="start" fill="#111">bottom last</text><circle cx="130" cy="280" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="130" y="286" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="200" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="200" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="210" cy="240" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="210" y="246" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="420" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="306" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text><text x="100" y="430" font-size="16" text-anchor="start" fill="#111">reuse gray water to flush</text><circle cx="60" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Warm room, towel down</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Split water 2/3 + 1/3</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Face first, work down</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Groin and bottom last</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Rinse, dry skin folds</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Wash cloths often</text>
<circle cx="528" cy="288" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="294" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="294" font-size="16" text-anchor="start" fill="#111">Reuse water to flush</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">TIP: Daily: armpits, groin, feet. Full sponge bath every few days.</text>
</svg>

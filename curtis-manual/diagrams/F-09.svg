<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-09 · Cooking Over a Wood Fire</text>
<path d="M40,360 Q240,330 460,360" fill="none" stroke="#111" stroke-width="4"/><circle cx="70" cy="355" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="110" cy="351" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="150" cy="351" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="190" cy="351" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="230" cy="355" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="270" cy="355" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="310" cy="351" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="350" cy="351" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="390" cy="351" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="430" cy="355" r="15" fill="#ddd" stroke="#111" stroke-width="3"/><circle cx="110" cy="340" r="8" fill="#e67e22" stroke="#e67e22" stroke-width="1"/><circle cx="132" cy="340" r="8" fill="#e67e22" stroke="#e67e22" stroke-width="1"/><circle cx="154" cy="340" r="8" fill="#e67e22" stroke="#e67e22" stroke-width="1"/><circle cx="176" cy="340" r="8" fill="#e67e22" stroke="#e67e22" stroke-width="1"/><circle cx="198" cy="340" r="8" fill="#e67e22" stroke="#e67e22" stroke-width="1"/><text x="150" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">COALS (cook here)</text><path d="M360,345 q-18.0,-30.0 0,-60.0 q6.0,24.0 18.0,30.0 q12.0,18.0 -18.0,30.0 z" fill="#e67e22" stroke="#e67e22" stroke-width="2"/><path d="M390,345 q-13.5,-22.5 0,-45.0 q4.5,18.0 13.5,22.5 q9.0,13.5 -13.5,22.5 z" fill="#e67e22" stroke="#e67e22" stroke-width="2"/><text x="380" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">small fire</text><rect x="80" y="290" width="30" height="40" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><rect x="200" y="290" width="30" height="40" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><line x1="70" y1="288" x2="240" y2="288" stroke="#111" stroke-width="5"/><path d="M100,288 L210,288 L200,230 L110,230 Z" fill="#fff" stroke="#111" stroke-width="3"/><rect x="95" y="220" width="120" height="10" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><path d="M360,280 L180,330" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="330" y="260" font-size="16" text-anchor="middle" fill="#111">rake coals over</text><circle cx="60" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="96" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><text x="85" y="96" font-size="16" text-anchor="start" fill="#111">10 ft clear circle</text><circle cx="430" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="430" y="306" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="290" cy="320" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="290" y="326" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="250" cy="290" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="296" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="160" cy="205" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="160" y="211" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text><circle cx="60" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="146" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text><text x="85" y="146" font-size="16" text-anchor="start" fill="#111">drown, stir, drown</text><path d="M380,110 L450,110 L440,190 L390,190 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><path d="M385,110 Q415.0,75 445,110" fill="none" stroke="#111" stroke-width="2"/>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Check burn rules; clear 10</text>
<text x="552" y="127" font-size="16" text-anchor="start" fill="#111">ft</text>
<circle cx="528" cy="152" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="158" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="158" font-size="16" text-anchor="start" fill="#111">Burn down to coals</text>
<circle cx="528" cy="183" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="189" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="189" font-size="16" text-anchor="start" fill="#111">Rake coals to cook side</text>
<circle cx="528" cy="214" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="220" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="220" font-size="16" text-anchor="start" fill="#111">Pot 4-6 in above coals</text>
<circle cx="528" cy="245" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="251" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="251" font-size="16" text-anchor="start" fill="#111">Move pot to adjust heat</text>
<circle cx="528" cy="276" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="282" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="282" font-size="16" text-anchor="start" fill="#111">Use a lid</text>
<circle cx="528" cy="307" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="313" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="313" font-size="16" text-anchor="start" fill="#111">Drown, stir, drown</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">TIP: Rub dish soap on the outside of the pot first; soot washes off easily after.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">H-11 · Hypothermia and Frostbite</text><circle cx="130" cy="130" r="30" fill="#fff" stroke="#111" stroke-width="3"/><path d="M90,170 h80 l10,150 h-100 z" fill="#fff" stroke="#111" stroke-width="3"/><rect x="70" y="160" width="120" height="170" rx="20" fill="none" stroke="#e67e22" stroke-width="4" stroke-dasharray="10 6"/><text x="130" y="360" font-size="16" text-anchor="middle" fill="#e67e22" font-weight="bold">warm the CORE</text><text x="130" y="380" font-size="16" text-anchor="middle" fill="#111">chest, neck, groin</text><circle cx="130" cy="240" r="20" fill="#e67e22" opacity="0.5"/><path d="M270,200 h160 v70 q0,30 -30,30 h-100 q-30,0 -30,-30 z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><text x="350" y="240" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">WARM water</text><text x="350" y="325" font-size="16" text-anchor="middle" fill="#111">not hot</text><text x="230" y="420" font-size="18" text-anchor="start" fill="#c0392b" font-weight="bold">✘ No rubbing</text><text x="230" y="450" font-size="18" text-anchor="start" fill="#c0392b" font-weight="bold">✘ No heater on numb skin</text><text x="230" y="480" font-size="18" text-anchor="start" fill="#2e7d32" font-weight="bold">✔ Warm sweet drink</text><circle cx="60" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="106" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="190" cy="240" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="190" y="246" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="440" cy="480" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="440" y="486" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="440" cy="200" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="440" y="206" font-size="17" font-weight="bold" text-anchor="middle">6</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">Warm place, dry clothes</text><circle cx="530" cy="145" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="151" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="151" font-size="16" text-anchor="start" fill="#111">Warm the core first</text><circle cx="530" cy="181" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="187" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Awake? warm sweet</text><text x="553" y="207" font-size="16" text-anchor="start" fill="#111">drink, no alcohol</text><circle cx="530" cy="237" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="243" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="553" y="243" font-size="16" text-anchor="start" fill="#111">Keep wrapped</text><circle cx="530" cy="273" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="279" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="553" y="279" font-size="16" text-anchor="start" fill="#111">Frostbite: get warm</text><circle cx="530" cy="309" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="315" font-size="17" font-weight="bold" text-anchor="middle">6</text><text x="553" y="315" font-size="16" text-anchor="start" fill="#111">Warm water or</text><text x="553" y="335" font-size="16" text-anchor="start" fill="#111">armpits</text><circle cx="530" cy="365" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="371" font-size="17" font-weight="bold" text-anchor="middle">7</text><text x="553" y="371" font-size="16" text-anchor="start" fill="#111">Unresponsive: check</text><text x="553" y="391" font-size="16" text-anchor="start" fill="#111">breathing, CPR</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-11 · Cook Beans and Rice from Dry</text>
<rect x="40" y="110" width="120" height="70" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="60" cy="145" r="6" fill="#8b0000" stroke="#111" stroke-width="1"/><circle cx="78" cy="155" r="6" fill="#8b0000" stroke="#111" stroke-width="1"/><circle cx="96" cy="145" r="6" fill="#8b0000" stroke="#111" stroke-width="1"/><circle cx="114" cy="155" r="6" fill="#8b0000" stroke="#111" stroke-width="1"/><circle cx="132" cy="145" r="6" fill="#8b0000" stroke="#111" stroke-width="1"/><circle cx="40" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><text x="100" y="200" font-size="16" text-anchor="middle" fill="#111">sort, rinse</text><path d="M200,100 L290,100 L280,200 L210,200 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><path d="M205,100 Q245.0,65 285,100" fill="none" stroke="#111" stroke-width="2"/><text x="245" y="225" font-size="16" text-anchor="middle" fill="#111">soak overnight</text><circle cx="200" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="200" y="96" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><path d="M330,110 L430,110 L420,200 L340,200 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><path d="M380,240 q-12.0,-20.0 0,-40.0 q4.0,16.0 12.0,20.0 q8.0,12.0 -12.0,20.0 z" fill="#e67e22" stroke="#e67e22" stroke-width="2"/><text x="380" y="265" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">10 min hard boil</text><circle cx="450" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="450" y="126" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><rect x="60" y="300" width="120" height="90" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="350" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">HAYBOX</text><circle cx="40" cy="290" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="296" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><path d="M230,320 L330,320 L320,390 L240,390 Z" fill="#fff" stroke="#111" stroke-width="3"/><text x="280" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">1 rice : 2 water</text><circle cx="350" cy="310" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="350" y="316" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text><line x1="430" y1="320" x2="430" y2="390" stroke="#111" stroke-width="3"/><text x="440" y="360" font-size="16" font-weight="bold" text-anchor="start" fill="#111">&lt;40°F</text><circle cx="430" cy="410" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="430" y="416" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Sort and rinse beans</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Soak overnight</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Boil hard 10+ min</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Simmer or haybox</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Rice: 1 part to 2 water</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Serve together</text>
<circle cx="528" cy="288" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="294" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="294" font-size="16" text-anchor="start" fill="#111">Cool leftovers fast</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Undercooked kidney beans cause severe vomiting. Always boil hard 10 minutes.</text>
</svg>

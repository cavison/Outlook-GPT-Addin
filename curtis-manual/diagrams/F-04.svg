<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-04 · Rotate Stock (FIFO)</text>
<rect x="40" y="225" width="420" height="10" rx="0" fill="#111" stroke="#111" stroke-width="1"/><rect x="60" y="150" width="55" height="75" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="87" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">JAN</text><rect x="140" y="150" width="55" height="75" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="167" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">MAR</text><rect x="220" y="150" width="55" height="75" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="247" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">MAY</text><rect x="300" y="150" width="55" height="75" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="327" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">JUL</text><rect x="380" y="150" width="55" height="75" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="407" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">SEP</text><text x="60" y="270" font-size="16" font-weight="bold" text-anchor="start" fill="#111">FRONT (oldest)</text><text x="460" y="270" font-size="16" font-weight="bold" text-anchor="end" fill="#111">BACK (newest)</text><path d="M440,120 C420,95 380,95 360,120" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="450" y="110" font-size="16" font-weight="bold" text-anchor="start" fill="#111">new in</text><path d="M90,140 C80,110 60,105 45,115" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="100" y="110" font-size="16" font-weight="bold" text-anchor="start" fill="#111">eat first</text><circle cx="60" cy="320" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="326" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><text x="85" y="326" font-size="16" text-anchor="start" fill="#111">Date every item</text><circle cx="300" cy="320" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="326" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><text x="325" y="326" font-size="16" text-anchor="start" fill="#111">New to back</text><circle cx="60" cy="370" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="376" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><text x="85" y="376" font-size="16" text-anchor="start" fill="#111">Take from front</text><circle cx="300" cy="370" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="376" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text><text x="325" y="376" font-size="16" text-anchor="start" fill="#111">Monthly check</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Mark month/year</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">New items to back</text>

<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-06 · Save Your Own Seeds</text>
<path d="M60,140 q60,-40 120,0 q-60,40 -120,0z" stroke="#111" stroke-width="3" fill="none"/><circle cx="85" cy="140" r="8" stroke="#111" stroke-width="3" fill="none"/><circle cx="110" cy="140" r="8" stroke="#111" stroke-width="3" fill="none"/><circle cx="135" cy="140" r="8" stroke="#111" stroke-width="3" fill="none"/><circle cx="160" cy="140" r="8" stroke="#111" stroke-width="3" fill="none"/><text x="120" y="190" font-size="16" text-anchor="middle" fill="#111">dry bean pod</text><rect x="250" y="100" width="90" height="120" rx="10" fill="#d6eaf8" stroke="#111" stroke-width="3"/><circle cx="270" cy="170" r="3" fill="#111"/><circle cx="285" cy="184" r="3" fill="#111"/><circle cx="300" cy="170" r="3" fill="#111"/><circle cx="315" cy="184" r="3" fill="#111"/><text x="295" y="245" font-size="16" text-anchor="middle" fill="#111">tomato: ferment</text><text x="295" y="265" font-size="16" text-anchor="middle" fill="#111">2–4 days</text><ellipse cx="140" cy="330" rx="100" ry="22" stroke="#111" stroke-width="3" fill="none"/><circle cx="80" cy="325" r="4" fill="#111"/><circle cx="100" cy="330" r="4" fill="#111"/><circle cx="120" cy="335" r="4" fill="#111"/><circle cx="140" cy="325" r="4" fill="#111"/><circle cx="160" cy="330" r="4" fill="#111"/><circle cx="180" cy="335" r="4" fill="#111"/><circle cx="200" cy="325" r="4" fill="#111"/><text x="140" y="380" font-size="16" text-anchor="middle" fill="#111">dry 1–2 weeks</text><rect x="300" y="290" width="150" height="90" stroke="#111" stroke-width="3" fill="none"/><path d="M300,290 L375,335 L450,290" stroke="#111" stroke-width="3" fill="none"/><text x="375" y="400" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">crop · variety · year</text><circle cx="40" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="106" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="200" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="200" y="116" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="360" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="106" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="40" cy="310" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="316" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="460" cy="280" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="460" y="286" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Save from best plants</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Beans: dry on plant</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Tomato: ferment, rinse</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Greens: let go to seed</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">Dry 1–2 wks, no sun</text>
<circle cx="530" cy="252" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="258" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="257" font-size="16" text-anchor="start" fill="#111">Label envelopes</text>
<circle cx="530" cy="287" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="293" font-size="17" font-weight="bold" text-anchor="middle">7</text>
<text x="553" y="292" font-size="16" text-anchor="start" fill="#111">Store cool, dark, dry</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">F1 hybrids don't grow true. Squash and pumpkins cross easily —</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">open-pollinated beans, peas, lettuce, tomatoes are easiest.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-08 · Camp Stove and Grill Safety</text>
<path d="M40,200 L140,120 L240,200 Z" fill="#fff" stroke="#111" stroke-width="3"/><rect x="55" y="200" width="170" height="170" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><rect x="90" y="240" width="40" height="40" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="3"/><rect x="160" y="290" width="40" height="80" rx="0" fill="none" stroke="#111" stroke-width="3"/><text x="140" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">HOUSE</text><rect x="330" y="300" width="80" height="40" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><line x1="340" y1="340" x2="340" y2="370" stroke="#111" stroke-width="3"/><line x1="400" y1="340" x2="400" y2="370" stroke="#111" stroke-width="3"/><path d="M370,300 q-9.0,-15.0 0,-30.0 q3.0,12.0 9.0,15.0 q6.0,9.0 -9.0,15.0 z" fill="#e67e22" stroke="#e67e22" stroke-width="2"/><rect x="420" y="320" width="30" height="50" rx="10" fill="#fff" stroke="#111" stroke-width="3"/><text x="435" y="390" font-size="14" text-anchor="middle" fill="#111">tank</text><line x1="230" y1="410" x2="330" y2="410" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><text x="280" y="430" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">well away</text><text x="310" y="270" font-size="18" font-weight="bold" text-anchor="start" fill="#2e7d32">✔ OUTSIDE</text><rect x="75" y="315" width="50" height="25" rx="0" fill="#c0392b" stroke="#c0392b" stroke-width="3"/><text x="100" y="300" font-size="1" text-anchor="start" fill="#111"></text><text x="60" y="110" font-size="16" font-weight="bold" text-anchor="start" fill="#c0392b">✘ garage, porch, tent, inside</text><circle cx="300" cy="230" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="236" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="470" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="306" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="330" cy="200" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="330" y="206" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="470" cy="360" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="366" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text><circle cx="130" cy="220" r="0" fill="none" stroke="#111" stroke-width="3"/><text x="140" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">CO</text><circle cx="140" cy="225" r="16" fill="none" stroke="#c0392b" stroke-width="3"/>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Outdoors only, away from</text>
<text x="552" y="127" font-size="16" text-anchor="start" fill="#111">doors</text>
<circle cx="528" cy="152" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="158" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="158" font-size="16" text-anchor="start" fill="#111">Stable base, 3 ft kid zone</text>
<circle cx="528" cy="183" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="189" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="189" font-size="16" text-anchor="start" fill="#111">Soapy-water leak test</text>
<circle cx="528" cy="214" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="220" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="220" font-size="16" text-anchor="start" fill="#111">Flame first, then gas</text>
<circle cx="528" cy="245" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="251" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="251" font-size="16" text-anchor="start" fill="#111">Never unattended</text>
<circle cx="528" cy="276" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="282" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="282" font-size="16" text-anchor="start" fill="#111">Fuel off; tanks outside</text>
<circle cx="528" cy="307" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="313" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="313" font-size="16" text-anchor="start" fill="#111">Cold ashes in metal can</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Never cook with charcoal, grills or camp stoves indoors or in the garage.</text>
<text x="25" y="477" font-size="16" text-anchor="start" fill="#111">Carbon monoxide kills.</text>
</svg>

<text x="780" y="40" font-size="18" text-anchor="end" fill="#f5a623" font-weight="bold">QUICK START</text>
<rect x="250" y="70" width="300" height="50" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><text x="400.0" y="96" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Ordered to evacuate?</text><line x1="250" y1="95" x2="160" y2="95" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="185" y="85" font-size="16" text-anchor="start" fill="#111" font-weight="bold">YES</text><rect x="20" y="70" width="140" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="90.0" y="96" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">GO</text><line x1="400" y1="120" x2="400" y2="145" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="410" y="140" font-size="16" text-anchor="start" fill="#111" font-weight="bold">NO</text><rect x="150" y="145" width="500" height="50" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><text x="400.0" y="171" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Medical device or need you can't meet?</text><line x1="150" y1="170" x2="140" y2="170" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><rect x="20" y="145" width="120" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="80.0" y="171" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">GO</text><line x1="400" y1="195" x2="400" y2="220" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="410" y="215" font-size="16" text-anchor="start" fill="#111" font-weight="bold">NO</text><rect x="150" y="220" width="500" height="50" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><text x="400.0" y="246" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Can't keep 1 room warm / no safe water?</text><line x1="150" y1="245" x2="140" y2="245" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><rect x="20" y="220" width="120" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="80.0" y="246" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">GO</text><line x1="400" y1="270" x2="400" y2="295" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="410" y="290" font-size="16" text-anchor="start" fill="#111" font-weight="bold">NO</text><rect x="200" y="295" width="400" height="60" rx="8" fill="#eef6ee" stroke="#2e7d32" stroke-width="3"/><text x="400.0" y="321" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">STAY</text><text x="400.0" y="343" font-size="16" text-anchor="middle" fill="#111">Recheck every morning</text><circle cx="565" cy="95" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="565" y="101" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="665" cy="170" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="665" y="176" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="665" cy="245" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="665" y="251" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="615" cy="325" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="615" y="331" font-size="17" font-weight="bold" text-anchor="middle">4</text>

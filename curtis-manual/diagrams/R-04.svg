<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="50" fill="#111"/>
<text x="22" y="40" font-size="24" font-weight="bold" fill="#fff" text-anchor="start">R-04 · Sew a Button, Patch and Seam</text>
<circle cx="120" cy="200" r="50" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="105" cy="185" r="7" fill="none" stroke="#111" stroke-width="3"/><circle cx="135" cy="185" r="7" fill="none" stroke="#111" stroke-width="3"/><circle cx="105" cy="215" r="7" fill="none" stroke="#111" stroke-width="3"/><circle cx="135" cy="215" r="7" fill="none" stroke="#111" stroke-width="3"/><line x1="80" y1="160" x2="160" y2="240" stroke="#111" stroke-width="3"/><path d="M220,320 h150" stroke="#111" stroke-width="3" stroke-dasharray="14 8"/><text x="295" y="350" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">backstitch</text><rect x="220" y="160" width="130" height="110" rx="0" fill="none" stroke="#111" stroke-width="3"/><rect x="240" y="180" width="90" height="70" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="6 5"/><text x="285" y="290" font-size="16" font-weight="bold" fill="#111" text-anchor="middle">patch</text><circle cx="60" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="146" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text><circle cx="200" cy="320" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="200" y="326" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">3</text>
<text x="410" y="88" font-size="18" font-weight="bold" fill="#111" text-anchor="start">STEPS</text>
<circle cx="422" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="115" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">1</text>
<text x="446" y="115" font-size="16" fill="#111" text-anchor="start">Double thread; knot</text>
<circle cx="422" cy="142" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="148" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text>
<text x="446" y="148" font-size="16" fill="#111" text-anchor="start">Button: 6–8 passes over a pin</text>
<circle cx="422" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="181" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">3</text>
<text x="446" y="181" font-size="16" fill="#111" text-anchor="start">Seam: inside out, backstitch</text>
<circle cx="422" cy="208" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="214" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">4</text>
<text x="446" y="214" font-size="16" fill="#111" text-anchor="start">Patch: bigger than hole, whipstitch</text>
<circle cx="422" cy="241" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="247" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">5</text>
<text x="446" y="247" font-size="16" fill="#111" text-anchor="start">Knot inside, trim</text>
<circle cx="422" cy="274" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="280" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">6</text>
<text x="446" y="280" font-size="16" fill="#111" text-anchor="start">Fix holes early</text>
<rect x="20" y="412" width="760" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="34" y="438" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">⚠ CAUTION</text>
<text x="34" y="464" font-size="16" fill="#111" text-anchor="start">Torn, wet winter gear = frostbite risk.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">S-01 · Two-Bucket Toilet</text>
<path d="M60,150 L200,150 L190,320 L70,320 Z" fill="#fff" stroke="#111" stroke-width="3"/><path d="M65,150 Q130.0,115 195,150" fill="none" stroke="#111" stroke-width="2"/><rect x="54" y="140" width="152" height="10" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="130" y="255" font-size="24" font-weight="bold" text-anchor="middle" fill="#111">PEE</text><path d="M270,150 L410,150 L400,320 L280,320 Z" fill="#fff" stroke="#111" stroke-width="3"/><path d="M275,150 Q340.0,115 405,150" fill="none" stroke="#111" stroke-width="2"/><path d="M268,150 L285,330 L395,330 L412,150" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/><rect x="262" y="135" width="156" height="18" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="245" font-size="24" font-weight="bold" text-anchor="middle" fill="#111">POO</text><rect x="285" y="280" width="110" height="35" rx="0" fill="#e8d8a0" stroke="#111" stroke-width="1"/><text x="340" y="302" font-size="14" text-anchor="middle" fill="#111">cover</text><path d="M380,390 L430,390 L420,430 L390,430 Z" fill="#e8d8a0" stroke="#111" stroke-width="3"/><path d="M385,390 Q405.0,355 425,390" fill="none" stroke="#111" stroke-width="2"/><text x="410" y="380" font-size="14" text-anchor="middle" fill="#111">sawdust</text><text x="60" y="370" font-size="18" font-weight="bold" text-anchor="start" fill="#2e7d32">✔ pee only</text><text x="270" y="370" font-size="18" font-weight="bold" text-anchor="start" fill="#2e7d32">✔ poo + TP + cover</text><circle cx="235" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="235" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="430" cy="220" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="430" y="226" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="40" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="146" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="260" cy="125" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="260" y="131" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="450" cy="360" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="450" y="366" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text><circle cx="40" cy="340" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="346" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text><circle cx="430" cy="160" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="430" y="166" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text><text x="250" y="90" font-size="16" font-weight="bold" text-anchor="start" fill="#111">side by side</text><text x="150" y="420" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">lids on, labeled</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Two buckets side by side</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Double-bag POO; cover in</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Pee in PEE bucket</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Poo + paper in POO bucket</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Cover after each use; lid</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Empty PEE bucket daily</text>
<circle cx="528" cy="288" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="294" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="294" font-size="16" text-anchor="start" fill="#111">Half full: tie, store</text>
<circle cx="528" cy="319" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="325" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">8</text>
<text x="552" y="325" font-size="16" text-anchor="start" fill="#111">Wash hands</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Never add bleach to the pee bucket: bleach + urine can release chloramine</text>
<text x="25" y="477" font-size="16" text-anchor="start" fill="#111">gas.</text>
</svg>

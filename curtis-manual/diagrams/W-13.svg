<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Cool, dark, off bare concrete.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Far from fuel and chemicals.</text>

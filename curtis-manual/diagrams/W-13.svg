="16" text-anchor="middle" fill="#111" font-weight="bold">GAS</text><text x="60" y="340" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">✘ not near fuel/chemicals</text><circle cx="300" cy="280" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="286" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="60" y="380" font-size="16" text-anchor="start" fill="#111" font-weight="bold">Refill/rotate every 6 months</text><circle cx="340" cy="380" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="386" font-size="17" font-weight="bold" text-anchor="middle">4</text>

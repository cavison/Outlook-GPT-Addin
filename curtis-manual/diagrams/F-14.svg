<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Shade + breeze; re-wet</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Produce only. It does not reach fridge-safe 40°F. Works poorly on humid days.</text>

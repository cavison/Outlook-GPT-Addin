bold" text-anchor="middle" fill="#111">5</text><circle cx="470" cy="280" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="286" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-06 · Settle and Pre-Filter Dirty Water</text>
<polygon points="44,156.0 136,156.0 130,240 50,240" fill="#c9b79c"/><polygon points="40,120 140,120 130,240 50,240" fill="none" stroke="#111" stroke-width="3"/><path d="M40,120 q50.0,-54.0 100,0" fill="none" stroke="#111" stroke-width="3"/><text x="90" y="270" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">settle</text><circle cx="40" cy="105" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="111" font-size="17" font-weight="bold" text-anchor="middle">1</text><line x1="150" y1="170" x2="200" y2="170" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><polygon points="214,156.0 306,156.0 300,240 220,240" fill="#d6eaf8"/><polygon points="210,120 310,120 300,240 220,240" fill="none" stroke="#111" stroke-width="3"/><path d="M210,120 q50.0,-54.0 100,0" fill="none" stroke="#111" stroke-width="3"/><path d="M215,130 q45,30 90,0" fill="none" stroke="#888" stroke-width="3"/><text x="260" y="270" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">pour off top</text><circle cx="320" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="320" y="116" font-size="17" font-weight="bold" text-anchor="middle">2</text><path d="M120,310 h90 l-30,40 h-30 z" fill="#fff" stroke="#111" stroke-width="3"/><text x="165" y="300" font-size="16" text-anchor="middle" fill="#111">coffee filter / cloth</text><line x1="165" y1="350" x2="165" y2="375" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><circle cx="230" cy="330" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="336" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="300" y="350" font-size="16" text-anchor="start" fill="#111" font-weight="bold">then</text><text x="300" y="370" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">disinfect</text><circle cx="370" cy="345" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="370" y="351" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Let it settle, covered.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Pour off the clear top.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Filter through cloth or coffee filter.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Boil or bleach (cloudy dose).</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Clear-looking is not safe. Always disinfect afterward.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Pre-filtering keeps grit from clogging your good portable filter.</text>
</svg>
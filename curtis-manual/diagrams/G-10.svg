<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Inflows: creek, culvert</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Structure: logs, docks,</text>
<text x="553" y="136" font-size="16" text-anchor="start" fill="#111">weed edges, rocks</text>
<circle cx="530" cy="166" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="172" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="171" font-size="16" text-anchor="start" fill="#111">Drop-offs: shallow→deep</text>
<circle cx="530" cy="201" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="207" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="206" font-size="16" text-anchor="start" fill="#111">Shade on bright days</text>
<circle cx="530" cy="236" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="242" font-size="17" font-weight="bold" text-anchor="middle">5</text>

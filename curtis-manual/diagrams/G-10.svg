<text x="553" y="276" font-size="16" text-anchor="start" fill="#111">No bites 15–20 min? Move</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Stay off piers/breakwalls when waves break over them.</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">Check DNR rules: some creeks are trout streams.</text>

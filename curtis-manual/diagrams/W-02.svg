<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-02 · Water from Toilet Tanks and Pipes</text>
<rect x="40" y="110" width="110" height="70" rx="0" fill="none" stroke="#111" stroke-width="4"/><rect x="44" y="130" width="102" height="46" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="3"/><rect x="40" y="110" width="110" height="70" rx="0" fill="none" stroke="#111" stroke-width="4"/><text x="95" y="100" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">TANK</text><path d="M50,180 h90 l-10,50 h-70 z" fill="none" stroke="#111" stroke-width="3"/><text x="95" y="260" font-size="16" text-anchor="middle" fill="#111">bowl</text><text x="45" y="290" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">✘ bowl</text><text x="45" y="150" font-size="18" text-anchor="start" fill="#2e7d32" font-weight="bold">✔ </text><circle cx="165" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="165" y="146" font-size="17" font-weight="bold" text-anchor="middle">1</text><line x1="240" y1="80" x2="240" y2="340" stroke="#111" stroke-width="5"/><line x1="240" y1="120" x2="300" y2="120" stroke="#111" stroke-width="4"/><text x="305" y="125" font-size="16" text-anchor="start" fill="#111">top tap</text><line x1="330" y1="100" x2="330" y2="75" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><circle cx="360" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="116" font-size="17" font-weight="bold" text-anchor="middle">3</text><line x1="240" y1="330" x2="300" y2="330" stroke="#111" stroke-width="4"/><line x1="300" y1="330" x2="300" y2="350" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><text x="310" y="345" font-size="16" text-anchor="start" fill="#111">lowest</text><text x="310" y="365" font-size="16" text-anchor="start" fill="#111">tap</text><circle cx="360" cy="320" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="326" font-size="17" font-weight="bold" text-anchor="middle">4</text><rect x="225" y="220" width="30" height="18" rx="0" fill="#111" stroke="#111" stroke-width="3"/><text x="265" y="236" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">main OFF</text><circle cx="210" cy="230" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="210" y="236" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Tank water only, if no cleaners.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Shut main water valve.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Open highest tap for air.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Catch water at lowest tap.</text>
<circle cx="420" cy="204" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="210" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="444" y="210" font-size="17" text-anchor="start" fill="#111">Disinfect before drinking.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Tank with cleaning tablets = poison. Boiling won't fix it.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Draining pipes also protects them from freezing (H-08).</text>
</svg>
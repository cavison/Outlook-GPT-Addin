<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-15 · Pest-Proof Food Storage</text>
<path d="M50,130 L150,130 L140,260 L60,260 Z" fill="#fff" stroke="#111" stroke-width="3"/><path d="M55,130 Q100.0,95 145,130" fill="none" stroke="#111" stroke-width="2"/><rect x="44" y="120" width="112" height="10" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="100.0" y="201.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">FLOUR</text><circle cx="40" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><rect x="190" y="140" width="70" height="110" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><rect x="185" y="125" width="80" height="15" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="225" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">jar</text><rect x="300" y="120" width="120" height="140" rx="6" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="295" y="110" width="130" height="14" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="195" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">metal can</text><rect x="40" y="300" width="420" height="10" rx="0" fill="#111" stroke="#111" stroke-width="1"/><line x1="60" y1="310" x2="60" y2="360" stroke="#111" stroke-width="3"/><line x1="440" y1="310" x2="440" y2="360" stroke="#111" stroke-width="3"/><text x="250" y="345" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">off floor, away from wall</text><circle cx="250" cy="380" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="386" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><path d="M330,400 q15,-20 40,-5 q10,-12 15,0 l20,10 q-30,15 -75,-5 z" fill="#fff" stroke="#111" stroke-width="2"/><text x="400" y="425" font-size="1" text-anchor="start" fill="#111"></text><text x="40" y="410" font-size="18" font-weight="bold" text-anchor="start" fill="#c0392b">✘ paper bags on floor</text><circle cx="280" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="280" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><rect x="170" y="70" width="0" height="0" rx="0" fill="none" stroke="#111" stroke-width="3"/><text x="305" y="100" font-size="16" text-anchor="start" fill="#111">freeze new bags first</text><circle cx="460" cy="400" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="460" y="406" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Into hard containers</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Freeze new grain first</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Off floor, off wall</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Monthly check</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Toss infested food</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Snap traps by walls</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Don't sweep dry mouse droppings (hantavirus). Wet with disinfectant, wear</text>
<text x="25" y="477" font-size="16" text-anchor="start" fill="#111">gloves.</text>
</svg>

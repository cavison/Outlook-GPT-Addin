<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Check city/township rules</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Hatch eggs 17-18 days</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Brood warm, shallow</text>
<text x="553" y="171" font-size="16" text-anchor="start" fill="#111"> water (marbles)</text>
<circle cx="530" cy="201" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="207" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="206" font-size="16" text-anchor="start" fill="#111">Feed game-bird starter</text>
<circle cx="530" cy="236" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="242" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="241" font-size="16" text-anchor="start" fill="#111">Eggs at ~6-8 weeks</text>
<circle cx="530" cy="271" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="277" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="276" font-size="16" text-anchor="start" fill="#111">Clean droppings often</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Chicks drown in deep water dishes. Use shallow dishes</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">with pebbles or marbles. Confirm local animal ordinance.</text>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<text x="400" y="38" font-size="26" font-weight="bold" text-anchor="middle">Keep or Toss? Check the Temperature</text>
<!-- fridge -->
<rect x="40" y="70" width="200" height="330" rx="8" fill="none" stroke="#111" stroke-width="4"/>
<line x1="40" y1="170" x2="240" y2="170" stroke="#111" stroke-width="4"/>
<text x="140" y="125" font-size="18" text-anchor="middle" font-weight="bold">FREEZER</text>
<text x="140" y="250" font-size="18" text-anchor="middle" font-weight="bold">FRIDGE</text>
<!-- thermometer -->
<rect x="190" y="190" width="18" height="90" rx="9" fill="none" stroke="#111" stroke-width="3"/>
<circle cx="199" cy="290" r="14" fill="#c0392b" stroke="#111" stroke-width="3"/>
<text x="140" y="440" font-size="17" text-anchor="middle">Read thermometer first</text>
<!-- keep box -->
<rect x="300" y="80" width="460" height="140" fill="#eef6ee" stroke="#2e7d32" stroke-width="3"/>
<text x="320" y="112" font-size="22" font-weight="bold" fill="#2e7d32">✔ KEEP / REFREEZE</text>
<text x="320" y="145" font-size="17">Freezer food with ice crystals or ≤ 40°F</text>
<text x="320" y="175" font-size="17">Hard cheese, butter, whole fruit &amp; veg</text>
<text x="320" y="205" font-size="17">Clean, undamaged cans</text>
<!-- toss box -->
<rect x="300" y="240" width="460" height="140" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="320" y="272" font-size="22" font-weight="bold" fill="#c0392b">✘ THROW OUT</text>
<text x="320" y="305" font-size="17">Meat, milk, eggs, leftovers &gt; 40°F for 2+ h</text>
<text x="320" y="335" font-size="17">Bulging, leaking, rusted cans</text>
<text x="320" y="365" font-size="17">Anything touched by floodwater</text>
<rect x="300" y="400" width="460" height="60" fill="none" stroke="#2b7bb9" stroke-width="3"/>
<text x="320" y="437" font-size="17">Wash, bleach-wipe, restart; restock at ≤ 40°F / 0°F</text>
<g font-size="18" font-weight="bold" text-anchor="middle">
<circle cx="225" cy="190" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="225" y="196">1</text>
<circle cx="60" cy="250" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="256">2</text>
<circle cx="60" cy="125" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="131">3</text>
<circle cx="745" cy="275" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="745" y="281">4</text>
<circle cx="745" cy="330" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="745" y="336">5</text>
<circle cx="300" cy="400" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="406">6</text>
<circle cx="760" cy="400" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="760" y="406">7</text>
</g>
</svg>

<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Garden supplements stored food. Beans rot in cold, wet soil —</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">plant tender crops only after frost danger (approx. mid-May).</text>

<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-01 · Fast Crops for West Michigan</text>
<line x1="30" y1="250" x2="480" y2="250" stroke="#111" stroke-width="3" fill="none" marker-end="url(#ah)"/><line x1="45" y1="240" x2="45" y2="260" stroke="#111" stroke-width="3"/><text x="45" y="285" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Sprouts</text><text x="45" y="305" font-size="16" text-anchor="middle" fill="#111">days</text><line x1="45" y1="235" x2="45" y2="197" stroke="#2e7d32" stroke-width="4"/><ellipse cx="36" cy="202" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><ellipse cx="54" cy="202" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><circle cx="45" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="45" y="201" font-size="17" font-weight="bold" text-anchor="middle">1</text><line x1="110" y1="240" x2="110" y2="260" stroke="#111" stroke-width="3"/><text x="110" y="285" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Micro-</text><text x="110" y="303" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">greens</text><text x="110" y="323" font-size="16" text-anchor="middle" fill="#111">7–14 d</text><line x1="110" y1="235" x2="110" y2="179" stroke="#2e7d32" stroke-width="4"/><ellipse cx="101" cy="184" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><ellipse cx="119" cy="184" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><circle cx="110" cy="159" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="110" y="165" font-size="17" font-weight="bold" text-anchor="middle">2</text><line x1="180" y1="240" x2="180" y2="260" stroke="#111" stroke-width="3"/><text x="180" y="285" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Radish</text><text x="180" y="305" font-size="16" text-anchor="middle" fill="#111">25–30 d</text><line x1="180" y1="235" x2="180" y2="161" stroke="#2e7d32" stroke-width="4"/><ellipse cx="171" cy="166" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><ellipse cx="189" cy="166" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><circle cx="180" cy="141" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="180" y="147" font-size="17" font-weight="bold" text-anchor="middle">3</text><line x1="255" y1="240" x2="255" y2="260" stroke="#111" stroke-width="3"/><text x="255" y="285" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Greens</text><text x="255" y="305" font-size="16" text-anchor="middle" fill="#111">30–45 d</text><line x1="255" y1="235" x2="255" y2="143" stroke="#2e7d32" stroke-width="4"/><ellipse cx="246" cy="148" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><ellipse cx="264" cy="148" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><circle cx="255" cy="123" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="255" y="129" font-size="17" font-weight="bold" text-anchor="middle">4</text><line x1="335" y1="240" x2="335" y2="260" stroke="#111" stroke-width="3"/><text x="335" y="285" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Bush bean</text><text x="335" y="305" font-size="16" text-anchor="middle" fill="#111">50–60 d</text><line x1="335" y1="235" x2="335" y2="125" stroke="#2e7d32" stroke-width="4"/><ellipse cx="326" cy="130" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><ellipse cx="344" cy="130" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><circle cx="335" cy="105" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="335" y="111" font-size="17" font-weight="bold" text-anchor="middle">5</text><line x1="425" y1="240" x2="425" y2="260" stroke="#111" stroke-width="3"/><text x="425" y="285" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Potato</text><text x="425" y="305" font-size="16" text-anchor="middle" fill="#111">70–120 d</text><line x1="425" y1="235" x2="425" y2="107" stroke="#2e7d32" stroke-width="4"/><ellipse cx="416" cy="112" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><ellipse cx="434" cy="112" rx="10" ry="5" fill="none" stroke="#2e7d32" stroke-width="3"/><circle cx="425" cy="87" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="425" y="93" font-size="17" font-weight="bold" text-anchor="middle">6</text><text x="255" y="365" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Frost window (approx., Ottawa Co.):</text><text x="255" y="390" font-size="16" text-anchor="middle" fill="#111">last ~mid-May · first ~early–mid Oct</text><text x="255" y="412" font-size="16" text-anchor="middle" fill="#888">check MSU Extension each year</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-12 · Getting Water from a Well Without Power</text>
<line x1="100" y1="120" x2="100" y2="380" stroke="#111" stroke-width="6"/><line x1="130" y1="120" x2="130" y2="380" stroke="#111" stroke-width="6"/><rect x="104" y="300" width="22" height="60" rx="0" fill="#2b7bb9" stroke="#111" stroke-width="3"/><text x="115" y="395" font-size="16" text-anchor="middle" fill="#111">pump</text><rect x="80" y="90" width="70" height="30" rx="0" fill="none" stroke="#111" stroke-width="4"/><text x="115" y="80" font-size="16" text-anchor="middle" fill="#111">well cap</text><circle cx="60" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="96" font-size="17" font-weight="bold" text-anchor="middle">1</text><rect x="200" y="180" width="70" height="120" rx="30" fill="none" stroke="#111" stroke-width="4"/><text x="235" y="245" font-size="16" text-anchor="middle" fill="#111">pressure</text><text x="235" y="265" font-size="16" text-anchor="middle" fill="#111">tank</text><circle cx="290" cy="190" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="290" y="196" font-size="17" font-weight="bold" text-anchor="middle">2</text><line x1="270" y1="290" x2="330" y2="290" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><text x="340" y="320" font-size="16" text-anchor="middle" fill="#111">low tap</text><circle cx="360" cy="270" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="276" font-size="17" font-weight="bold" text-anchor="middle">3</text><rect x="190" y="110" width="130" height="40" rx="0" fill="#e67e22" stroke="#111" stroke-width="3"/><text x="255" y="136" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">GENERATOR</text><circle cx="340" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="126" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Know pump type and voltage.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Drain pressure tank at lowest tap.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Save pressure for drinking water.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Generator + transfer switch, short runs.</text>
<circle cx="420" cy="204" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="210" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="444" y="210" font-size="17" text-anchor="start" fill="#111">Flooded? Don't drink. Test and shock.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Never backfeed an outlet. Pumps are 240 V. Use an electrician.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Your county health dept. sells well test kits. Test after any flood.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="52" fill="#111"/>
<text x="22" y="41" fill="#fff" font-size="24" font-weight="bold">M-08 · Oral Rehydration Solution</text>
<path d="M80,170 L220,170 L230,400 L70,400 Z" fill="#d6eaf8" stroke="#111" stroke-width="4"/><text x="95" y="300" font-size="20" font-weight="bold">1 LITER</text><text x="90" y="325" font-size="16" >safe water</text><ellipse cx="330" cy="200" rx="40" ry="10" stroke="#111" stroke-width="3" fill="none"/><text x="260" y="240" font-size="16" font-weight="bold">6 level tsp sugar</text><ellipse cx="330" cy="290" rx="40" ry="10" stroke="#111" stroke-width="3" fill="none"/><text x="260" y="330" font-size="16" font-weight="bold">½ level tsp salt</text><text x="60" y="440" font-size="16" >Small sips, often. Make fresh daily.</text>
<text x="470" y="86" font-size="18" font-weight="bold">STEPS</text>
<circle cx="486" cy="110" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="116" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="512" y="116" font-size="16" >Start with 1 liter of</text>
<text x="512" y="135" font-size="16" >safe water.</text>
<circle cx="486" cy="176" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="182" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="512" y="182" font-size="16" >Add 6 level tsp sugar.</text>
<circle cx="486" cy="223" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="229" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="512" y="229" font-size="16" >Add ½ level tsp salt.</text>
<circle cx="486" cy="270" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="276" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="512" y="276" font-size="16" >Stir; sip often.</text>
<text x="512" y="295" font-size="16" >Discard after 24 h.</text>
<circle cx="70" cy="170" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="70" y="176" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<circle cx="380" cy="200" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="380" y="206" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<circle cx="380" cy="290" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="380" y="296" font-size="18" font-weight="bold" text-anchor="middle">3</text>
</svg>
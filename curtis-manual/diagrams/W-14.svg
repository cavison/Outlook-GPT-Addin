<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-14 · Daily Water Budget</text>
<text x="40" y="100" font-size="22" text-anchor="start" fill="#111" font-weight="bold">1 gallon / person / day</text><circle cx="360" cy="92" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="98" font-size="17" font-weight="bold" text-anchor="middle">1</text><rect x="50" y="157.0" width="60" height="62.99999999999999" fill="#d6eaf8"/><rect x="50" y="130" width="60" height="90" rx="8" fill="none" stroke="#111" stroke-width="3"/><rect x="71.0" y="116" width="18.0" height="14" rx="0" fill="none" stroke="#111" stroke-width="3"/><path d="M110,142 q18,0 18,18 q0,18 -18,18" fill="none" stroke="#111" stroke-width="3"/><text x="80" y="245" font-size="16" text-anchor="middle" fill="#111">½ drink</text><rect x="160" y="157.0" width="60" height="62.99999999999999" fill="#d6eaf8"/><rect x="160" y="130" width="60" height="90" rx="8" fill="none" stroke="#111" stroke-width="3"/><rect x="181.0" y="116" width="18.0" height="14" rx="0" fill="none" stroke="#111" stroke-width="3"/><path d="M220,142 q18,0 18,18 q0,18 -18,18" fill="none" stroke="#111" stroke-width="3"/><text x="190" y="245" font-size="16" text-anchor="middle" fill="#111">½ cook/wash</text><circle cx="300" cy="160" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="166" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="40" y="300" font-size="18" text-anchor="start" fill="#c0392b" font-weight="bold">Heat, nursing, sick: MORE</text><circle cx="360" cy="292" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="298" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="40" y="350" font-size="18" text-anchor="start" fill="#2e7d32" font-weight="bold">Flush with used water</text><circle cx="360" cy="342" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="348" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">1 gal/person/day minimum.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Half drink, half cook and wash.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">More for heat, nursing, sick.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Reuse gray water to flush.</text>
<circle cx="420" cy="204" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="210" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="444" y="210" font-size="17" text-anchor="start" fill="#111">Log supply every morning.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Never ration drinking water. Cut washing first.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Cold air still dehydrates. Keep a full cup in sight in the warm room.</text>
</svg>
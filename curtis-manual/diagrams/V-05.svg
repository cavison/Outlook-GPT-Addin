<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<text x="400" y="38" font-size="26" font-weight="bold" text-anchor="middle">Document First, Then Claim</text>
<!-- camera -->
<rect x="40" y="100" width="140" height="90" rx="10" fill="none" stroke="#111" stroke-width="4"/>
<circle cx="110" cy="145" r="28" fill="none" stroke="#111" stroke-width="4"/>
<text x="110" y="220" font-size="17" text-anchor="middle">Photo damage</text>
<!-- list -->
<rect x="240" y="90" width="110" height="140" fill="none" stroke="#111" stroke-width="4"/>
<g stroke="#111" stroke-width="2"><line x1="255" y1="120" x2="335" y2="120"/><line x1="255" y1="145" x2="335" y2="145"/><line x1="255" y1="170" x2="335" y2="170"/><line x1="255" y1="195" x2="335" y2="195"/></g>
<text x="295" y="255" font-size="17" text-anchor="middle">List items</text>
<!-- tarp/receipt -->
<rect x="410" y="100" width="110" height="120" fill="none" stroke="#111" stroke-width="4"/>
<path d="M410,220 l18,-12 l18,12 l18,-12 l18,12 l18,-12 l20,12" fill="none" stroke="#111" stroke-width="3"/>
<text x="465" y="160" font-size="18" text-anchor="middle" font-weight="bold">$</text>
<text x="465" y="255" font-size="17" text-anchor="middle">Keep receipts</text>
<!-- phone -->
<rect x="590" y="90" width="70" height="130" rx="10" fill="none" stroke="#111" stroke-width="4"/>
<text x="625" y="255" font-size="17" text-anchor="middle">Call insurer</text>
<g stroke="#111" stroke-width="3" marker-end="url(#ar)"><line x1="185" y1="145" x2="232" y2="145"/><line x1="355" y1="160" x2="402" y2="160"/><line x1="525" y1="160" x2="582" y2="160"/></g>
<!-- bottom -->
<rect x="40" y="310" width="220" height="70" fill="none" stroke="#e67e22" stroke-width="3"/>
<text x="150" y="342" font-size="17" text-anchor="middle">Utility / MPSC</text><text x="150" y="365" font-size="16" text-anchor="middle">outage credit?</text>
<rect x="290" y="310" width="220" height="70" fill="none" stroke="#2b7bb9" stroke-width="3"/>
<text x="400" y="342" font-size="17" text-anchor="middle">FEMA (if declared)</text><text x="400" y="365" font-size="16" text-anchor="middle">DisasterAssistance.gov</text>
<rect x="540" y="310" width="220" height="70" fill="none" stroke="#2e7d32" stroke-width="3"/>
<text x="650" y="352" font-size="17" text-anchor="middle">One folder for all</text>
<rect x="40" y="410" width="720" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="400" y="447" font-size="18" text-anchor="middle" fill="#c0392b" font-weight="bold">✘ No full payment up front. FEMA never charges to apply.</text>
<g font-size="18" font-weight="bold" text-anchor="middle">
<circle cx="40" cy="95" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="101">1</text>
<circle cx="240" cy="85" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="240" y="91">2</text>
<circle cx="410" cy="95" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="410" y="101">3</text>
<circle cx="590" cy="85" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="590" y="91">4</text>
<circle cx="40" cy="305" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="311">5</text>
<circle cx="290" cy="305" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="290" y="311">6</text>
<circle cx="540" cy="305" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="540" y="311">7</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-01 · Drain the Water Heater for Drinking Water</text>
<rect x="130" y="110" width="120" height="230" rx="20" fill="none" stroke="#111" stroke-width="4"/><rect x="134" y="160" width="112" height="176" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="3"/><rect x="130" y="110" width="120" height="230" rx="20" fill="none" stroke="#111" stroke-width="4"/><text x="190" y="230" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">WATER</text><text x="190" y="250" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">HEATER</text><rect x="150" y="290" width="80" height="30" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="190" y="311" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">OFF</text><circle cx="110" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="110" y="306" font-size="17" font-weight="bold" text-anchor="middle">1</text><line x1="160" y1="110" x2="160" y2="75" stroke="#111" stroke-width="4"/><text x="140" y="72" font-size="16" text-anchor="end" fill="#111">cold in</text><rect x="150" y="85" width="20" height="12" rx="0" fill="#111" stroke="#111" stroke-width="3"/><circle cx="115" cy="92" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="115" y="98" font-size="17" font-weight="bold" text-anchor="middle">2</text><line x1="220" y1="110" x2="220" y2="75" stroke="#111" stroke-width="4"/><text x="232" y="72" font-size="16" text-anchor="start" fill="#111">hot out</text><line x1="330" y1="110" x2="330" y2="80" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="320" y="130" font-size="16" text-anchor="middle" fill="#111">open hot tap</text><circle cx="360" cy="95" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="101" font-size="17" font-weight="bold" text-anchor="middle">3</text><line x1="250" y1="330" x2="290" y2="330" stroke="#111" stroke-width="4"/><line x1="290" y1="330" x2="290" y2="350" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><polygon points="264,359.0 326,359.0 320,380 270,380" fill="#d6eaf8"/><polygon points="260,350 330,350 320,380 270,380" fill="none" stroke="#111" stroke-width="3"/><path d="M260,350 q35.0,-13.5 70,0" fill="none" stroke="#111" stroke-width="3"/><circle cx="345" cy="330" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="345" y="336" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="60" cy="360" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="366" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="30" y="385" font-size="16" text-anchor="start" fill="#111"></text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Power/gas OFF. Let cool.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Close cold inlet valve.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Open a hot tap for air.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Drain from bottom valve.</text>
<circle cx="420" cy="204" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="210" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="444" y="210" font-size="17" text-anchor="start" fill="#111">Strain; disinfect if unsure.</text>
<circle cx="420" cy="234" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="240" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="444" y="240" font-size="17" text-anchor="start" fill="#111">Leave heater OFF till refilled.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Hot water scalds. Never power an empty heater.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Clogged drain valve? Open and close it a few times to clear sediment.</text>
</svg>
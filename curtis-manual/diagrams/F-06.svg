<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-06 · Haybox Cooker</text>
<rect x="60" y="150" width="360" height="230" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><rect x="80" y="170" width="320" height="200" rx="0" fill="#eee" stroke="#111" stroke-width="2"/><path d="M90,180 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M120,188 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M150,196 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M180,180 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M210,188 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M240,196 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M270,180 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M300,188 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M330,196 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M360,180 q10,-8 20,0" fill="none" stroke="#888" stroke-width="1"/><path d="M170,230 L310,230 L300,330 L180,330 Z" fill="#fff" stroke="#111" stroke-width="3"/><rect x="160" y="220" width="160" height="12" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><path d="M240,300 q-9.0,-15.0 0,-30.0 q3.0,12.0 9.0,15.0 q6.0,9.0 -9.0,15.0 z" fill="#e67e22" stroke="#e67e22" stroke-width="2"/><rect x="60" y="100" width="360" height="40" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="240" y="127" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">LID + pillow on top</text><text x="240" y="400" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">3-4 in insulation all around</text><circle cx="60" cy="160" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="166" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="450" cy="290" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="450" y="296" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="340" cy="225" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="231" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="440" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="440" y="126" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="340" cy="330" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="336" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text><circle cx="120" cy="420" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="426" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text><text x="145" y="426" font-size="16" font-weight="bold" text-anchor="start" fill="#c0392b">check 140°F+ before eating</text><text x="240" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">Boil first, then box it</text><path d="M470,280 L425,260" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Line box, make nest</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Boil food hot through</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Lid tight, into nest fast</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Pack top, close box</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Wait; don't peek</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Above 140°F? If not, re-</text>
<text x="552" y="282" font-size="16" text-anchor="start" fill="#111">boil</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Hard-boil soaked kidney beans 10+ minutes BEFORE they go into the box.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="50" fill="#111"/>
<text x="22" y="40" font-size="24" font-weight="bold" fill="#fff" text-anchor="start">X-07 · Self-Defense — Legal and Ethical Limits</text>
<rect x="40" y="110" width="320" height="55" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><rect x="40" y="180" width="320" height="55" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><rect x="40" y="250" width="320" height="55" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><rect x="40" y="320" width="320" height="55" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><text x="200" y="145" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">1. AVOID / LEAVE</text><text x="200" y="215" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">2. BARRIER / LOCK</text><text x="200" y="285" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">3. CALL FOR HELP</text><text x="200" y="355" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">4. LAST RESORT ONLY</text><line x1="380" y1="120" x2="380" y2="360" stroke="#111" stroke-width="3" marker-end="url(#ah)"/>
<text x="410" y="88" font-size="18" font-weight="bold" fill="#111" text-anchor="start">STEPS</text>
<circle cx="422" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="115" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">1</text>
<text x="446" y="115" font-size="16" fill="#111" text-anchor="start">Avoid, leave, lock out first</text>
<circle cx="422" cy="142" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="148" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text>
<text x="446" y="148" font-size="16" fill="#111" text-anchor="start">Force must be proportional</text>
<circle cx="422" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="181" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">3</text>
<text x="446" y="181" font-size="16" fill="#111" text-anchor="start">Property alone ≠ deadly force</text>
<circle cx="422" cy="208" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="214" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">4</text>
<text x="446" y="214" font-size="16" fill="#111" text-anchor="start">Learn MI rules in a class</text>
<circle cx="422" cy="241" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="247" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">5</text>
<text x="446" y="247" font-size="16" fill="#111" text-anchor="start">Lock up firearms (safe-storage law)</text>
<circle cx="422" cy="274" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="280" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">6</text>
<text x="446" y="280" font-size="16" fill="#111" text-anchor="start">After: safe, 911, lawyer</text>
<rect x="20" y="412" width="760" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="34" y="438" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">⚠ CAUTION</text>
<text x="34" y="464" font-size="16" fill="#111" text-anchor="start">Most people at your door are neighbors. Identify first.</text>
</svg>

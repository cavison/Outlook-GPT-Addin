<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">H-01 · Choose and Seal One Warm Room</text><rect x="30" y="80" width="440" height="330" stroke="#111" fill="none" stroke-width="4"/><line x1="250" y1="80" x2="250" y2="410" stroke="#111" stroke-width="3"/><line x1="30" y1="250" x2="470" y2="250" stroke="#111" stroke-width="3"/><rect x="254" y="254" width="212" height="152" fill="#fdebd0" stroke="#e67e22" stroke-width="3"/><text x="360" y="300" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">WARM ROOM</text><text x="140" y="170" font-size="16" text-anchor="middle" fill="#888">closed</text><text x="360" y="170" font-size="16" text-anchor="middle" fill="#888">closed</text><text x="140" y="340" font-size="16" text-anchor="middle" fill="#888">closed</text><line x1="300" y1="250" x2="350" y2="250" stroke="#e67e22" stroke-width="8"/><text x="330" y="240" font-size="16" text-anchor="middle" fill="#111">blanket</text><line x1="330" y1="410" x2="410" y2="410" stroke="#2b7bb9" stroke-width="8"/><text x="370" y="440" font-size="16" text-anchor="middle" fill="#2b7bb9">south window</text><rect x="275" y="330" width="80" height="50" fill="none" stroke="#111" stroke-width="2"/><text x="315" y="360" font-size="16" text-anchor="middle" fill="#111">rug</text><circle cx="440" cy="275" r="11" fill="#fff" stroke="#c0392b" stroke-width="3"/><text x="440" y="300" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="bold">CO</text><circle cx="230" cy="395" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="401" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="140" cy="200" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="206" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="325" cy="225" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="325" y="231" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="420" cy="470" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="476" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="270" cy="320" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="270" y="326" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="400" cy="335" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="400" y="341" font-size="17" font-weight="bold" text-anchor="middle">6</text><circle cx="470" cy="275" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="281" font-size="17" font-weight="bold" text-anchor="middle">7</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">Interior room, few</text><text x="553" y="135" font-size="16" text-anchor="start" fill="#111">outside walls</text><circle cx="530" cy="165" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="171" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="171" font-size="16" text-anchor="start" fill="#111">Close other rooms</text><circle cx="530" cy="201" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="207" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="207" font-size="16" text-anchor="start" fill="#111">Blanket over door,</text><text x="553" y="227" font-size="16" text-anchor="start" fill="#111">towel at the gap</text><circle cx="530" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="263" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="553" y="263" font-size="16" text-anchor="start" fill="#111">Cover windows at night</text><circle cx="530" cy="293" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="299" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="553" y="299" font-size="16" text-anchor="start" fill="#111">Rugs on the floor</text><circle cx="530" cy="329" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="335" font-size="17" font-weight="bold" text-anchor="middle">6</text><text x="553" y="335" font-size="16" text-anchor="start" fill="#111">Everyone in one room</text><circle cx="530" cy="365" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="371" font-size="17" font-weight="bold" text-anchor="middle">7</text><text x="553" y="371" font-size="16" text-anchor="start" fill="#111">CO + smoke alarms</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-01 · Eat in the Right Order</text>
<rect x="40" y="90" width="110" height="200" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="95" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">FRIDGE</text><text x="95" y="200" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">~4 h</text><rect x="190" y="90" width="110" height="200" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="3"/><text x="245" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">FREEZER</text><text x="245" y="185" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">24-48 h</text><text x="245" y="210" font-size="16" text-anchor="middle" fill="#111">if closed</text><rect x="340" y="90" width="130" height="200" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="405" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">PANTRY</text><rect x="355" y="110" width="100" height="6" rx="0" fill="#111" stroke="#111" stroke-width="1"/><rect x="355" y="155" width="100" height="6" rx="0" fill="#111" stroke="#111" stroke-width="1"/><rect x="355" y="200" width="100" height="6" rx="0" fill="#111" stroke="#111" stroke-width="1"/><rect x="355" y="245" width="100" height="6" rx="0" fill="#111" stroke="#111" stroke-width="1"/><text x="405" y="280" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">weeks+</text><line x1="150" y1="330" x2="185" y2="330" stroke="#111" stroke-width="4" marker-end="url(#ar)"/><line x1="300" y1="330" x2="335" y2="330" stroke="#111" stroke-width="4" marker-end="url(#ar)"/><text x="95" y="336" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">1st</text><text x="245" y="336" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">2nd</text><text x="405" y="336" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">3rd</text><circle cx="60" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="210" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="210" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="450" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="450" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text><circle cx="95" cy="375" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="95" y="381" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="245" cy="375" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="245" y="381" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text><text x="115" y="381" font-size="16" text-anchor="start" fill="#111">Log time on door</text><text x="265" y="381" font-size="16" text-anchor="start" fill="#c0392b">Above 40°F 2 h+ = toss</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Eat fridge food first</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Doors shut; log time</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Freezer food as it thaws</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Cook thawed meat fully</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Sturdy produce next</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Pantry food last</text>
<circle cx="528" cy="288" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="294" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="294" font-size="16" text-anchor="start" fill="#111">Check temps: 40°F rule</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">TIP: Pack freezer items into one tight block. In winter, freeze water jugs outdoors</text>
<text x="25" y="477" font-size="16" text-anchor="start" fill="#111">for free ice.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">R-12 · Build a Bike Trailer or Hand Cart</text>
<circle cx="80" cy="300" r="45" stroke="#111" stroke-width="3" fill="none"/><circle cx="80" cy="300" r="6" fill="#111"/><path d="M80,300 L150,250 L230,250 L180,300 Z" stroke="#111" stroke-width="3" fill="none"/><text x="60" y="370" font-size="16" text-anchor="start" fill="#111">bike (rear axle / seat post hitch)</text><line x1="150" y1="250" x2="260" y2="280" stroke="#111" stroke-width="4"/><circle cx="260" cy="280" r="8" fill="#fff" stroke="#c0392b" stroke-width="3"/><line x1="260" y1="280" x2="320" y2="280" stroke="#111" stroke-width="4"/><rect x="320" y="230" width="140" height="70" stroke="#111" stroke-width="3" fill="none"/><circle cx="390" cy="320" r="30" stroke="#111" stroke-width="3" fill="none"/><circle cx="390" cy="320" r="5" fill="#111"/><text x="330" y="220" font-size="16" text-anchor="start" fill="#111">trailer bed</text><text x="250" y="315" font-size="16" text-anchor="start" fill="#c0392b">hitch + safety strap</text><path d="M335,295 L450,295" stroke="#2e7d32" stroke-width="3"/><text x="325" y="385" font-size="16" text-anchor="start" fill="#2e7d32">heavy load low,</text><text x="325" y="405" font-size="16" text-anchor="start" fill="#2e7d32">over the axle</text><path d="M40,120 L60,180 L140,180 L160,120 Z" stroke="#111" stroke-width="3" fill="none"/><circle cx="160" cy="190" r="16" stroke="#111" stroke-width="3" fill="none"/><line x1="40" y1="120" x2="20" y2="90" stroke="#111" stroke-width="3" fill="none"/><text x="30" y="80" font-size="16" text-anchor="start" fill="#111">or: wheelbarrow/garden cart/hand truck</text><rect x="230" y="110" width="80" height="20" stroke="#111" stroke-width="3" fill="none"/><text x="320" y="128" font-size="16" text-anchor="start" fill="#111">2x4 tongue, bolts</text><line x1="370" y1="150" x2="460" y2="150" stroke="#888" stroke-width="2"/><text x="240" y="175" font-size="16" text-anchor="start" fill="#111">Load: maker limit, or test light</text><circle cx="20" cy="150" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="20" y="156" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="220" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="220" y="116" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="270" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="270" y="256" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="480" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="480" y="256" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="310" cy="400" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="310" y="406" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="130" cy="400" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="130" y="406" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Start from a cart or kids' trailer</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Bolt a straight 2x4 tongue</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Hitch + backup strap</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Load limit: maker's</text>
<text x="553" y="206" font-size="16" text-anchor="start" fill="#111"> rating, never more</text>
<circle cx="530" cy="236" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="242" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="241" font-size="16" text-anchor="start" fill="#111">Heavy items low, centered</text>
<circle cx="530" cy="271" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="277" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="276" font-size="16" text-anchor="start" fill="#111">Slow on hills; lights at night</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Overloaded trailers push the bike on hills and jackknife.</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">Never carry children in a homemade trailer.</text>
</svg>
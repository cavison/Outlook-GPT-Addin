<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">S-07 · Three-Tub Dishwashing</text>
<path d="M40,200 L170,200 L155,300 L55,300 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><line x1="45" y1="220" x2="165" y2="220" stroke="#2b7bb9" stroke-width="2"/><text x="105" y="330" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">1 WASH</text><path d="M185,200 L315,200 L300,300 L200,300 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><line x1="190" y1="220" x2="310" y2="220" stroke="#2b7bb9" stroke-width="2"/><text x="250" y="330" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">2 RINSE</text><path d="M330,200 L460,200 L445,300 L345,300 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><line x1="335" y1="220" x2="455" y2="220" stroke="#2b7bb9" stroke-width="2"/><text x="395" y="330" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">3 SANITIZE</text><text x="105" y="360" font-size="16" text-anchor="middle" fill="#111">hot + soap</text><text x="250" y="360" font-size="16" text-anchor="middle" fill="#111">clean water</text><text x="395" y="360" font-size="16" text-anchor="middle" fill="#111">1 Tbsp bleach/gal</text><text x="395" y="380" font-size="16" text-anchor="middle" fill="#111">1 min soak</text><path d="M170,170 L190,170" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><path d="M315,170 L335,170" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)"/><rect x="40" y="100" width="60" height="40" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="70" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">scrape</text><line x1="380" y1="400" x2="380" y2="425" stroke="#111" stroke-width="2"/><line x1="395" y1="400" x2="395" y2="425" stroke="#111" stroke-width="2"/><line x1="410" y1="400" x2="410" y2="425" stroke="#111" stroke-width="2"/><line x1="425" y1="400" x2="425" y2="425" stroke="#111" stroke-width="2"/><line x1="440" y1="400" x2="440" y2="425" stroke="#111" stroke-width="2"/><text x="320" y="420" font-size="16" font-weight="bold" text-anchor="start" fill="#111">air-dry</text><circle cx="120" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="126" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="60" cy="190" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="205" cy="190" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="205" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="350" cy="190" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="350" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="460" cy="412" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="460" y="418" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text><circle cx="40" cy="400" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="406" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Scrape scraps first</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">WASH: hot soapy water</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">RINSE: clean water</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">SANITIZE: 1 Tbsp</text>
<text x="552" y="220" font-size="16" text-anchor="start" fill="#111">bleach/gal</text>
<circle cx="528" cy="245" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="251" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="251" font-size="16" text-anchor="start" fill="#111">Air-dry, no towel</text>
<circle cx="528" cy="276" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="282" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="282" font-size="16" text-anchor="start" fill="#111">Change water when dirty</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Never mix bleach with ammonia, vinegar or other cleaners. Toxic gas.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">S-09 · Menstrual, Infant, Incontinence</text>
<rect x="40" y="110" width="130" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><text x="105" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">pads</text><text x="105" y="175" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">cup</text><text x="105" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">cloth</text><rect x="190" y="110" width="130" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><text x="255" y="160" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">diapers</text><text x="255" y="185" font-size="16" text-anchor="middle" fill="#111">+ wipes</text><rect x="340" y="110" width="130" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><text x="405" y="160" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">briefs</text><text x="405" y="185" font-size="16" text-anchor="middle" fill="#111">bed pads</text><text x="250" y="250" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">per day × 90 + extra</text><path d="M60,290 L160,290 L150,400 L70,400 Z" fill="#d6eaf8" stroke="#111" stroke-width="3"/><path d="M65,290 Q110.0,255 155,290" fill="none" stroke="#111" stroke-width="2"/><rect x="54" y="280" width="112" height="10" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="110.0" y="351.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">PAIL</text><path d="M220,290 L320,290 L310,400 L230,400 Z" fill="#ddd" stroke="#111" stroke-width="3"/><path d="M225,290 Q270.0,255 315,290" fill="none" stroke="#111" stroke-width="2"/><rect x="214" y="280" width="112" height="10" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="270.0" y="351.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">WASTE</text><line x1="350" y1="330" x2="470" y2="330" stroke="#111" stroke-width="2"/><rect x="360" y="330" width="25" height="30" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><rect x="395" y="330" width="25" height="30" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><rect x="430" y="330" width="25" height="30" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="410" y="390" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">sun dry</text><circle cx="40" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="256" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="175" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="175" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="330" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="330" y="306" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="160" cy="290" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="160" y="296" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text><circle cx="470" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="256" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Count 90-day needs</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Keep reusable backups</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Change often, air-dry skin</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Bag disposables</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Cloth: rinse, soak, wash,</text>
<text x="552" y="251" font-size="16" text-anchor="start" fill="#111">dry</text>
<circle cx="528" cy="276" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="282" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="282" font-size="16" text-anchor="start" fill="#111">Wash hands after</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Follow tampon package time limits (toxic shock syndrome). Watch babies for</text>
<text x="25" y="477" font-size="16" text-anchor="start" fill="#111">dehydration.</text>
</svg>

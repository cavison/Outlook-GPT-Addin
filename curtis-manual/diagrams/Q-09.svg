<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">Q-09 · Short Outage or Long One?</text>
<text x="780" y="40" font-size="18" text-anchor="end" fill="#f5a623" font-weight="bold">QUICK START</text>
<rect x="240" y="70" width="320" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><text x="400.0" y="96" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Is it just your house?</text><text x="400.0" y="118" font-size="16" text-anchor="middle" fill="#111">check neighbors' lights</text><line x1="320" y1="130" x2="140" y2="165" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="200" y="150" font-size="16" text-anchor="start" fill="#111" font-weight="bold">YES</text><rect x="30" y="165" width="230" height="60" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="3"/><text x="145.0" y="191" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Check breakers,</text><text x="145.0" y="213" font-size="16" text-anchor="middle" fill="#111">then call utility</text><line x1="480" y1="130" x2="560" y2="165" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="530" y="150" font-size="16" text-anchor="start" fill="#111" font-weight="bold">NO</text><rect x="420" y="165" width="360" height="60" rx="8" fill="#fff" stroke="#111" stroke-width="3"/><text x="600.0" y="191" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Big storm, ice, or wide damage?</text><line x1="500" y1="225" x2="380" y2="260" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="420" y="250" font-size="16" text-anchor="start" fill="#111" font-weight="bold">NO</text><rect x="240" y="260" width="230" height="60" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="3"/><text x="355.0" y="286" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Likely hours.</text><text x="355.0" y="308" font-size="16" text-anchor="middle" fill="#111">Q-01 is enough</text><line x1="700" y1="225" x2="680" y2="260" stroke="#111" stroke-width="3" marker-end="url(#ah)"/><text x="705" y="250" font-size="16" text-anchor="start" fill="#111" font-weight="bold">YES</text><rect x="500" y="260" width="280" height="60" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="640.0" y="286" font-size="18" text-anchor="middle" fill="#111" font-weight="bold">Plan for days+.</text><text x="640.0" y="308" font-size="16" text-anchor="middle" fill="#111">Start the 72h plan</text><circle cx="240" cy="70" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="240" y="76" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="420" cy="165" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="171" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="500" cy="260" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="500" y="266" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="30" y="300" font-size="16" text-anchor="start" fill="#111" font-weight="bold">No estimate</text><text x="30" y="320" font-size="16" text-anchor="start" fill="#111" font-weight="bold">after 24 h? Plan</text><text x="30" y="340" font-size="16" text-anchor="start" fill="#111" font-weight="bold">for a long one.</text><circle cx="200" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="200" y="306" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Act early. Filling water costs nothing if power comes back.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Single homes are fixed last. Re-report if neighbors get power and you don't.</text>
</svg>
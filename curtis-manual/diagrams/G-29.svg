="start" fill="#111" font-weight="bold">Catfish / bullhead</text><text x="145" y="384" font-size="16" text-anchor="start" fill="#111">whiskers</text><text x="145" y="404" font-size="16" text-anchor="start" fill="#111">spines!</text><rect x="260" y="334" width="230" height="82" fill="none" stroke="#888" stroke-width="2"/><path d="M268,384 Q312.0,364 356.0,384 Q312.0,404 268,384 Z" stroke="#111" stroke-width="3" fill="none"/><path d="M356.0,384 L378,372.0 L378,396.0 Z" stroke="#111" stroke-width="3" fill="none"/><circle cx="281.2" cy="381.0" r="3" fill="#111"/><text x="268" y="354" font-size="16" text-anchor="start" fill="#111" font-weight="bold">Sucker / carp</text><text x="385" y="384" font-size="16" text-anchor="start" fill="#111">small down-mouth</text><text x="385" y="404" font-size="16" text-anchor="start" fill="#111"></text><circle cx="488" cy="85" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="488" y="91" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="488" cy="173" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="488" y="179" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="488" cy="261" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="488" y="267" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="488" cy="349" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="488" y="355" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Check shape + mouth</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Count bars, spots, fins</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Find whiskers/teeth/spines</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Look up limits in current</text>
<text x="553" y="206" font-size="16" text-anchor="start" fill="#111"> Michigan Fishing Guide</text>
<circle cx="530" cy="236" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="242" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="241" font-size="16" text-anchor="start" fill="#111">Eat Safe Fish (MDHHS)</text>
<text x="553" y="260" font-size="16" text-anchor="start" fill="#111"> before eating</text>
<circle cx="530" cy="290" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="296" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="295" font-size="16" text-anchor="start" fill="#111">Sturgeon: release at once</text>
<text x="553" y="314" font-size="16" text-anchor="start" fill="#111"> (protected)</text>
<circle cx="530" cy="344" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="350" font-size="17" font-weight="bold" text-anchor="middle">7</text>
<text x="553" y="349" font-size="16" text-anchor="start" fill="#111">Gar/bowfin: sharp teeth,</text>
<text x="553" y="368" font-size="16" text-anchor="start" fill="#111"> use pliers</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Lake sturgeon are protected: never keep one. Salmon/steelhead</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">in the Grand River have special rules. Check Eat Safe Fish.</text>

" width="50" height="60" fill="#2b7bb9" stroke="#111" stroke-width="3"/><text x="425" y="470" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">1-K</text><text x="330" y="470" font-size="16" text-anchor="end" fill="#111">refuel outside:</text><circle cx="150" cy="240" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="150" y="246" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="360" cy="100" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="360" y="106" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="280" cy="255" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="280" y="261" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="60" cy="180" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="186" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="470" cy="395" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="401" font-size="17" font-weight="bold" text-anchor="middle">5</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">Label says INDOOR</text><circle cx="530" cy="145" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="151" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="151" font-size="16" text-anchor="start" fill="#111">CO alarm in room</text><circle cx="530" cy="181" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="187" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="187" font-size="16" text-anchor="start" fill="#111">3 ft from anything</
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">S-08 · Garbage, Rats and Flies</text>
<rect x="40" y="170" width="90" height="150" rx="6" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="35" y="155" width="100" height="16" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><rect x="150" y="170" width="90" height="150" rx="6" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="145" y="155" width="100" height="16" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><rect x="260" y="170" width="90" height="150" rx="6" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="255" y="155" width="100" height="16" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><rect x="370" y="170" width="90" height="150" rx="6" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="365" y="155" width="100" height="16" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><text x="85" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">FOOD</text><text x="195" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">PAPER</text><text x="305" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">CANS</text><text x="415" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">HAZ.</text><line x1="35" y1="200" x2="135" y2="200" stroke="#888" stroke-width="4"/><text x="85" y="345" font-size="16" text-anchor="middle" fill="#111">sealed, strapped</text><path d="M200,400 q20,-25 50,-8 q12,-15 18,0 l25,12 q-40,20 -93,-4 z" fill="#fff" stroke="#111" stroke-width="2"/><line x1="200" y1="400" x2="170" y2="410" stroke="#111" stroke-width="2"/><text x="320" y="410" font-size="18" font-weight="bold" text-anchor="start" fill="#c0392b">✘ burning trash</text><circle cx="250" cy="130" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="136" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="40" cy="140" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="146" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="470" cy="330" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="336" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="160" cy="380" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="160" y="386" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Sort into 4 bins</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Rinse and crush cans</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Seal wet food waste</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Cans outside, in shade</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Compost plant scraps</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Daily pest check, traps</text>
<circle cx="528" cy="288" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="294" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="294" font-size="16" text-anchor="start" fill="#111">Use local drop-offs</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">TIP: Seal wet garbage within hours. Flies and rats follow food waste, not paper.</text>
</svg>

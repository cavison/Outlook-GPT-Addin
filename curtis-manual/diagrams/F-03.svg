<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-03 · The 90-Day Pantry Calculator</text>
<path d="M40,110 L125,110 L115,210 L50,210 Z" fill="none" stroke="#111" stroke-width="3"/><path d="M45,110 Q82.5,75 120,110" fill="none" stroke="#111" stroke-width="2"/><text x="82.5" y="166.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">RICE</text><path d="M150,110 L235,110 L225,210 L160,210 Z" fill="none" stroke="#111" stroke-width="3"/><path d="M155,110 Q192.5,75 230,110" fill="none" stroke="#111" stroke-width="2"/><text x="192.5" y="166.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">FLOUR</text><path d="M260,110 L345,110 L335,210 L270,210 Z" fill="none" stroke="#111" stroke-width="3"/><path d="M265,110 Q302.5,75 340,110" fill="none" stroke="#111" stroke-width="2"/><text x="302.5" y="166.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">OATS</text><path d="M370,110 L455,110 L445,210 L380,210 Z" fill="none" stroke="#111" stroke-width="3"/><path d="M375,110 Q412.5,75 450,110" fill="none" stroke="#111" stroke-width="2"/><text x="412.5" y="166.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">BEANS</text><text x="82" y="240" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">22 lb</text><text x="192" y="240" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">19 lb</text><text x="302" y="240" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">13 lb</text><text x="412" y="240" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">15 lb</text><text x="240" y="280" font-size="16" text-anchor="middle" fill="#111">per adult, 90 days</text><rect x="40" y="310" width="420" height="70" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="340" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">adults × 1  +  kids × 0.5–0.75</text><text x="250" y="368" font-size="18" text-anchor="middle" fill="#111">= adult-shares</text><circle cx="40" cy="310" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="316" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="460" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="460" y="126" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="40" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="126" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text><text x="250" y="412" font-size="16" text-anchor="middle" fill="#111">~2,000 kcal per adult per day</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Count adult-shares</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Multiply the table</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Swap in foods you eat</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Subtract what you have</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Buy a bit each trip</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Label, date, rotate</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">TIP: Plan water and fuel for cooking too. Dry beans and rice need both.</text>
</svg>

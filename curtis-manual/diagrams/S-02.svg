<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">S-02 · Bag, Store, Dispose</text>
<path d="M60,170 Q120,120 180,170 L190,330 L50,330 Z" fill="#fff" stroke="#111" stroke-width="3"/><path d="M100,150 l20,-25 l20,25" fill="none" stroke="#111" stroke-width="3"/><text x="120" y="260" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">2 bags</text><circle cx="40" cy="150" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="156" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><rect x="260" y="170" width="160" height="170" rx="6" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="250" y="155" width="180" height="18" rx="6" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="240" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">HUMAN</text><text x="340" y="262" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">WASTE</text><line x1="250" y1="210" x2="430" y2="210" stroke="#888" stroke-width="4"/><circle cx="440" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="440" y="256" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="440" cy="160" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="440" y="166" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><text x="340" y="370" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">outside, shade, lid strapped</text><text x="60" y="410" font-size="18" font-weight="bold" text-anchor="start" fill="#c0392b">✘ storm drain</text><text x="260" y="410" font-size="18" font-weight="bold" text-anchor="start" fill="#c0392b">✘ burn bags</text><path d="M200,240 L245,240" fill="none" stroke="#111" stroke-width="3" marker-end="url(#ar)"/>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Gloves; tie both bags</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Into lidded marked can</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Outside, shade, strapped</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Cover between bags</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Follow health dept. rules</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Wash hands</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Never dump waste in storm drains or ditches. Don't flush if your sewer lift</text>
<text x="25" y="477" font-size="16" text-anchor="start" fill="#111">station is down.</text>
</svg>

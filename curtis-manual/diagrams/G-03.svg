<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-03 · Container and Bucket Gardening</text>
<path d="M150,160 L350,160 L330,380 L170,380 Z" stroke="#111" stroke-width="3" fill="none"/><ellipse cx="250" cy="160" rx="100" ry="14" stroke="#111" stroke-width="3" fill="none"/><path d="M156,185 L344,185" stroke="#111" stroke-width="2" stroke-dasharray="6 5"/><text x="360" y="190" font-size="16" text-anchor="start" fill="#111">1 in. below rim</text><path d="M158,200 L342,200 L330,380 L170,380 Z" fill="#c8b49a" fill-opacity="0.4" stroke="none"/><line x1="250" y1="200" x2="250" y2="100" stroke="#2e7d32" stroke-width="4"/><ellipse cx="225" cy="120" rx="25" ry="10" fill="none" stroke="#2e7d32" stroke-width="3"/><ellipse cx="275" cy="105" rx="25" ry="10" fill="none" stroke="#2e7d32" stroke-width="3"/><rect x="150" y="380" width="40" height="22" stroke="#111" stroke-width="3" fill="none"/><rect x="310" y="380" width="40" height="22" stroke="#111" stroke-width="3" fill="none"/><line x1="200" y1="384" x2="200" y2="410" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><line x1="225" y1="384" x2="225" y2="410" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><line x1="250" y1="384" x2="250" y2="410" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><line x1="275" y1="384" x2="275" y2="410" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><line x1="300" y1="384" x2="300" y2="410" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><circle cx="420" cy="90" r="25" fill="none" stroke="#e67e22" stroke-width="4"/><text x="420" y="140" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">6+ hrs sun</text><circle cx="250" cy="360" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="366" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="120" cy="392" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="398" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="120" cy="230" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="236" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="300" cy="95" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="101" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="470" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="470" y="96" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">Drill 5–8 drain holes</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Raise on bricks</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Fill to 1 in. of rim</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Plant 1 big / several small</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">6+ hours direct sun</text>
<circle cx="530" cy="252" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="258" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="257" font-size="16" text-anchor="start" fill="#111">Water when top inch dry</text>
<circle cx="530" cy="287" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="293" font-size="17" font-weight="bold" text-anchor="middle">7</text>
<text x="553" y="292" font-size="16" text-anchor="start" fill="#111">Feed every few weeks</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">Never use buckets that held paint, solvents, pesticides or oil.</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">In July heat containers can dry out in one day.</text>
</svg>

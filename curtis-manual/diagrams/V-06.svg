<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<text x="400" y="38" font-size="26" font-weight="bold" text-anchor="middle">Review, Restock, Get Ready Again</text>
<!-- cycle -->
<g font-size="18" text-anchor="middle">
<rect x="300" y="70" width="200" height="70" rx="10" fill="none" stroke="#111" stroke-width="4"/><text x="400" y="102">Family meeting</text><text x="400" y="124" font-size="15">within 1–2 weeks</text>
<rect x="560" y="160" width="210" height="80" rx="10" fill="none" stroke="#111" stroke-width="4"/><text x="665" y="190">Went well?</text><text x="665" y="212">Went badly?</text><text x="665" y="232" font-size="15">Change what?</text>
<rect x="560" y="300" width="210" height="70" rx="10" fill="none" stroke="#2b7bb9" stroke-width="4"/><text x="665" y="332">Check logs:</text><text x="665" y="354" font-size="15">real daily use</text>
<rect x="300" y="390" width="200" height="70" rx="10" fill="none" stroke="#2e7d32" stroke-width="4"/><text x="400" y="420">Restock list</text><text x="400" y="442" font-size="15">used first, then gaps</text>
<rect x="30" y="300" width="210" height="70" rx="10" fill="none" stroke="#111" stroke-width="4"/><text x="135" y="332">Buy a little</text><text x="135" y="354" font-size="15">each trip</text>
<rect x="30" y="160" width="210" height="80" rx="10" fill="none" stroke="#e67e22" stroke-width="4"/><text x="135" y="192">Service gear</text><text x="135" y="216" font-size="15">fuel, batteries, jugs</text>
</g>
<g stroke="#111" stroke-width="3" fill="none" marker-end="url(#ar)">
<path d="M500,105 Q600,110 640,155"/>
<line x1="665" y1="242" x2="665" y2="294"/>
<path d="M640,372 Q600,430 505,425"/>
<path d="M295,425 Q180,430 150,375"/>
<line x1="135" y1="298" x2="135" y2="246"/>
<path d="M160,158 Q200,105 295,105"/>
</g>
<text x="400" y="270" font-size="20" text-anchor="middle" font-weight="bold">Update the paper plan</text>
<g font-size="18" font-weight="bold" text-anchor="middle">
<circle cx="300" cy="65" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="71">1</text>
<circle cx="770" cy="155" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="770" y="161">2</text>
<circle cx="770" cy="295" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="770" y="301">3</text>
<circle cx="500" cy="385" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="500" y="391">4</text>
<circle cx="30" cy="295" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="30" y="301">5</text>
<circle cx="30" cy="155" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="30" y="161">6</text>
<circle cx="285" cy="263" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="285" y="269">7</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">H-10 · Sleep Warm</text><rect x="50" y="340" width="380" height="18" fill="#ddd" stroke="#111" stroke-width="3"/><rect x="50" y="322" width="380" height="18" fill="#fff" stroke="#111" stroke-width="3"/><text x="240" y="385" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">pads + blankets UNDER you</text><path d="M80,322 Q90,240 160,250 L400,260 Q430,290 410,322 Z" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="120" cy="270" r="26" fill="#fff" stroke="#111" stroke-width="3"/><path d="M95,262 Q120,228 145,262 Z" fill="#e67e22" stroke="#111" stroke-width="2"/><rect x="250" y="275" width="50" height="28" rx="8" fill="#d6eaf8" stroke="#2b7bb9" stroke-width="3"/><text x="275" y="235" font-size="16" text-anchor="middle" fill="#2b7bb9">warm bottle</text><line x1="240" y1="400" x2="240" y2="360" stroke="#2e7d32" stroke-width="3" marker-end="url(#arG)"/><text x="240" y="430" font-size="16" text-anchor="middle" fill="#888">the floor steals heat</text><text x="120" y="200" font-size="16" text-anchor="middle" fill="#111">hat</text><circle cx="30" cy="340" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="30" y="346" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="160" cy="215" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="160" y="221" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="320" cy="270" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="320" y="276" font-size="17" font-weight="bold" text-anchor="middle">6</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">Insulate under first</text><circle cx="530" cy="145" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="151" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="151" font-size="16" text-anchor="start" fill="#111">Dry sleep clothes</text><circle cx="530" cy="181" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="187" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Hat and dry socks</text><circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="553" y="223" font-size="16" text-anchor="start" fill="#111">Snack + warm drink</text><circle cx="530" cy="253" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="259" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="553" y="259" font-size="16" text-anchor="start" fill="#111">Pee before bed</text><circle cx="530" cy="289" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="295" font-size="17" font-weight="bold" text-anchor="middle">6</text><text x="553" y="295" font-size="16" text-anchor="start" fill="#111">Warm (not boiling)</text><text x="553" y="315" font-size="16" text-anchor="start" fill="#111">bottle, wrapped</text><circle cx="530" cy="345" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="351" font-size="17" font-weight="bold" text-anchor="middle">7</text><text x="553" y="351" font-size="16" text-anchor="start" fill="#111">Sleep close together</text></svg>

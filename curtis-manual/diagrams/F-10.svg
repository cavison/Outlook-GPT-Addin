<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-10 · Skillet Flatbread</text>
<path d="M60,170 Q140,240 220,170" fill="#fff" stroke="#111" stroke-width="3"/><line x1="60" y1="170" x2="220" y2="170" stroke="#111" stroke-width="3"/><text x="140" y="145" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">flour + salt + water</text><circle cx="60" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="230" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="330" cy="200" r="45" fill="#f5e6c8" stroke="#111" stroke-width="3"/><text x="330" y="205" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">knead</text><circle cx="390" cy="150" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="390" y="156" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="70" cy="290" r="18" fill="#f5e6c8" stroke="#111" stroke-width="3"/><circle cx="120" cy="290" r="18" fill="#f5e6c8" stroke="#111" stroke-width="3"/><circle cx="170" cy="290" r="18" fill="#f5e6c8" stroke="#111" stroke-width="3"/><circle cx="220" cy="290" r="18" fill="#f5e6c8" stroke="#111" stroke-width="3"/><circle cx="40" cy="260" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="266" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><path d="M300,290 L380,290 L380,300 L300,300 Z" fill="#f5e6c8" stroke="#111" stroke-width="3"/><text x="340" y="325" font-size="16" text-anchor="middle" fill="#111">1/8 in thin</text><circle cx="180" cy="380" r="50" fill="#333" stroke="#111" stroke-width="3"/><line x1="230" y1="380" x2="320" y2="380" stroke="#111" stroke-width="8"/><circle cx="180" cy="380" r="38" fill="#f5e6c8" stroke="#111" stroke-width="2"/><circle cx="160" cy="365" r="4" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1"/><circle cx="182" cy="380" r="4" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1"/><circle cx="165" cy="390" r="4" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1"/><circle cx="185" cy="363" r="4" fill="#8b5a2b" stroke="#8b5a2b" stroke-width="1"/><circle cx="110" cy="370" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="110" y="376" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text><circle cx="260" cy="350" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="260" y="356" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text><text x="340" y="390" font-size="16" font-weight="bold" text-anchor="start" fill="#111">1-2 min a side</text><path d="M180,430 q0,0 0,0 q0,0 0,0 q0,0 0,0 z" fill="#e67e22" stroke="#e67e22" stroke-width="2"/>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Mix flour and salt</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Add water slowly</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Knead 5 min; rest</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Make balls, press flat</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Heat dry skillet</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">1-2 min per side</text>
<circle cx="528" cy="288" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="294" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="294" font-size="16" text-anchor="start" fill="#111">Stack in a cloth</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: No raw dough for kids: raw flour can carry E. coli. Use only safe water.</text>
</svg>

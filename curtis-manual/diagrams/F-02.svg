<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">F-02 · Keep or Throw Out?</text>
<circle cx="110" cy="170" r="70" fill="#fff" stroke="#111" stroke-width="3"/><line x1="110" y1="170" x2="150" y2="130" stroke="#111" stroke-width="4"/><text x="110" y="230" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">40°F</text><text x="110" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">THERMOMETER</text><circle cx="40" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><rect x="220" y="100" width="70" height="90" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="3"/><text x="255" y="210" font-size="16" text-anchor="middle" fill="#111">ice crystals</text><text x="220" y="240" font-size="18" font-weight="bold" text-anchor="start" fill="#2e7d32">✔ refreeze</text><circle cx="310" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="310" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><rect x="340" y="100" width="60" height="80" rx="0" fill="none" stroke="#111" stroke-width="3"/><path d="M340,100 Q370,70 400,100" fill="none" stroke="#111" stroke-width="3"/><text x="370" y="210" font-size="16" text-anchor="middle" fill="#111">bulging</text><text x="340" y="240" font-size="18" font-weight="bold" text-anchor="start" fill="#c0392b">✘ toss</text><circle cx="420" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="116" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><rect x="40" y="300" width="60" height="80" rx="0" fill="none" stroke="#111" stroke-width="3"/><text x="70" y="400" font-size="16" text-anchor="middle" fill="#111">dented seam</text><text x="40" y="425" font-size="18" font-weight="bold" text-anchor="start" fill="#c0392b">✘ toss</text><rect x="170" y="290" width="120" height="90" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="330" font-size="16" text-anchor="middle" fill="#111">butter, hard</text><text x="230" y="350" font-size="16" text-anchor="middle" fill="#111">cheese, bread</text><text x="180" y="410" font-size="18" font-weight="bold" text-anchor="start" fill="#2e7d32">✔ usually OK</text><circle cx="300" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="306" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><path d="M330,330 q20,-15 40,0 t40,0 t40,0" fill="none" stroke="#2b7bb9" stroke-width="4"/><text x="390" y="375" font-size="16" text-anchor="middle" fill="#111">floodwater</text><text x="345" y="410" font-size="18" font-weight="bold" text-anchor="start" fill="#c0392b">✘ toss</text><circle cx="460" cy="330" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="460" y="336" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">Over 40°F 2 h+: toss</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">Ice crystals: refreeze</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Some foods keep</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Bad cans: toss</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Floodwater: toss</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Never taste-test</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Never taste a suspect can. Bulging or leaking cans can carry botulism.</text>
</svg>

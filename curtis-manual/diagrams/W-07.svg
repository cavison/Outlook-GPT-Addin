<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="52" fill="#111"/>
<text x="20" y="40" font-size="26" text-anchor="start" fill="#fff" font-weight="bold">W-07 · Build a Bucket Sand Filter</text>
<polygon points="120,90 280,90 270,330 130,330" fill="none" stroke="#111" stroke-width="4"/><rect x="132" y="270" width="136" height="55" rx="0" fill="#999" stroke="#111" stroke-width="3"/><text x="200" y="302" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">gravel</text><rect x="132" y="200" width="136" height="70" rx="0" fill="#e8dcc0" stroke="#111" stroke-width="3"/><text x="200" y="240" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">fine sand</text><rect x="132" y="160" width="136" height="40" rx="0" fill="#ddd" stroke="#111" stroke-width="3"/><text x="200" y="186" font-size="16" text-anchor="middle" fill="#111">cloth</text><circle cx="105" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="105" y="306" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="105" cy="235" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="105" y="241" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="105" cy="180" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="105" y="186" font-size="17" font-weight="bold" text-anchor="middle">3</text><line x1="200" y1="60" x2="200" y2="140" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><circle cx="230" cy="70" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="76" font-size="17" font-weight="bold" text-anchor="middle">4</text><line x1="200" y1="330" x2="200" y2="360" stroke="#111" stroke-width="4"/><line x1="200" y1="345" x2="200" y2="370" stroke="#2b7bb9" stroke-width="3" marker-end="url(#ah)"/><polygon points="164,369.5 236,369.5 230,380 170,380" fill="#d6eaf8"/><polygon points="160,365 240,365 230,380 170,380" fill="none" stroke="#111" stroke-width="3"/><path d="M160,365 q40.0,-6.75 80,0" fill="none" stroke="#111" stroke-width="3"/><circle cx="260" cy="360" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="260" y="366" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="300" y="230" font-size="16" text-anchor="start" fill="#111" font-weight="bold">then</text><text x="300" y="250" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">disinfect</text><circle cx="340" cy="280" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="340" y="286" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<circle cx="420" cy="84" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="90" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="444" y="90" font-size="17" text-anchor="start" fill="#111">Spigot + gravel layer.</text>
<circle cx="420" cy="114" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="120" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="444" y="120" font-size="17" text-anchor="start" fill="#111">Thick layer of rinsed fine sand.</text>
<circle cx="420" cy="144" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="150" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="444" y="150" font-size="17" text-anchor="start" fill="#111">Cloth on top.</text>
<circle cx="420" cy="174" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="180" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="444" y="180" font-size="17" text-anchor="start" fill="#111">Pour settled water in.</text>
<circle cx="420" cy="204" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="210" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="444" y="210" font-size="17" text-anchor="start" fill="#111">Collect; toss first batches.</text>
<circle cx="420" cy="234" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="420" y="240" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="444" y="240" font-size="17" text-anchor="start" fill="#111">Then boil or bleach.</text>
<rect x="14" y="392" width="772" height="44" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="26" y="420" font-size="16"><tspan font-weight="bold" fill="#c0392b">⚠ CAUTION: </tspan>Sand filters don't make water safe. Always boil or bleach after.</text>
<rect x="14" y="444" width="772" height="44" rx="0" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="26" y="472" font-size="16"><tspan font-weight="bold" fill="#2e7d32">FIELD NOTE: </tspan>Keep it wet and indoors; freezing kills the helpful top layer.</text>
</svg>
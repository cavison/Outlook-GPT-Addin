<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="52" fill="#111"/>
<text x="22" y="41" fill="#fff" font-size="24" font-weight="bold">M-06 · Sprains, Fractures, Splints</text>
<path d="M40,230 L420,230 L420,280 L40,280 Z" stroke="#111" stroke-width="4" fill="none"/><rect x="60" y="205" width="330" height="20" fill="#fff" stroke="#111" stroke-width="3"/><rect x="60" y="285" width="330" height="20" fill="#fff" stroke="#111" stroke-width="3"/><rect x="90" y="198" width="18" height="114" fill="none" stroke="#2e7d32" stroke-width="3"/><rect x="340" y="198" width="18" height="114" fill="none" stroke="#2e7d32" stroke-width="3"/><line x1="225" y1="230" x2="215" y2="280" stroke="#c0392b" stroke-width="4"/><text x="60" y="350" font-size="16" font-weight="bold">Splint spans the joint above AND below</text><text x="60" y="380" font-size="16" >Check fingers/toes: warm, pink, can feel</text><text x="60" y="430" font-size="16" >Sprain: rest, ice wrapped, compress, elevate</text>
<text x="470" y="86" font-size="18" font-weight="bold">STEPS</text>
<circle cx="486" cy="110" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="116" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="512" y="116" font-size="16" >Splint it as found; don't</text>
<text x="512" y="135" font-size="16" >straighten (unless no pulse</text>
<text x="512" y="154" font-size="16" >and help is far — trained only).</text>
<circle cx="486" cy="195" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="201" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="512" y="201" font-size="16" >Pad; rigid support both</text>
<text x="512" y="220" font-size="16" >sides past joints.</text>
<circle cx="486" cy="261" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="267" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="512" y="267" font-size="16" >Tie snug, not tight —</text>
<text x="512" y="286" font-size="16" >avoid knot on injury.</text>
<circle cx="486" cy="327" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="333" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="512" y="333" font-size="16" >Check circulation below</text>
<text x="512" y="352" font-size="16" >every 15–30 min.</text>
<circle cx="225" cy="180" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="225" y="186" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<circle cx="60" cy="255" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="261" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<circle cx="100" cy="330" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="100" y="336" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<circle cx="410" cy="330" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="410" y="336" font-size="18" font-weight="bold" text-anchor="middle">4</text>
</svg>
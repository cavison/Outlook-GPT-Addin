<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="6" y="6" width="788" height="488" fill="none" stroke="#111" stroke-width="3"/>
<rect x="6" y="6" width="788" height="52" fill="#111"/>
<text x="22" y="41" fill="#fff" font-size="24" font-weight="bold">M-13 · Fever and When to Seek Help</text>
<rect x="80" y="130" width="40" height="230" rx="20" stroke="#111" stroke-width="4" fill="none"/><circle cx="100" cy="380" r="35" fill="#c0392b" stroke="#111" stroke-width="3"/><rect x="92" y="230" width="16" height="140" fill="#c0392b"/><text x="160" y="160" font-size="16" font-weight="bold">Log temp + time + meds</text><text x="160" y="200" font-size="16" >Fluids, rest, light clothes</text><text x="160" y="260" font-size="16" fill="#c0392b" font-weight="bold">GET HELP NOW:</text><text x="160" y="285" font-size="16" >baby under 3 mo with fever</text><text x="160" y="307" font-size="16" >trouble breathing, stiff neck</text><text x="160" y="329" font-size="16" >confusion, won't wake</text><text x="160" y="351" font-size="16" >no urine, can't keep fluids</text>
<text x="470" y="86" font-size="18" font-weight="bold">STEPS</text>
<circle cx="486" cy="110" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="116" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<text x="512" y="116" font-size="16" >Take temp; write it down.</text>
<circle cx="486" cy="157" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="163" font-size="18" font-weight="bold" text-anchor="middle">2</text>
<text x="512" y="163" font-size="16" >Fluids + rest; dose fever</text>
<text x="512" y="182" font-size="16" >meds by label/weight.</text>
<circle cx="486" cy="223" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="229" font-size="18" font-weight="bold" text-anchor="middle">3</text>
<text x="512" y="229" font-size="16" >Isolate the sick person;</text>
<text x="512" y="248" font-size="16" >wash hands.</text>
<circle cx="486" cy="289" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="486" y="295" font-size="18" font-weight="bold" text-anchor="middle">4</text>
<text x="512" y="295" font-size="16" >Red flags = get help</text>
<text x="512" y="314" font-size="16" >immediately.</text>
<circle cx="140" cy="140" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="146" font-size="18" font-weight="bold" text-anchor="middle">1</text>
<circle cx="140" cy="260" r="17" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="266" font-size="18" font-weight="bold" text-anchor="middle">4</text>
</svg>
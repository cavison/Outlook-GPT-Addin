<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="5" y="5" width="790" height="490" rx="0" fill="none" stroke="#111" stroke-width="3"/>
<rect x="5" y="5" width="790" height="48" fill="#111"/>
<text x="20" y="38" font-size="24" font-weight="bold" text-anchor="start" fill="#fff">S-10 · Isolate a Sick Household Member</text>
<rect x="40" y="100" width="260" height="300" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><line x1="300" y1="200" x2="300" y2="300" stroke="#fff" stroke-width="6"/><path d="M300,200 L360,230" fill="none" stroke="#111" stroke-width="3"/><text x="170" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">SICK ROOM</text><rect x="70" y="280" width="150" height="50" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="90" cy="270" r="16" fill="#fff" stroke="#111" stroke-width="3"/><text x="150" y="360" font-size="16" text-anchor="middle" fill="#111">bed</text><path d="M230,300 L280,300 L270,360 L240,360 Z" fill="#fff" stroke="#111" stroke-width="3"/><path d="M235,300 Q255.0,265 275,300" fill="none" stroke="#111" stroke-width="2"/><rect x="224" y="290" width="62" height="10" rx="0" fill="#fff" stroke="#111" stroke-width="3"/><rect x="70" y="130" width="60" height="6" rx="0" fill="#111" stroke="#111" stroke-width="3"/><text x="100" y="155" font-size="14" text-anchor="middle" fill="#111">window</text><path d="M100,125 L100,90" fill="none" stroke="#888" stroke-width="3" marker-end="url(#ar)"/><circle cx="400" cy="220" r="20" fill="#fff" stroke="#111" stroke-width="3"/><line x1="400" y1="240" x2="400" y2="320" stroke="#111" stroke-width="3"/><line x1="400" y1="260" x2="370" y2="290" stroke="#111" stroke-width="3"/><line x1="400" y1="260" x2="430" y2="290" stroke="#111" stroke-width="3"/><line x1="400" y1="320" x2="380" y2="370" stroke="#111" stroke-width="3"/><line x1="400" y1="320" x2="420" y2="370" stroke="#111" stroke-width="3"/><rect x="388" y="220" width="24" height="12" rx="0" fill="#fff" stroke="#111" stroke-width="2"/><text x="400" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">1 caregiver</text><text x="400" y="415" font-size="16" text-anchor="middle" fill="#111">mask + gloves</text><rect x="180" y="180" width="40" height="60" rx="0" fill="#d6eaf8" stroke="#111" stroke-width="3"/><text x="200" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">ORS</text><circle cx="40" cy="90" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="40" y="96" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text><circle cx="450" cy="220" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="450" y="226" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text><circle cx="290" cy="290" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="290" y="296" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text><circle cx="440" cy="300" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="440" y="306" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text><circle cx="140" cy="210" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="216" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text><circle cx="230" cy="210" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="230" y="216" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<line x1="500" y1="65" x2="500" y2="425" stroke="#888" stroke-width="2"/>
<text x="515" y="82" font-size="18" font-weight="bold" text-anchor="start" fill="#111">STEPS</text>
<circle cx="528" cy="102" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="108" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">1</text>
<text x="552" y="108" font-size="16" text-anchor="start" fill="#111">One room, door closed</text>
<circle cx="528" cy="133" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="139" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">2</text>
<text x="552" y="139" font-size="16" text-anchor="start" fill="#111">One caregiver only</text>
<circle cx="528" cy="164" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="170" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">3</text>
<text x="552" y="170" font-size="16" text-anchor="start" fill="#111">Own bucket, cup, dishes</text>
<circle cx="528" cy="195" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="201" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">4</text>
<text x="552" y="201" font-size="16" text-anchor="start" fill="#111">Mask, gloves, wash hands</text>
<circle cx="528" cy="226" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="232" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">5</text>
<text x="552" y="232" font-size="16" text-anchor="start" fill="#111">Bleach: 1/3 cup per gal</text>
<circle cx="528" cy="257" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="263" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">6</text>
<text x="552" y="263" font-size="16" text-anchor="start" fill="#111">Sips of ORS; log fluids</text>
<circle cx="528" cy="288" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="528" y="294" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">7</text>
<text x="552" y="294" font-size="16" text-anchor="start" fill="#111">Know when to get help</text>
<rect x="15" y="438" width="770" height="48" rx="0" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="25" y="457" font-size="16" text-anchor="start" fill="#111">CAUTION: Hand sanitizer does not kill norovirus well. Use soap and water, and bleach</text>
<text x="25" y="477" font-size="16" text-anchor="start" fill="#111">on surfaces.</text>
</svg>

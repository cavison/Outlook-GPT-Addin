<text x="446" y="115" font-size="16" fill="#111" text-anchor="start">Sled on snow, cart on pavement</text>
<circle cx="422" cy="142" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="422" y="148" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">2</text>
<text x="446" y="148" font-size="16" fill="#111" text-anchor="start">Heavy items low + centered</text>

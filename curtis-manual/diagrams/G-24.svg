<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker></defs>
<rect x="0" y="0" width="800" height="500" fill="#fff"/>
<rect x="4" y="4" width="792" height="492" fill="none" stroke="#111" stroke-width="3"/>
<rect x="4" y="4" width="792" height="46" fill="#111"/>
<text x="20" y="35" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">G-24 · Deer — Field-Dress, Hang and Butcher</text>
<line x1="40" y1="70" x2="200" y2="70" stroke="#111" stroke-width="4"/><line x1="120" y1="70" x2="120" y2="95" stroke="#111" stroke-width="3" fill="none"/><path d="M95,95 L145,95" stroke="#111" stroke-width="3" fill="none"/><path d="M100,95 L95,140 M140,95 L145,140" stroke="#111" stroke-width="3" fill="none"/><path d="M90,140 Q80,220 100,300 L110,340 Q120,360 130,340 L140,300 Q160,220 150,140 Z" stroke="#111" stroke-width="3" fill="none"/><line x1="120" y1="160" x2="120" y2="290" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/><text x="160" y="200" font-size="16" text-anchor="start" fill="#111">hang head-down</text><text x="160" y="222" font-size="16" text-anchor="start" fill="#111">or head-up</text><text x="30" y="390" font-size="16" text-anchor="start" fill="#2b7bb9" font-weight="bold">Hang 34-40°F</text><text x="30" y="412" font-size="16" text-anchor="start" fill="#111">(below 40°F, not frozen)</text><path d="M260,250 Q250,200 300,190 L430,190 Q470,200 470,240 L470,280 Q460,300 430,300 L300,300 Q260,300 260,250 Z" stroke="#111" stroke-width="3" fill="none"/><line x1="310" y1="190" x2="310" y2="300" stroke="#111" stroke-width="2"/><line x1="380" y1="190" x2="380" y2="300" stroke="#111" stroke-width="2"/><line x1="420" y1="190" x2="420" y2="300" stroke="#111" stroke-width="2"/><line x1="310" y1="245" x2="380" y2="245" stroke="#111" stroke-width="2"/><text x="282" y="330" font-size="16" text-anchor="start" fill="#111">shoulder</text><text x="345" y="215" font-size="16" text-anchor="middle" fill="#111">loin</text><text x="345" y="275" font-size="16" text-anchor="middle" fill="#111">ribs</text><text x="400" y="250" font-size="16" text-anchor="middle" fill="#111">loin</text><text x="445" y="250" font-size="16" text-anchor="middle" fill="#111">ham</text><text x="260" y="370" font-size="16" text-anchor="start" fill="#111" font-weight="bold">Primal cuts (side view)</text><text x="250" y="110" font-size="16" text-anchor="start" fill="#2e7d32" font-weight="bold">Gloves on</text><text x="250" y="135" font-size="16" text-anchor="start" fill="#c0392b">No brain/spine</text><text x="250" y="155" font-size="16" text-anchor="start" fill="#c0392b">cuts (CWD)</text><circle cx="225" cy="105" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="225" y="111" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="60" cy="120" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="126" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="140" cy="175" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="140" y="181" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="60" cy="250" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="60" y="256" font-size="17" font-weight="bold" text-anchor="middle">4</text><circle cx="15" cy="390" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="15" y="396" font-size="17" font-weight="bold" text-anchor="middle">5</text><circle cx="250" cy="190" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="250" y="196" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<line x1="505" y1="62" x2="505" y2="418" stroke="#888" stroke-width="2"/>
<circle cx="530" cy="77" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="83" font-size="17" font-weight="bold" text-anchor="middle">1</text>
<text x="553" y="82" font-size="16" text-anchor="start" fill="#111">License + tag (or salvage permit)</text>
<circle cx="530" cy="112" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="118" font-size="17" font-weight="bold" text-anchor="middle">2</text>
<text x="553" y="117" font-size="16" text-anchor="start" fill="#111">Gloves; avoid spine/brain</text>
<circle cx="530" cy="147" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="153" font-size="17" font-weight="bold" text-anchor="middle">3</text>
<text x="553" y="152" font-size="16" text-anchor="start" fill="#111">Open belly, remove guts</text>
<circle cx="530" cy="182" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="188" font-size="17" font-weight="bold" text-anchor="middle">4</text>
<text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Cool fast; prop cavity open</text>
<circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">5</text>
<text x="553" y="222" font-size="16" text-anchor="start" fill="#111">Hang 34-40°F;</text>
<text x="553" y="241" font-size="16" text-anchor="start" fill="#111"> skin when ready</text>
<circle cx="530" cy="271" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="277" font-size="17" font-weight="bold" text-anchor="middle">6</text>
<text x="553" y="276" font-size="16" text-anchor="start" fill="#111">Bone out primal cuts</text>
<rect x="16" y="428" width="768" height="58" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="28" y="452" font-size="16" text-anchor="start" fill="#c0392b" font-weight="bold">CAUTION</text>
<text x="115" y="452" font-size="16" text-anchor="start" fill="#111">CWD: don't eat deer that test positive or act sick (DNR).</text>
<text x="115" y="474" font-size="16" text-anchor="start" fill="#111">Don't cut through spine or brain; wear gloves.</text>
</svg>
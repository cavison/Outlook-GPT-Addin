<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#111"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#c0392b"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2e7d32"/></marker><marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#2b7bb9"/></marker></defs><rect x="4" y="4" width="792" height="492" fill="#fff" stroke="#111" stroke-width="3"/><rect x="4" y="4" width="792" height="48" fill="#111"/><text x="20" y="37" font-size="22" text-anchor="start" fill="#fff" font-weight="bold">H-07 · Keep Pipes from Freezing</text><rect x="40" y="90" width="20" height="340" fill="#ddd" stroke="#111" stroke-width="3"/><text x="50" y="455" font-size="16" text-anchor="middle" fill="#111">outside wall</text><rect x="150" y="180" width="200" height="140" fill="none" stroke="#111" stroke-width="3"/><line x1="150" y1="180" x2="110" y2="200" stroke="#111" stroke-width="3"/><line x1="350" y1="180" x2="390" y2="200" stroke="#111" stroke-width="3"/><text x="250" y="345" font-size="16" text-anchor="middle" fill="#111">doors open</text><path d="M70,420 H220 V230" stroke="#2b7bb9" stroke-width="6" fill="none"/><rect x="90" y="410" width="110" height="20" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="5 3"/><text x="145" y="400" font-size="16" text-anchor="middle" fill="#e67e22">foam wrap</text><path d="M220,230 v-60 h40" stroke="#111" stroke-width="5" fill="none"/><circle cx="262" cy="190" r="4" fill="#2b7bb9"/><circle cx="262" cy="210" r="4" fill="#2b7bb9"/><circle cx="262" cy="230" r="4" fill="#2b7bb9"/><text x="280" y="215" font-size="16" text-anchor="start" fill="#2b7bb9">drip</text><circle cx="85" cy="110" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="85" y="116" font-size="17" font-weight="bold" text-anchor="middle">1</text><circle cx="145" cy="455" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="145" y="461" font-size="17" font-weight="bold" text-anchor="middle">2</text><circle cx="400" cy="220" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="400" y="226" font-size="17" font-weight="bold" text-anchor="middle">3</text><circle cx="300" cy="165" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="300" y="171" font-size="17" font-weight="bold" text-anchor="middle">4</text><line x1="500" y1="70" x2="500" y2="480" stroke="#888" stroke-width="2"/><text x="515" y="85" font-size="18" text-anchor="start" fill="#111" font-weight="bold">STEPS</text><circle cx="530" cy="109" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="115" font-size="17" font-weight="bold" text-anchor="middle">1</text><text x="553" y="115" font-size="16" text-anchor="start" fill="#111">Find exposed pipes</text><circle cx="530" cy="145" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="151" font-size="17" font-weight="bold" text-anchor="middle">2</text><text x="553" y="151" font-size="16" text-anchor="start" fill="#111">Wrap them</text><circle cx="530" cy="181" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="187" font-size="17" font-weight="bold" text-anchor="middle">3</text><text x="553" y="187" font-size="16" text-anchor="start" fill="#111">Open sink cabinets</text><circle cx="530" cy="217" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="223" font-size="17" font-weight="bold" text-anchor="middle">4</text><text x="553" y="223" font-size="16" text-anchor="start" fill="#111">Drip the faucet</text><circle cx="530" cy="253" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="259" font-size="17" font-weight="bold" text-anchor="middle">5</text><text x="553" y="259" font-size="16" text-anchor="start" fill="#111">Shut outside spigots</text><circle cx="530" cy="289" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="295" font-size="17" font-weight="bold" text-anchor="middle">6</text><text x="553" y="295" font-size="16" text-anchor="start" fill="#111">Thaw: warm towels,</text><text x="553" y="315" font-size="16" text-anchor="start" fill="#111">never a flame</text><circle cx="530" cy="345" r="15" fill="#fff" stroke="#111" stroke-width="3"/><text x="530" y="351" font-size="17" font-weight="bold" text-anchor="middle">7</text><text x="553" y="351" font-size="16" text-anchor="start" fill="#111">Long cold? Drain: H-08</text></svg>

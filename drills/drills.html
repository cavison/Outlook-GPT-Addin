<title>Cottage Service Drills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FBFAF8; --surface:#FFFFFF; --sunk:#F2F0EC;
  --ink:#14181D; --slate:#58616F; --faint:#8C94A0; --rule:#E3E0DA;
  --brass:#9A722F; --brass-bg:#F4E9D6;
  --good:#47723A; --good-bg:#E7EFE3;
  --better:#2A6899; --better-bg:#E2EDF6;
  --best:#A95C26; --best-bg:#F8E8DA;
  --flag:#A93C34; --flag-bg:#F9E3E1;
  --gold:#C8912F;
  --shadow:0 1px 2px rgba(20,24,29,.05),0 10px 28px rgba(20,24,29,.07);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111419;--surface:#191D24;--sunk:#222830;
  --ink:#ECEEF1;--slate:#A2AAB6;--faint:#79828E;--rule:#2B323B;
  --brass:#D9AC5E;--brass-bg:#382E1B;
  --good:#8FC07E;--good-bg:#253320;--better:#79B4E0;--better-bg:#1B2E3D;
  --best:#E39A62;--best-bg:#3A2616;--flag:#E58079;--flag-bg:#3B1E1C;--gold:#E2B75C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --paper:#111419;--surface:#191D24;--sunk:#222830;
  --ink:#ECEEF1;--slate:#A2AAB6;--faint:#79828E;--rule:#2B323B;
  --brass:#D9AC5E;--brass-bg:#382E1B;
  --good:#8FC07E;--good-bg:#253320;--better:#79B4E0;--better-bg:#1B2E3D;
  --best:#E39A62;--best-bg:#3A2616;--flag:#E58079;--flag-bg:#3B1E1C;--gold:#E2B75C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 72px}

/* ===== HUD ===== */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.hud-in{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px}
.hud-top{display:flex;align-items:center;gap:10px}
.rank{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.lvl{font-family:var(--mono);font-size:10.5px;background:var(--ink);color:var(--paper);border-radius:4px;padding:2px 6px;font-weight:600}
.xp{font-family:var(--mono);font-size:12.5px;color:var(--slate);font-variant-numeric:tabular-nums}
.xp b{font-family:var(--display);font-size:15px;color:var(--brass);font-weight:800}
.streak{font-family:var(--mono);font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;transition:transform .18s ease,color .18s ease}
.streak.hot{color:var(--best);font-weight:600}
.streak.pop{transform:scale(1.35)}
.icon-btn{font:inherit;font-size:14px;line-height:1;border:1px solid var(--rule);background:var(--surface);color:var(--slate);border-radius:6px;padding:5px 8px;cursor:pointer}
.icon-btn:hover{border-color:var(--brass);color:var(--brass)}
.xpbar{height:4px;background:var(--sunk);border-radius:99px;margin-top:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--gold));width:0;transition:width .45s cubic-bezier(.2,.8,.3,1)}

/* ===== chapter rail ===== */
.rail{display:flex;gap:5px;padding-block:12px 0;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--display);font-weight:600;font-size:12px;border:1px solid var(--rule);background:var(--surface);color:var(--faint);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.chip.done .dot{background:var(--good)}
.chip[aria-current="true"] .dot{background:var(--gold)}
.cprog{font-family:var(--mono);font-size:11.5px;color:var(--faint);padding-block:9px 0;display:flex;gap:10px;align-items:center}
.cprog .fillbar{flex:1;height:3px;background:var(--sunk);border-radius:99px;overflow:hidden}
.cprog .fillbar i{display:block;height:100%;background:var(--brass);width:0;transition:width .35s ease}

/* ===== card ===== */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-top:16px;position:relative;overflow:hidden}
.card.flash-ok{animation:flashok .5s ease}
.card.flash-no{animation:flashno .45s ease}
@keyframes flashok{0%{box-shadow:0 0 0 0 rgba(71,114,58,.5),var(--shadow)}100%{box-shadow:0 0 0 14px rgba(71,114,58,0),var(--shadow)}}
@keyframes flashno{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:inline-block;padding:3px 8px;border-radius:5px;margin-bottom:14px}
.k-learn{background:var(--better-bg);color:var(--better)}
.k-quiz{background:var(--brass-bg);color:var(--brass)}
.k-boss{background:var(--best-bg);color:var(--best)}
.bignum{font-family:var(--display);font-weight:900;font-size:clamp(46px,13vw,76px);line-height:.92;letter-spacing:-.04em;color:var(--brass);font-variant-numeric:tabular-nums;margin:2px 0 6px}
.bigsub{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3;letter-spacing:-.01em;text-wrap:balance;margin:0 0 10px}
.ctx{color:var(--slate);font-size:14.5px;margin:0}
.q{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.32;letter-spacing:-.015em;text-wrap:balance;margin:0}
.q em{font-style:normal;color:var(--brass)}
.say{background:var(--brass-bg);border-left:3px solid var(--brass);border-radius:0 10px 10px 0;padding:13px 15px;margin-top:14px}
.say .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-bottom:5px}
.say p{margin:0;font-size:14.5px}

/* ===== options ===== */
.opts{display:grid;gap:8px;margin-top:18px}
.opt{font:inherit;text-align:left;background:var(--sunk);border:1.5px solid transparent;color:var(--ink);border-radius:10px;padding:13px 15px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:border-color .12s,background .12s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--faint);transform:translateX(2px)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--faint);flex:0 0 auto;padding-top:1px;font-weight:600}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .k{color:var(--good)}
.opt.wrong{background:var(--flag-bg);border-color:var(--flag)}
.opt.dim{opacity:.4}
.opt[disabled]{cursor:default}

.res{margin-top:18px;border-top:1px solid var(--rule);padding-top:16px}
.verdict{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.015em;margin:0 0 7px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--flag)}
.why{margin:0;font-size:14.5px;color:var(--slate)}
.why strong{color:var(--ink);font-weight:600}

.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:600;font-family:var(--display);border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:9px;padding:11px 18px;cursor:pointer}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass);opacity:1}

/* ===== floating xp ===== */
.float{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--display);font-weight:900;font-size:40px;color:var(--gold);pointer-events:none;z-index:60;text-shadow:0 2px 14px rgba(200,145,47,.4)}
@keyframes rise{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.8)}18%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.12)}100%{opacity:0;transform:translateX(-50%) translateY(-70px) scale(1)}}
.float.go{animation:rise 1s ease forwards}

/* ===== toast ===== */
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--paper);border-radius:11px;padding:11px 16px;box-shadow:0 8px 30px rgba(0,0,0,.28);display:flex;gap:10px;align-items:center;max-width:420px}
.toast .tt{font-family:var(--display);font-weight:800;font-size:14px}
.toast .ts{font-size:13px;opacity:.82}
.toast .em{font-size:20px}
@keyframes toastin{0%{opacity:0;transform:translateY(14px) scale(.95)}100%{opacity:1;transform:none}}
.toast{animation:toastin .3s cubic-bezier(.2,.9,.3,1)}

/* ===== confetti ===== */
.conf{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
.conf i{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0}
@keyframes fall{0%{opacity:1;transform:translateY(-20px) rotate(0)}100%{opacity:0;transform:translateY(90vh) rotate(680deg)}}

/* ===== chapter done ===== */
.done-card{text-align:center;padding:34px 24px}
.done-card .big{font-family:var(--display);font-weight:900;font-size:clamp(30px,8vw,44px);letter-spacing:-.03em;margin:0 0 6px;color:var(--good)}
.done-card p{color:var(--slate);margin:0 auto;max-width:44ch}
.scorerow{display:flex;justify-content:center;gap:26px;margin:20px 0 4px;flex-wrap:wrap}
.scorerow div{text-align:center}
.scorerow b{display:block;font-family:var(--display);font-weight:900;font-size:26px;color:var(--brass);font-variant-numeric:tabular-nums}
.scorerow span{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}

.foot{margin-top:24px;font-size:12.5px;color:var(--faint);text-align:center}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== operator bar (shown on operator chapters) ===== */
.opbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;background:var(--sunk);border:1px solid var(--rule);border-radius:11px;padding:9px 12px}
.opbar.on{display:flex}
.opbar .onm{font-family:var(--display);font-weight:800;font-size:13.5px;letter-spacing:-.01em}
.opbar .ometa{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.opbar .ogo{margin-left:auto}
.minibtn{font:inherit;font-family:var(--display);font-weight:600;font-size:11.5px;border:1px solid var(--rule);background:var(--surface);color:var(--brass);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.minibtn:hover{border-color:var(--brass)}
.chip .optag{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;background:var(--brass-bg);color:var(--brass);border-radius:3px;padding:1px 4px}
.chip[aria-current="true"] .optag{background:var(--gold);color:var(--ink)}

/* ===== source panel ===== */
.srcwrap{margin-top:16px;border-top:1px dashed var(--rule);padding-top:13px}
.srchdr{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.srcbox{border:1px solid var(--rule);border-radius:10px;background:var(--sunk);margin-bottom:7px;overflow:hidden}
.srcbox>summary{cursor:pointer;list-style:none;padding:9px 12px;display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink)}
.srcbox>summary::-webkit-details-marker{display:none}
.srcbox>summary:hover{background:var(--brass-bg)}
.srcbox>summary .who{flex:1;font-weight:600;line-height:1.35}
.srcbox>summary .car{font-family:var(--mono);font-size:11px;color:var(--faint)}
.srcbox[open]>summary .car{transform:rotate(90deg)}
.srcbox .inner{padding:2px 12px 13px;font-size:13.5px;color:var(--slate)}
.srcbox .inner p{margin:0 0 9px}
.gr{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;border-radius:4px;padding:2px 5px;flex:0 0 auto;font-weight:600;margin-top:1px}
.gr-OP{background:var(--good-bg);color:var(--good)}
.gr-INT{background:var(--better-bg);color:var(--better)}
.gr-AGG{background:var(--brass-bg);color:var(--brass)}
.gr-CALL{background:var(--best-bg);color:var(--best)}
.srcq{border-left:3px solid var(--rule);padding:2px 0 2px 11px;margin:0 0 9px;font-size:13.5px;color:var(--ink);font-style:italic}
.srcnote{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:0 0 9px}
.srclinks{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.srclinks a{font-size:12.5px;color:var(--brass);text-decoration:none;border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:7px 10px;display:flex;gap:7px;align-items:center}
.srclinks a:hover{border-color:var(--brass);text-decoration:underline}
.srclinks .ic{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--faint);flex:0 0 auto}
.nolink{font-family:var(--mono);font-size:11.5px;color:var(--flag);background:var(--flag-bg);border-radius:6px;padding:6px 9px;margin:0}

/* ===== dossier mode ===== */
.dhdr{margin-top:18px}
.dhdr h2{font-family:var(--display);font-weight:900;font-size:clamp(24px,6.5vw,34px);letter-spacing:-.03em;margin:0 0 4px}
.dhdr p{color:var(--slate);margin:0;font-size:14.5px}
.dlist{display:grid;gap:10px;margin-top:16px}
.dcard{text-align:left;font:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:15px 17px;cursor:pointer;box-shadow:var(--shadow);display:block;width:100%}
.dcard:hover{border-color:var(--brass)}
.dcard .dn{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.015em;margin:0 0 2px}
.dcard .dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass);margin:0 0 7px}
.dcard .dl{color:var(--slate);font-size:13.5px;margin:0 0 9px}
.dcard .dm{font-family:var(--mono);font-size:11.5px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}
.frow{border-top:1px solid var(--rule);padding:12px 0}
.frow:first-of-type{border-top:0}
.fname{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:-.01em;margin:0 0 2px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fv{font-family:var(--mono);font-size:11px;color:var(--slate);font-weight:400;letter-spacing:0}
.fv.zero{color:var(--flag)}
.phr{margin:7px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.phr li{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13px}
.phr .pc{font-family:var(--mono);font-size:10.5px;color:var(--brass);font-weight:600;margin-right:6px}
.phr .ps{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.5}
.sites{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.sites li{display:flex;gap:9px;font-size:13px;border-bottom:1px solid var(--rule);padding-bottom:4px;flex-wrap:wrap}
.sites .sn{font-weight:600;flex:1 1 180px}
.sites .sl{font-family:var(--mono);font-size:11px;color:var(--faint)}
.sites .su{font-family:var(--mono);font-size:11px;color:var(--brass);flex:0 0 auto}
.sechdr{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:20px 0 4px}
</style>

/* ============ AUDIO (synthesized, no files) ============ */
var AC=null, SOUND=true;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==="suspended"){AC.resume();} return AC; }
function tone(freq,start,dur,vol,type){
  var c=ac(); if(!c||!SOUND) return;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,c.currentTime+start);
  g.gain.setValueAtTime(0.0001,c.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol,c.currentTime+start+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+start+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+0.02);
}
var SFX={
  tick:function(){tone(660,0,.08,.05,"triangle");},
  learn:function(){tone(523,0,.1,.06,"triangle");tone(784,.07,.14,.05,"triangle");},

  level:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.07,.35,.075,"triangle");});},

};

/* ============ SOURCES ============
   Every card points at one or more of these. Four grades:
     OP   = the operator's own published words, exact-phrase verified
     INT  = an internal source document, as reported to us
     AGG  = our own arithmetic over an internal source
     CALL = the 17 September call, by speaker and timestamp
   A link with u: goes to the page itself. A link with q: runs the exact-phrase
   search that confirms the quote, which is the check we actually ran. Where no
   public page was captured, the panel says so rather than guessing a URL. */

/* ---- verified operator language, with the check that confirmed it ---- */
asc_sentence:{g:"OP",who:"American Senior Communities — its own marketing, verbatim at all five Garden Home properties",
  basis:"Verified by exact-phrase probe.",
  quote:"Garden Home residents enjoy the company of their neighbors and opportunities to participate in a wide range of planned social activities, scheduled transportation to shopping, restaurants and appointments.",
  how:"One corporate sentence replicated five times, so it is one promise rather than five data points. Note what it does not say: no medical-first framing, and no worship, banking, pharmacy, dialysis, errands or airport anywhere in the portfolio.",
  links:[{t:"Exact-phrase check — the corporate sentence",q:"\"scheduled transportation to shopping, restaurants and appointments\""}]},
asc_review:{g:"OP",who:"Coventry Meadows — resident review on caring.com",
  basis:"The only concrete operational fact in the entire transportation research, and it came from a resident, not from marketing.",
  quote:"shuttle buses that take you for no charge to doctor's appointments and even have occasional community activities that they take people to.",
  how:"Vehicle: shuttle bus. Cost: no charge. Primary purpose: doctor appointments. Social outings characterised as occasional. Resident reviews turned out to be far more grounded than directory prose.",
  links:[{t:"Exact-phrase check — the review text",q:"\"shuttle buses that take you for no charge to doctor's appointments\""}]},
cardon_cottage:{g:"OP",who:"CarDon — its own inclusion language, naming the cottage product",
  basis:"Contractual register rather than marketing register, and it names the product explicitly.",
  quote:"Included with a selected apartment or cottage is all interior, exterior and grounds maintenance, plus housekeeping and scheduled transportation.",
  how:"This is the cleanest published statement anywhere in the research that a cottage resident specifically gets transportation. CarDon also customises copy per property, so a thin description at one of its communities is probably a real signal rather than lazy copywriting.",
  links:[{t:"Operator page — the one page a domain-restricted probe returned",u:"https://hamiltontrace.us/independent-living/residences/"},
         {t:"Exact-phrase check — the inclusion sentence",q:"\"Included with a selected apartment or cottage\""}]},
traditions_twotier:{g:"OP",who:"Traditions Management — identical corporate copy across four sites",
  basis:"The two-tier asymmetry, verified in the operator's own words on both sides.",
  quote:"Garden homes: “…utilities and full access to dining, amenities, social activities and events and transportation.”  Assisted living and memory care: “…scheduled transportation to medical appointments and outings.”",
  how:"Same operator, same benefit, two registers. The villa resident is given the noun; the higher-acuity resident is told what the service does. Whether that reflects a thinner benefit or lazier copy cannot be determined from published sources — say it as a competitive-intelligence gap, not as a finding about service levels.",
  links:[{t:"Exact-phrase check — the defined version",q:"Traditions \"scheduled transportation to medical appointments and outings\""},
         {t:"Exact-phrase check — the villa version",q:"Traditions garden homes \"dining, amenities, social activities and events\""}]},
traditions_hunter:{g:"OP",who:"Traditions at Hunter Station and Traditions at Beaumont — their own pages",
  basis:"The two exceptions to the operator's own pattern.",
  quote:"Hunter Station lists transportation as a discrete line item in the villa inclusion list: home maintenance, yard work, snow removal, trash, all utilities, transportation, activities, emergency pendant. Beaumont is the only property to extend the benefit to independent living residents by name, and the only one anywhere with a frequency hint: a community bus to appointments and to scheduled weekly activities.",
  how:"Two of seven break the pattern, which is worth knowing if you are asked whether the two-tier reading is universal. It is not.",
  links:[{t:"Exact-phrase check — Beaumont's IL wording",q:"\"Traditions at Beaumont\" transportation \"independent living\""}]},
np_faq:{g:"OP",who:"New Perspective Senior Living — operator FAQ (Woodland Terrace of Danville)",
  basis:"The strongest single data point in the whole transportation research, and the only explicit scope exclusion found anywhere. Returned near-identically across two independent queries.",
  quote:"New Perspective does not provide transportation to appointments; however, they do have a community van that is used to transport residents to events outside of the community. In addition, there may be commercial transportation options available for medical or other appointments, such as ride sharing programs, that they can assist in coordinating.",
  how:"Directory sites flatly contradict this, claiming transportation for doctor visits. Trust the operator FAQ. This is the citable proof that a directory transportation checkbox cannot be relied on. Woodland Terrace has 50 cottage-style townhomes, but the FAQ does not state cottage residents' entitlement specifically.",
  links:[{t:"Exact-phrase check — the exclusion",q:"\"does not provide transportation to appointments\" \"New Perspective\""}]},
tlc_absence:{g:"OP",who:"TLC Management — absence on its own sites",
  basis:"An absence finding, which the research treated as more reliable than a positive directory quote.",
  quote:"Transportation does not appear on TLC's amenities, independent living or living-options pages. Services are “included in the monthly rent”, and transportation is not among the enumerated inclusions. A third party describes them only as setting up rides for doctor visits — coordination, not provision.",
  how:"At Village of Avon, transportation appears on-site only as an admission criterion, meaning something the resident must manage independently. Log as unverified, never as included.",

zarrow:{g:"OP",who:"Zarrow Pointe — The Villas, published brochure",

garbry:{g:"OP",who:"Garbry Ridge (Piqua, OH) — its own cottage page",

  quote:"The cottage inclusion list carries scheduled group social outings as included, with personal shopping trips and special outings chargeable.",

cedarhurst:{g:"OP",who:"Cedarhurst — corporate cottage language, exact-verified",
  basis:"The paragraph we originally read half of. Reading the whole thing reversed our conclusion.",
  quote:"Cedarhurst Cottages operate separately from the Assisted Living and Memory Care neighborhoods… and the same paragraph then affirmatively grants cottage residents access to the services and options already available at the community's Assisted Living and Memory Care neighborhoods.",
  how:"The first half reads as an exclusion, the second half grants access. The same construction appears on the Topeka, Waterloo and Springfield cottage pages, so it is corporate boilerplate. Cedarhurst is parity, not a lesser tier, and no Cedarhurst page prices transportation for cottages.",
  links:[{t:"Exact-phrase check — the disclaimer",q:"\"Cedarhurst Cottages operate separately from the Assisted Living\""}]},
research_noprice:{g:"AGG",who:"Our two-round market research, roughly fifty communities in depth",
  basis:"Not one community published a rate for any paid service. The vocabulary is nominal, a small fee, for a fee, at cost, flat fee. Paid tiers are disclosed; their prices are withheld. Zero of eight in one operator set published a radius, a fee, hours or a lead time.",
  how:"Any price we set has to come from mystery shopping, not desk research. This is also the differentiation argument: publishing terms costs nothing to operate.",
  links:[]},
verify_method:{g:"AGG",who:"Our own verification programme, two rounds",
  basis:"Market claims were re-checked with exact-phrase probes and searches restricted to the operator's own domain. The programme overturned two of our conclusions and removed four fabricated details. Every market claim in the workbook now carries a status of verified, likely or falsified.",
  how:"The reliable discriminator is a search restricted to the operator's own domain. Directory sites publish fluent, specific, plausible prose that does not survive it — and the details a benchmarking study most wants are the least trustworthy things on those sites.",
  links:[]},
verify_cottage:{g:"AGG",who:"Round-two verification across seven detached-cottage communities",
  basis:"Zero confirmed cases of cottage residents getting a lesser transportation tier. One verified case of better, at Zarrow Pointe. Four cases of parity. We had previously concluded the opposite and reversed it.",
  how:"The reversal is disclosed in the workbook rather than quietly corrected. What actually varies between communities is whether the operator documents the terms at all.",
  links:[{t:"Operator page — the one verified better case",u:"https://zarrowpointe.org/living-options/the-villas/"}]},
radius:{g:"AGG",who:"Two internal sources plus third-party guidance",
  basis:"A ten-mile radius appears in two of our internal sources, and third-party guidance calls ten to fifteen miles a norm. No operator publishes a radius anywhere in the research.",
  how:"A five-mile radius claim with a weekly schedule that we had recorded was falsified by an operator-domain-restricted search and removed. Say common operating practice. Never say published or standard.",
  links:[]},
fabrications:{g:"AGG",who:"Four claims we removed, documented in the workbook",
  basis:"A detailed Hamilton Trace transportation line failed an exact-phrase probe with zero matching pages. A Beech Grove courtesy-transportation line was unverifiable. A five-mile radius with a weekly schedule was falsified. A directory quote named Northwestern Memorial Hospital-Evanston, which does not exist.",
  how:"All four came from directory sites, not operators, and all four were the kind of specific operational detail a benchmarking study most wants. That is the pattern to distrust.",
  links:[{t:"Exact-phrase check — returns nothing, which is the point",q:"\"dialysis, and outpatient therapy, as well as rides to local shopping, banking\""}]},

/* ---- the 17 September call ---- */
kevin_anchor:{g:"CALL",who:"Kevin Penn, culinary — 0:03",
  basis:"His anchor rule, stated at the top of the call and restated unchanged at the end.",
  quote:"You can purchase meals as a meal package or meals a la carte, but you have to come to the main building to eat them.",
  how:"Purchased, not included, and eaten on site. Quote it as the position rather than paraphrasing it.",links:[]},
kevin_delivery:{g:"CALL",who:"Kevin Penn, culinary — 11:42 (final position), with 4:56 and 12:08",
  basis:"He said earlier in the call that he would deliver at a cost, then reversed. Cite the later position.",
  quote:"In a community type where they don't have a large enough dining room, honestly, I don't want to offer anything. Delivery. Degrades the product… It's not pizza. (11:42)  Pick up is better. (12:08)  Degrade your product by at least 30%. (4:56)",
  how:"Do not cite the earlier 3:31 exchange where he said he would deliver — he moved off it. Delivery appears at one of the 215 communities anyway, so declining it costs nothing competitively.",links:[]},
kevin_ceiling:{g:"CALL",who:"Kevin Penn, culinary — 4:12 and 16:01",
  basis:"The most he offered on inclusion, and his request for a fourth state.",
  quote:"I guess you could include one meal a week or something like that… not every day of the week, and then hope for them to stagger that enough. (4:12)  You might have to add another category for culinary, which is worst, which means I can't do it. (16:01)",
  how:"The one-meal-a-week ceiling is a hypothetical he floated, not a commitment. The fourth state is a real request and it is still an open decision.",links:[]},
kevin_labor:{g:"CALL",who:"Kevin Penn, culinary — 2:13",
  basis:"How funding actually flows.",
  quote:"Census flows through per-resident-day funding, but labor is not calculated like that right now.",
  how:"Food gets funded by census. Labour does not, so any added service has to arrive with a staffing number attached.",links:[]},
justin_alc:{g:"CALL",who:"Justin Hollabaugh, settings — 14:26",
  basis:"His framing of housekeeping, in his own words.",
  quote:"We a la carte includes the packages.",
  how:"Housekeeping is purchased, and a package is one way of purchasing it. This is the gap against the market, where 87% of operators who mention housekeeping include it. Present it as an open decision, not a settled one.",links:[]},
justin_4cond:{g:"CALL",who:"Justin Hollabaugh, settings — 14:58 and 15:17",
  basis:"The four conditions, and the limit on how far he will generalise.",
  quote:"They have the right equipment, the right people… we determine what that's actually going to be and it's not a loss in revenue. (14:58)  We'd have to go community by community, because I can't universally say that. (15:17)",
  how:"All four conditions, on the record. He will not commit universally, which means any tier we publish has to be gated per community.",links:[]},
justin_flourish:{g:"CALL",who:"Justin Hollabaugh, settings — 6:27 and 7:13",
  basis:"The live example, and the strongest argument in the room.",
  quote:"Yeah, we are right now, but it's got to change. (7:13, on Flourish cottages getting routine housekeeping and laundry today)  A proper clean runs two to four hours. (6:27)",
  how:"A bundled cottage housekeeping model running today and being pulled back on cost. It is our own evidence, which makes it far stronger than anything from the market.",links:[]},
call_capacity:{g:"CALL",who:"Both leaders — Justin 15:17, Kevin 16:01, plus Justin 12:58 and 13:26 and Kevin 13:57 on staffing",
  basis:"The shared position that capability, not ambition, sets the tier.",
  quote:"The dining room either seats the extra covers or it does not; housekeeping either has the equipment and the people or it does not. Both raised staffing fragility on a spread-out site independently.",
  how:"A cottage neighbourhood adds staff travel time for housekeeping, maintenance and emergency response, and one dedicated person quitting is an immediate problem. That argues for raised ratios across existing staff rather than a single dedicated role.",links:[]},
call_rates:{g:"CALL",who:"Justin 8:36 and Curtis 15:07 — both hypothetical",
  basis:"The two numbers that came up, and why neither is a commitment.",
  quote:"25 cents a square foot — Justin, 8:36, prefaced with “we might say”. $40–50 an hour — Curtis's own illustration at 15:07. One FTE a day, or an extra eight hours a week — also Curtis, illustrative.",
  how:"No rate was agreed. Quoting either as a rate would be the easiest mistake to make and the hardest to walk back, and the market publishes nothing to anchor against.",links:[]},
maint_open:{g:"CALL",who:"Not confirmed — maintenance was never discussed as a separate service line",
  basis:"On the recorded portion of the call, maintenance came up only as part of settings. It was never agreed as a standalone cottage service line with its own scope or owner.",
  how:"Say it is our proposal, not his commitment. It needs to go back to Justin before it appears in anything an owner reads as agreed.",links:[]},

/* ---- our own recommendation ---- */
gbb:{g:"AGG",who:"Good-Better-Best tab — our recommendation, not a market observation",
  basis:"Thirty tier rows across the functions, each carrying the market evidence it was built from and a status where a leader has not signed up to it.",
  how:"This is our proposal. Where a tier depends on something a leader has not committed to, the workbook flags it OPEN rather than presenting it as settled.",links:[]},
gbb_menu:{g:"AGG",who:"Good-Better-Best tab, plus two internal sources that converged",
  basis:"Two of the four internal sources arrived at a Base-plus-Choice structure independently, and both paired it with a published à la carte menu billed monthly.",
  how:"At Better the menu is the product. Without a published menu, residents experience services as unavailable rather than optional — which is the same experience as not offering them.",links:[]}

 boss:{q:"If we wanted to be the most generous operator in the market, what would we have to match?",
  say:"Five Star, and specifically weekly housekeeping with flat linen service in the fee at every property, full maintenance of the home, building and grounds, and a twenty-four seven concierge at all five. That is the ceiling in this study. What is interesting is that they buy it selectively: they list no transportation and no life enrichment anywhere, and they only mention dining at two of the five. So the bundled end is not bundled across the board — they picked housekeeping and concierge and spent there.",
  ev:"Our aggregation over Laura's October 2023 inventory: 5 communities, 219 villas. No public URL captured — the flat-linen phrasing is distinctive enough to confirm in one search.",
  s:["fivestar_phr","lopez"]}},

{name:"ASC",op:"American Senior Communities",
 blurb:"Five Garden Home properties, 233 villas. The transportation operator, and the best-verified piece of language in the whole study.",
 items:[
 {n:"5 of 5",t:"list transportation — one sentence, replicated",s:["asc_sentence","lopez"],
  c:"ASC is the only operator here that lists transportation at every property, and its own marketing carries one sentence verbatim across all five: Garden Home residents enjoy the company of their neighbors and opportunities to participate in a wide range of planned social activities, scheduled transportation to shopping, restaurants and appointments.",
  q:"Which three trip purposes does ASC name, verbatim, at all five properties?",
  o:["Medical, dialysis and therapy","Shopping, restaurants and appointments","Worship, banking and pharmacy","Airport, rail and personal errands"],a:1,
  w:"One corporate sentence replicated five times, so it is one promise and not five data points. Note it leads with shopping, not medical.",
  say:"American Senior Communities promises transportation at every Garden Home property in one identical sentence, and it is shopping, restaurants and appointments."},
 {n:"No charge",t:"and it came from a resident, not from marketing",s:["asc_review"],
  c:"The only concrete operational fact in the entire transportation research is a Coventry Meadows resident review: shuttle buses that take you for no charge to doctor's appointments and even have occasional community activities that they take people to. Vehicle, cost, purpose and frequency, all in one sentence a resident wrote.",
  q:"Where did the one concrete operational fact about ASC transportation come from?",
  o:["Their corporate website","A resident review","A state filing","A brochure"],a:1,
  w:"A resident review on a directory site. Note the word occasional about social outings — marketing never says that.",
  say:"The only hard detail anyone published about their shuttle came from a resident: a bus, no charge, mainly doctor appointments, with outings described as occasional."},
 {n:"Almost nothing",t:"else appears in the ASC portfolio",s:["lopez","verify_method"],
  c:"Housekeeping appears at one of the five. Maintenance at three. Dining, life enrichment and wellness are not listed at any of them. ASC leads with transportation and says very little else about the Garden Home product.",
  q:"Apart from transportation, what does ASC list broadly across its Garden Homes?",
  o:["Housekeeping","Dining","Very little — maintenance at three, housekeeping at one","Wellness"],a:2,
  w:"One function covered at all five, and thin coverage everywhere else. They are the mirror image of Five Star.",
  say:"Transportation at all five, and then almost nothing. Housekeeping at one, maintenance at three, and no dining, enrichment or wellness anywhere."},
 {n:"Careful",t:"two ASC transportation details were fabrications",s:["fabrications","verify_method"],
  c:"A detailed line about dialysis and outpatient therapy at a CarDon community, and a courtesy-transportation line at Beech Grove, both failed exact-phrase probes. They came from directory sites, not from ASC. Both were removed from our workbook.",
  q:"What happened to the most detailed transportation claims we found?",
  o:["They were confirmed","They failed exact-phrase probes and were removed","They were priced","They were from the operator"],a:1,
  w:"The specific operational detail a benchmarking study most wants is the least trustworthy thing on a directory site.",
  say:"The most detailed claims we found turned out to be invented by directory sites, and we took them out."}],
 boss:{q:"Somebody says transportation is table stakes. Is it?",
  say:"No, it is the most polarised service in the market. American Senior Communities lists it at all five of their Garden Home properties in one identical corporate sentence — shopping, restaurants and appointments — and it is the only function they really cover. Meanwhile Trilogy lists none at eight communities, Five Star none at five, Arrow none at seven. That is twenty communities with no transportation at all against one operator who built their pitch around it. So it is a strategic choice, not a box to tick.",
  ev:"ASC sentence exact-phrase verified. Absences from our aggregation: Trilogy 0/8, Five Star 0/5, Arrow 0/7.",
  s:["asc_sentence","trilogy_phr","fivestar_phr","arrow_phr"]}},

{name:"Arrow / Vitalia",op:"Arrow Senior Living",
 blurb:"Seven Ohio communities, 197 villas. The thinnest service profile of any multi-site operator here — and consistent about it.",
 items:[
 {n:"0 of 7",t:"transportation, housekeeping and dining",s:["arrow_phr","verify_method"],
  c:"Across all seven Vitalia communities the inventory records no transportation, no housekeeping and no dining for villa residents. Three functions, seven communities, nothing listed.",
  q:"What does Arrow's Vitalia portfolio list for transportation, housekeeping and dining?",
  o:["All three at every community","Nothing, at any of the seven","Housekeeping only","Dining only"],a:1,
  w:"Zero of seven on all three. An absence this consistent across seven differently-named communities is a portfolio position.",
  say:"Vitalia lists no transportation, no housekeeping and no dining at any of their seven communities."},
 {n:"Campus amenities",t:"are the whole Vitalia offer",s:["arrow_phr"],
  c:"Four of the seven list campus amenities, and that phrase is where the wellness centre, library and demonstration kitchen sit. Two of them add an indoor pool, bistro, movie theatre and billiards. Arrow sells the building and the amenity set.",
  q:"What is Vitalia's actual offer to a villa resident?",
  o:["A bundled service package","Access to campus amenities","Daily meals","Weekly housekeeping"],a:1,
  w:"Amenities, not services. Their wellness offer is the wellness centre itself, counted through the same amenity line.",
  say:"Vitalia is amenity-led. What a villa resident buys is access to the campus — the wellness centre, the pool, the theatre — not a service package."},
 {n:"3 of 7",t:"maintenance, which is the only service they name",s:["arrow_phr"],
  c:"Interior and exterior maintenance at three of the seven, and even that is not portfolio-wide. It is the only recognisable service line anywhere in the Vitalia portfolio.",
  q:"What is the only service line Arrow names at all?",
  o:["Transportation","Interior and exterior maintenance","Housekeeping","Meal plans"],a:1,
  w:"Three of seven. Even the universal function of the study is only partly present here.",
  say:"Maintenance at three of the seven is the only service they name anywhere in the portfolio."},
 {n:"The honest read",t:"is that we cannot tell bare from unpublished",s:["arrow_phr","verify_method"],
  c:"A portfolio-wide absence in listing research means the service was not listed. It does not prove the service does not exist. With Arrow the absence is so consistent that it reads as a real position, but the distinction is worth making out loud before an owner makes it for you.",
  q:"What does an absence in the inventory actually prove?",
  o:["The service is not offered","That it was not listed, which is not the same thing","Nothing at all","That the community is small"],a:1,
  w:"Absence findings are more reliable than positive directory quotes, but they are still absence of evidence. Say it that way.",
  say:"They list nothing, which is not quite the same as offering nothing. With seven communities all silent, though, it reads as a position."}],
 boss:{q:"Is there an operator that just does not offer services? What does that tell us?",
  say:"Arrow's Vitalia portfolio, seven Ohio communities and 197 villas, and across all seven the inventory records no transportation, no housekeeping and no dining. What they sell is campus amenities — the wellness centre, library, demonstration kitchen, and at two of them a pool, bistro and theatre — plus interior and exterior maintenance at three. So there is a viable amenity-led model at one end of this market. I would be careful with it, though: what we know is that they do not list these services, which is not proof they do not provide them.",
  ev:"Our aggregation over Laura's October 2023 inventory: 7 communities, 197 villas. No public URL captured.",
  s:["arrow_phr","verify_method"]}},

{name:"Life Care Services",op:"Life Care Services",
 blurb:"Nine communities, 462 villas — the largest footprint in the study, and the least published about it.",
 items:[
 {n:"462",t:"villas across nine communities, the biggest footprint here",s:["lcs_phr","lopez"],
  c:"Life Care Services manages more villa units in this study than any other operator: Green Hills at 82, Greenwood Village South at 78, Rose Senior Living Avon at 76, The Heritage at Brentwood at 65, and five more. Scale did not produce detail.",
  q:"Which operator has the largest villa footprint in the study?",
  o:["Trilogy","Life Care Services","Five Star","Traditions"],a:1,
  w:"Nine communities and 462 units. Trilogy and Traditions are next at 258 each.",
  say:"Life Care Services has the biggest villa footprint in the study, nine communities and over four hundred and sixty units."},
 {n:"4 of 9",t:"say Transportation and nothing else",s:["lcs_phr","agg_trans"],
  c:"Four of the nine list transportation, and all four entries are the bare word. That is the market-wide pattern in miniature: all 55 transportation entries across the whole inventory are the word on its own, with no radius, days, hours or price.",
  q:"How does Life Care Services describe transportation?",
  o:["With a published radius and schedule","As the bare word, with no detail","As a paid add-on","It does not appear at all"],a:1,
  w:"Four of nine, bare word. The largest operator in the study publishes the least about what it actually provides.",
  say:"Four of their nine list transportation, and every one is just the word. No radius, no schedule, no price."},
 {n:"$540",t:"in monthly meal credits, at one community",s:["lcs_phr"],
  c:"Friendship Village of Dublin runs $540 a month in meal credits, the single most specific dining figure in the whole inventory. Dining appears at exactly one of the nine Life Care Services communities.",
  q:"What is the most specific dining number in the entire inventory?",
  o:["Three meals a day","$540 in monthly meal credits","30 meals a month","$100 a month"],a:1,
  w:"$540 monthly credits at Friendship Village of Dublin. A credit is a purchase with a subsidy, not a giveaway — which is exactly the framing our culinary leader is comfortable with.",
  say:"One of their communities runs five hundred and forty dollars a month in meal credits, which is the most specific dining number anywhere in our research."},
 {n:"3 of 9",t:"housekeeping, bi-weekly every time",s:["lcs_phr"],
  c:"Bi-weekly at all three that list it, and two of those pair it with linen service — weekly linen at Friendship Village of Dublin, bi-weekly linen at Newcastle Place. Where they bundle, they bundle lightly.",
  q:"What cadence does Life Care Services use where it lists housekeeping?",
  o:["Weekly","Bi-weekly","Monthly","Daily"],a:1,
  w:"Bi-weekly at three of three. Same pattern as Trilogy and Life Enriching: one cadence, applied portfolio-wide.",
  say:"Where they list housekeeping it is bi-weekly every time, sometimes with linen service alongside."},
 {n:"Via the campus",t:"is how enrichment and wellness reach villa residents",s:["lcs_phr","agg_le"],
  c:"Life enrichment and wellness appear at two of the nine, and both times as main-campus amenities: pool, gym with a trainer, chaplain, café, general store at Kalamazoo; putting green, bocce, woodworking, art studio, greenhouse, market and medical clinic at Brentwood. Villa residents get campus access, not villa services.",
  q:"How do villa residents get enrichment and wellness at Life Care Services?",
  o:["Dedicated villa programming","Through main-campus amenity access","Not at all","At extra cost"],a:1,
  w:"Campus access on the same basis as apartment residents — which is how 96% of life enrichment works across the whole inventory.",
  say:"Enrichment and wellness reach their villa residents through main-campus access, not as separate villa services."}],
 boss:{q:"Who is the biggest player here, and what can we learn from them?",
  say:"Life Care Services — nine communities and 462 villas, the largest footprint in the study. What is striking is how little they publish. Four of the nine list transportation and every one is the bare word. Three list housekeeping, bi-weekly each time. Dining appears at exactly one community, as five hundred and forty dollars a month in meal credits. So the biggest operator in the market has not solved this and has not documented it either, which is the gap we can step into: publish the terms.",
  ev:"Our aggregation over Laura's October 2023 inventory: 9 communities, 462 villas. No public URL captured for the portfolio.",
  s:["lcs_phr","lopez","research_noprice"]}},

{name:"Traditions",op:"Traditions Management",
 blurb:"Seven communities, 258 villas. The cleanest example of two-tier language in the market — and we verified both halves of it.",
 items:[
 {n:"Two tiers",t:"of language for the same benefit",s:["traditions_twotier"],
  c:"On their garden-home pages, transportation appears inside a list: utilities and full access to dining, amenities, social activities and events and transportation. On their assisted living and memory care pages, the same operator writes scheduled transportation to medical appointments and outings. The villa resident gets the noun. The higher-acuity resident gets the definition.",
  q:"What does Traditions do differently for villa residents versus assisted living?",
  o:["Charges them more","Describes the same benefit but only defines it for higher acuity","Excludes them from transport","Uses a different vehicle"],a:1,
  w:"Identical corporate copy across four sites, verified on both sides. Whether that is a thinner benefit or lazier copy cannot be determined from published sources — call it an intelligence gap.",
  say:"Traditions only defines transportation for their higher-acuity tiers. Villa residents get the word on its own."},
 {n:"30 meals",t:"a month, at two communities",s:["lopez","traditions_hunter"],
  c:"Traditions at Solana and Traditions at Reagan Park both publish 30 meals a month. That is a countable allotment rather than a plan or a credit, and it is the only operator in the study using that construction.",
  q:"How does Traditions express its dining benefit?",
  o:["Three meals a day","30 meals a month","A dollar credit","Unlimited dining"],a:1,
  w:"A count, not a plan and not a credit. Beaumont is the third dining mention and it is meal plans available, which is sold.",
  say:"Two of their communities publish thirty meals a month, which is a countable allotment rather than a meal plan."},
 {n:"2 of 7",t:"exceptions that break their own pattern",s:["traditions_hunter"],
  c:"Hunter Station lists transportation as a discrete line item in the villa inclusion list, alongside home maintenance, yard work, snow removal, trash, utilities, activities and an emergency pendant. Beaumont is the only property anywhere to extend the benefit to independent living residents by name, and the only one with a frequency hint: a community bus to appointments and to scheduled weekly activities.",
  q:"What do Hunter Station and Beaumont show?",
  o:["That the two-tier reading is universal","That two of seven break the operator's own pattern","That transportation is always sold","That villas get less"],a:1,
  w:"Useful if you are asked whether the two-tier reading is a rule. It is not — two of seven are more generous than the corporate template.",
  say:"Two of their seven break the pattern. Hunter Station itemises transportation for villas and Beaumont names independent living residents explicitly."},
 {n:"5 of 7",t:"maintenance, and housekeeping hiding inside it",s:["lopez"],
  c:"Maintenance is in the fee at five of the seven. At Solana and Reagan Park the line reads interior/exterior maintenance/housekeeping — one line covering both functions, which is why housekeeping only counts at two of seven here.",
  q:"Why does housekeeping only appear at two Traditions communities?",
  o:["They do not clean","It is bundled inside a combined maintenance and housekeeping line","It is sold separately","The data is missing"],a:1,
  w:"A combined line. This is the thing to watch in any benchmark: one phrase can carry two functions and distort both counts.",
  say:"Their housekeeping is folded into a combined maintenance and housekeeping line, which is why the count looks low."},
 {n:"Boilerplate",t:"is the risk with this operator",s:["fabrications","verify_method"],
  c:"An exact-phrase probe on scheduled shuttles to physician offices, dialysis or therapy sessions returned zero senior living communities, yet near-identical constructions were attributed to three different Traditions properties by directory sites. Same skeleton, swapped nouns, no primary source.",
  q:"What did the probe on directory language about Traditions prove?",
  o:["The claims were accurate","Directory sites reused one invented skeleton across three properties","Traditions had changed its copy","Nothing conclusive"],a:1,
  w:"Never admit a dialysis, service radius or scheduled-in-advance claim on directory authority alone. Resident reviews are far more grounded than directory prose.",
  say:"Directory sites attributed the same invented sentence to three different Traditions properties. That is why we verify by exact phrase."}],
 boss:{q:"Does anybody give cottage residents a lesser service than apartment residents?",
  say:"Not in service terms — in language terms, yes, and Traditions is the clean example. Their garden-home pages list transportation as a bare word inside a list of inclusions. The same operator's assisted living and memory care pages define it: scheduled transportation to medical appointments and outings. Same benefit, two registers. But two of their seven actually break that pattern in the villa resident's favour, and when we verified the broader question across seven detached-cottage communities we found zero confirmed cases of a lesser tier, one better and four at parity. So what varies is documentation, not entitlement.",
  ev:"Traditions two-tier copy verified on both sides. Cottage-tier verification: 0 lesser, 1 better, 4 parity.",
  s:["traditions_twotier","verify_cottage"]}},

{name:"Life Enriching",op:"Life Enriching Communities",
 blurb:"Five Ohio communities, 315 villas. The allowance playbook, and the most uniform maintenance language of anyone here.",
 items:[
 {n:"Allowance",t:"is their word for dining, and it matters",s:["lec_phr"],
  c:"Flexible meal allowance, used at Twin Lakes, Twin Towers and Wesley Glen. Wesley Woods is the exception with a daily continental breakfast. An allowance is a credit toward a purchase, not a giveaway — which is exactly the framing our culinary leader is comfortable with.",
  q:"How does Life Enriching Communities express its dining benefit?",
  o:["Three meals a day","A flexible meal allowance","30 meals a month","No dining at all"],a:1,
  w:"A credit model. Presbyterian Homes runs $490 in meals and Life Care Services $540 in monthly credits — the sophisticated operators all converge on credits.",
  say:"Life Enriching uses a flexible meal allowance rather than a meal count. It is a credit, which means it is still a purchase."},
 {n:"5 of 5",t:"housekeeping in the fee, but deliberately light",s:["lec_phr"],
  c:"Bi-weekly at Wesley Woods, Wesley Glen and Wesley Ridge; light monthly at Twin Lakes and Twin Towers. Every community bundles it, and every community keeps it small. Bundled does not have to mean generous.",
  q:"How does Life Enriching bundle housekeeping?",
  o:["Weekly, at every community","At all five, but bi-weekly or light monthly","Only at Twin Lakes","It is sold separately"],a:1,
  w:"Five of five in the fee, and the cadence is the lever. Light monthly at their two largest communities is the cheapest possible version of included.",
  say:"They include housekeeping at all five but keep it light — bi-weekly at three and light monthly at their two biggest."},
 {n:"5 of 5",t:"interior and exterior maintenance, identical wording",s:["lec_phr"],
  c:"The same phrase at all five communities. It is the most uniform maintenance language of any operator in the study, which tells you it is set centrally and applied without variation.",
  q:"What does the identical maintenance wording at all five tell you?",
  o:["It was copied by mistake","It is a corporate standard applied portfolio-wide","Each site wrote its own","Maintenance is outsourced"],a:1,
  w:"Corporate standard. Cadence and scope are set once and applied everywhere — the same pattern as housekeeping cadence.",
  say:"All five use identical maintenance wording, which tells you it is set once at the corporate level."},
 {n:"Yearly",t:"wellness allowance, at Twin Lakes",s:["lec_phr","agg_well"],
  c:"A yearly allowance for health and wellness services. It is one of the only wellness constructions in the study that is neither a gym nor a pool, and across the whole inventory only five communities offer anything clinical at all.",
  q:"What is unusual about Twin Lakes' wellness offer?",
  o:["An on-site hospital","A yearly allowance for health and wellness services","Free medication management","A resident physician"],a:1,
  w:"They apply the allowance model to wellness too. Wellness is wide-open ground: only five of 215 communities offer anything clinical.",
  say:"They run a yearly allowance for wellness services as well as dining. The allowance is their whole playbook."},
 {n:"2 of 5",t:"transportation, and only at the two largest",s:["lec_phr"],
  c:"Twin Lakes and Twin Towers, their two big Cincinnati campuses at 143 and 130 villas. The three smaller communities list none. Scale appears to buy the shuttle.",
  q:"Which Life Enriching communities list transportation?",
  o:["All five","Only the two largest campuses","Only the smallest","None"],a:1,
  w:"Twin Lakes and Twin Towers only. Worth noting when we size our own transportation decision against a community's unit count.",
  say:"Only their two largest campuses list transportation. At that scale a shuttle pays for itself and below it apparently does not."}],
 boss:{q:"Is there a way to include services without carrying the full cost?",
  say:"Yes, and Life Enriching Communities is the model. Two moves. First, cadence: they include housekeeping at all five communities but run it bi-weekly at three and light monthly at their two biggest, so it is genuinely in the fee and genuinely cheap. Second, allowances: a flexible meal allowance for dining and a yearly allowance for wellness. An allowance is a credit toward a purchase, so the resident feels included and we are not giving away covers. Those two levers let you say included without underwriting unlimited consumption.",
  ev:"Our aggregation over Laura's October 2023 inventory: 5 communities, 315 villas. Allowance phrasing is the operator's own vocabulary as recorded.",
  s:["lec_phr","kevin_ceiling"]}},

{name:"Capri",op:"Capri Communities",
 blurb:"Four Wisconsin communities, 71 villas. The control case: an operator that publishes essentially nothing.",
 items:[
 {n:"$100",t:"a month in dining, and that is the entire portfolio",s:["lopez"],
  c:"Across four Wisconsin communities the inventory records one service data point: a $100 dining allowance per month at Grace Commons. No transportation, no housekeeping, no maintenance, no enrichment, no wellness anywhere in the portfolio.",
  q:"What is the only service Capri publishes across four communities?",
  o:["Weekly housekeeping","A $100 monthly dining allowance at one community","Transportation","Maintenance"],a:1,
  w:"One data point in four communities. Even maintenance, the universal function of this study, does not appear.",
  say:"Capri publishes one service across four communities: a hundred dollars a month in dining at one of them."},
 {n:"Bare or unpublished",t:"and the inventory cannot tell you which",s:["lopez","verify_method"],
  c:"Either the product really is that bare, or it is an operator that does not publish. Listing research cannot separate the two. Saying that out loud is more credible than guessing, and it is the honest floor of the market.",
  q:"What can we conclude from Capri's silence?",
  o:["They offer nothing","Either a bare product or a non-publishing operator — we cannot tell","They are the cheapest","They are the most expensive"],a:1,
  w:"Say the limit of the evidence. It is the difference between sounding rigorous and sounding confident.",
  say:"Either the product is bare or they do not publish it, and we cannot tell which from outside. That is the honest answer."},
 {n:"71",t:"villas, the smallest footprint of the eight",s:["lopez"],
  c:"Sixteen to twenty-two villas per community. The operators with the thinnest service lists in this study also tend to be the ones with the smallest villa clusters, which fits what both of our own leaders said about staffing a spread-out site.",
  q:"What does Capri's small footprint suggest about service economics?",
  o:["Small clusters make a service package harder to staff","Smaller is always cheaper to serve","Size is irrelevant","Small sites bundle more"],a:0,
  w:"Sixteen to twenty-two units per site. Our own leaders raised exactly this: a scattered handful of cottages carries staff travel time with no density to absorb it.",
  say:"Their villa clusters are sixteen to twenty-two units. At that size a service package is hard to staff, which is the same constraint our own leaders raised."}],
 boss:{q:"What does the bottom of this market look like?",
  say:"Capri Communities, four Wisconsin properties, seventy-one villas between them, and one published service in the whole portfolio: a hundred dollars a month in dining at Grace Commons. Not even maintenance, which everyone else in the study includes. I would be careful how I say it, though — either the product is genuinely that bare or they simply do not publish, and listing research cannot tell the two apart. What it does tell us is that there is no floor being enforced by the market. Nobody is obliged to offer anything.",
  ev:"Our aggregation over Laura's October 2023 inventory: 4 communities, 71 villas, one recorded service line.",
  s:["lopez","verify_method"]}},

{name:"In Their Own Words",
 blurb:"Seven operators whose actual published language we captured and verified. These are the claims you can click through to.",
 items:[
 {n:"CarDon",t:"names the cottage, in contractual language",s:["cardon_cottage"],
  c:"Included with a selected apartment or cottage is all interior, exterior and grounds maintenance, plus housekeeping and scheduled transportation. That is the cleanest published statement anywhere in the research that a cottage resident specifically gets transportation — and it names housekeeping and maintenance in the same breath.",
  q:"Why does the CarDon sentence matter more than a directory listing?",
  o:["It is longer","It names the cottage product explicitly, in inclusion language","It has a price","It is newer"],a:1,
  w:"Contractual register, and the product is named. CarDon also customises copy per property, so a thin description at one of their communities is probably a real signal rather than lazy writing.",
  say:"CarDon publishes that interior, exterior and grounds maintenance plus housekeeping and scheduled transportation are included with a cottage. They name the product."},
 {n:"New Perspective",t:"publishes the only scope exclusion we found",s:["np_faq"],
  c:"Their FAQ says plainly that they do not provide transportation to appointments; they have a community van for events outside the community, and for medical appointments they can assist in coordinating a rideshare. Directory sites claim the opposite about the same operator.",
  q:"What makes the New Perspective FAQ the strongest data point in the research?",
  o:["It is the longest quote","It is the only explicit statement of what is NOT provided","It gives a price","It names a radius"],a:1,
  w:"Everything else in the market states what is offered. This one states a boundary — and the directories flatly contradict it, which is the proof that a directory checkbox is worthless.",
  say:"New Perspective publishes that they do not provide transportation to appointments, only to community events, and they will help you book a rideshare. It is the only boundary anyone states."},
 {n:"Coordination",t:"is not provision, and TLC proves it",s:["tlc_absence"],
  c:"Transportation appears nowhere on TLC Management's own amenities, independent living or living-options pages, and services are described as included in the monthly rent without transportation among them. A third party describes them only as setting up rides. At Village of Avon, transportation appears on-site as an admission criterion — something the resident must manage themselves.",
  q:"How should a community that only helps book rides be recorded?",
  o:["As transportation included","As unverified, never as included","As transportation at cost","As no transportation"],a:1,
  w:"Recording coordination as inclusion would overstate the benefit substantially, and it is the most common way a benchmark like this goes wrong.",
  say:"Two operators only coordinate rides rather than providing them. Coordination is not provision, and a benchmark that counts it as included is wrong."},
 {n:"Zarrow Pointe",t:"is the one verified case of cottages doing better",s:["zarrow","verify_cottage"],
  c:"Their Villas inclusion list carries a discrete medical-transportation line — private car service for medical appointments — that the apartment product does not get. It is the single confirmed instance in seven detached-cottage communities where the cottage resident is treated better, and it is in the operator's own brochure.",
  q:"What is unusual about Zarrow Pointe's villa transportation?",
  o:["It is chargeable","It is a private car for medical appointments, better than the apartments get","It is shared with a taxi firm","It is unverified"],a:1,
  w:"Verified by domain-scoped probe, and the brochure is linked. Fee amount not published, which is true of every community in the research.",
  say:"Zarrow Pointe gives villa residents a private car for medical appointments, which is better than their apartment residents get. It is the only verified case of that."},
 {n:"Garbry Ridge",t:"publishes the exact split we are considering",s:["garbry"],
  c:"Their cottage inclusion list makes scheduled group social outings included, with personal shopping trips and special outings chargeable. Group in the fee, individual priced. It is the clearest published version of a Good-to-Better transportation boundary anywhere in the research.",
  q:"What does Garbry Ridge include versus charge for?",
  o:["Everything included","Group outings included, personal trips charged","Everything charged","Medical only"],a:1,
  w:"This is a real operator publishing the boundary we are debating internally. Worth citing when someone asks whether the split is workable.",
  say:"Garbry Ridge includes scheduled group outings and charges for personal shopping trips. That is the boundary, published, by an operator already doing it."},
 {n:"Laurel Lake",t:"publishes courtesy trips and a paid driver",s:["laurel"],
  c:"Laurel Lake buses provide transportation for regularly scheduled weekly and monthly courtesy trips, and residents may also engage the services of a Laurel Lake driver. Courtesy trips in the fee, a personal driver chargeable. One of only four communities in the deep research that publish an included-versus-chargeable split at all.",
  q:"What is the Laurel Lake model?",
  o:["Everything free","Scheduled courtesy trips included, a personal driver chargeable","Everything chargeable","Rideshare vouchers"],a:1,
  w:"Four of about fifty communities publish this kind of split. The fee amount is still not published — nobody publishes a price.",
  say:"Laurel Lake runs scheduled courtesy trips in the fee and sells a driver on top. They are one of only four communities that publish the split at all."},
 {n:"Cedarhurst",t:"is why you read the whole paragraph",s:["cedarhurst","verify_cottage"],
  c:"Cedarhurst Cottages operate separately from the Assisted Living and Memory Care neighborhoods — and the same paragraph then grants cottage residents access to the services and options already available in those neighbourhoods. We built a headline finding on the first half. The second half reverses it.",
  q:"What did reading the second half of the Cedarhurst paragraph do to our conclusion?",

/* build the queue for a chapter: learn a, learn b, quiz a, quiz b ... in pairs */
function queueFor(ci){
  var items=CH[ci].items, q=[];
  for(var s=0;s<items.length;s+=2){
    var grp=items.slice(s,s+2);
    grp.forEach(function(it,k){q.push({t:"learn",ci:ci,ii:s+k});});
    grp.map(function(it,k){return {t:"quiz",ci:ci,ii:s+k};})
       .sort(function(){return Math.random()-.5;})
       .forEach(function(x){q.push(x);});
  }
  q.push({t:"boss",ci:ci});
  return q;
}
var Q=queueFor(S.ch||0);
if(S.i>=Q.length)S.i=0;

/* ============ HUD ============ */
function rankFor(xp){var r=RANKS[0],i;for(i=0;i<RANKS.length;i++){if(xp>=RANKS[i].xp)r=RANKS[i];}return r;}
function rankIdx(xp){var k=0,i;for(i=0;i<RANKS.length;i++){if(xp>=RANKS[i].xp)k=i;}return k;}
function hud(){
  var ri=rankIdx(S.xp), cur=RANKS[ri], nxt=RANKS[ri+1];
  document.getElementById("lvlNum").textContent="LV "+(ri+1);
  document.getElementById("rankName").textContent=cur.n;
  document.getElementById("xp").textContent=S.xp;
  var pct = nxt ? ((S.xp-cur.xp)/(nxt.xp-cur.xp))*100 : 100;
  document.getElementById("xpbar").style.width=Math.max(2,Math.min(100,pct))+"%";
  var st=document.getElementById("streak");
  st.textContent = S.streak>0 ? ("streak "+S.streak+(S.streak>=3?" x"+mult():"")) : "no streak";
  st.className="streak"+(S.streak>=3?" hot":"");
  document.getElementById("sound").textContent = SOUND?"SOUND ON":"SOUND OFF";
}
function mult(){ return S.streak>=8?3:(S.streak>=5?2:(S.streak>=3?1.5:1)); }

function rail(){
  var el=document.getElementById("rail"); el.innerHTML="";
  CH.forEach(function(c,i){
    var b=document.createElement("button"); b.className="chip"+(S.done["ch"+i]?" done":"");
    b.type="button"; if(i===S.ch)b.setAttribute("aria-current","true");
    b.innerHTML='<span class="dot"></span>'+c.name+(c.op?'<span class="optag">OP</span>':'');
    b.addEventListener("click",function(){ S.ch=i; S.i=0; Q=queueFor(i); save(); rail(); render(); });
    el.appendChild(b);
  });
  document.getElementById("cLabel").textContent=CH[S.ch].name;
  document.getElementById("cCount").textContent=Math.min(S.i+1,Q.length)+" / "+Q.length;
  document.getElementById("cFill").style.width=((S.i)/Q.length*100)+"%";
  opbar();
}

/* the strip that names the operator whose chapter you are in, with a way
   straight into its full dossier */
function opbar(){
  var el=document.getElementById("opbar"), c=CH[S.ch];
  if(!c.op){ el.className="opbar"; el.innerHTML=""; return; }
  var di=-1,i; for(i=0;i<DOSS.length;i++){ if(DOSS[i].n===c.op)di=i; }
  var o=di>=0?DOSS[di]:null;
  el.className="opbar on";
  el.innerHTML='<span class="onm">'+c.op+'</span>'+
    (o?'<span class="ometa">'+o.ns+' communities &middot; '+o.units+' villas</span>':'')+
    (o?'<span class="ogo"><button class="minibtn" type="button" id="opgo">Open the full dossier</button></span>':'');
  var g=document.getElementById("opgo");
  if(g)g.addEventListener("click",function(){ SFX.tick(); DIDX=di; setMode("doss"); });
}

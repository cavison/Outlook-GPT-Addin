  d.innerHTML='<span class="em">'+em+'</span><span><span class="tt">'+tt+'</span><br><span class="ts">'+ts+'</span></span>';
  w.appendChild(d);
  setTimeout(function(){d.style.transition="opacity .4s,transform .4s";d.style.opacity="0";d.style.transform="translateY(10px)";setTimeout(function(){d.remove();},420);},2600);
}
function confetti(){
  var c=document.createElement("div"); c.className="conf"; document.body.appendChild(c);
  var cols=["#C8912F","#47723A","#2A6899","#A95C26","#9A722F"];
  for(var i=0;i<46;i++){
    var p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%"; p.style.top="-16px";
    p.style.background=cols[i%cols.length];
    p.style.animation="fall "+(1.5+Math.random()*1.4)+"s "+(Math.random()*.45)+"s ease-in forwards";
    c.appendChild(p);
  }
  setTimeout(function(){c.remove();},3600);
}
function badge(id,em,tt,ts){
  if(S.badges[id])return; S.badges[id]=1; save();
  setTimeout(function(){toast(em,tt,ts);SFX.streak();},420);
}
function award(n,label){
  var before=rankIdx(S.xp);
  S.xp+=n; save(); hud();
  floatXP("+"+n+(label?"":""));
  var after=rankIdx(S.xp);
  if(after>before){
    setTimeout(function(){ SFX.level(); confetti(); toast("⭐","Level "+(after+1)+" — "+RANKS[after].n,"You are moving up. Keep going."); },520);
  }
}

/* ============ SOURCE PANEL ============
   Every card carries the sources behind it. A link with u: is the page itself.
   A link with q: runs the exact-phrase search that confirms the quote, which is
   the check we actually ran. Where nothing public was captured the panel says so
   rather than inventing a URL. */
function sQ(q){ return "https://www.google.com/search?q="+encodeURIComponent(q); }
var GRADE={OP:"OPERATOR",INT:"INTERNAL",AGG:"OUR MATH",CALL:"THE CALL"};
function srcHTML(ids,hdr){
  if(!ids)return "";
  if(typeof ids==="string")ids=[ids];
  var out='<div class="srcwrap"><div class="srchdr">'+(hdr||"Where this comes from — click to open")+'</div>';
  ids.forEach(function(id){
    var s=SRC[id];
    if(!s){ return; }
    out+='<details class="srcbox"><summary><span class="gr gr-'+s.g+'">'+GRADE[s.g]+'</span>'+
         '<span class="who">'+s.who+'</span><span class="car">&#9656;</span></summary><div class="inner">';
    out+='<p>'+s.basis+'</p>';
    if(s.quote)out+='<p class="srcq">'+s.quote+'</p>';
    if(s.how)out+='<p class="srcnote">'+s.how+'</p>';
    if(s.links&&s.links.length){
      out+='<div class="srclinks">';
      s.links.forEach(function(l){
        var href=l.u?l.u:sQ(l.q);
        var tag=l.u?"OPEN PAGE":"RUN SEARCH";
        out+='<a href="'+href+'" target="_blank" rel="noopener noreferrer"><span class="ic">'+tag+'</span><span>'+l.t+'</span></a>';
      });
      out+='</div>';
    }else{
      out+='<p class="nolink">No public URL captured for this one. Confirm it yourself before quoting it outside the building.</p>';
    }
    out+='</div></details>';
  });
  return out+'</div>';
}

/* ============ DOSSIER MODE ============ */
var MODE="drill", DIDX=-1;
function chapterForOp(name){
  for(var i=0;i<CH.length;i++){ if(CH[i].op===name)return i; }
  return -1;
}
function setMode(m){
  MODE=m; DIDX=-1;
  document.getElementById("mode").textContent = (m==="doss")?"DRILLS":"DOSSIERS";
  document.getElementById("rail").style.display = (m==="doss")?"none":"";
  document.querySelector(".cprog").style.display = (m==="doss")?"none":"";
  document.getElementById("opbar").className="opbar";
  render();
}
function renderDossList(){
  var h='<div class="dhdr"><h2>Operator dossiers</h2><p>Eight operators, '+DOSS_TOTAL.sites+
    ' communities and '+DOSS_TOTAL.units+' villas between them. Look one up before you speak to them, '+
    'or drill it until you can say it cold. Every claim opens its own source.</p></div><div class="dlist">';
  DOSS.forEach(function(o,i){
    h+='<button class="dcard" type="button" data-i="'+i+'">'+
       '<p class="dt">'+o.tag+'</p><p class="dn">'+o.n+'</p><p class="dl">'+o.line+'</p>'+
       '<div class="dm"><span>'+o.ns+' communities</span><span>'+o.units+' villas</span>'+
       '<span>'+o.f.filter(function(f){return f.n>0;}).length+' of 6 functions listed</span></div></button>';
  });
  h+='</div>';
  stage.innerHTML=h;
  Array.prototype.forEach.call(stage.querySelectorAll(".dcard"),function(b){
    b.addEventListener("click",function(){ SFX.tick(); DIDX=Number(b.dataset.i); render(); });
  });
}
function renderDossOne(){
  var o=DOSS[DIDX], ci=chapterForOp(o.n);
  var h='<div class="dhdr"><p class="dt" style="font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass);margin:0 0 4px">'+o.tag+'</p>'+
    '<h2>'+o.n+'</h2><p>'+o.ns+' communities &middot; '+o.units+' villas in the inventory</p></div>'+
    '<div class="card"><p class="ctx" style="font-size:15px;color:var(--ink)">'+o.pb+'</p>'+
    '<div class="say"><div class="lab">Say it like this</div><p>'+o.say+'</p></div>'+
    srcHTML(o.s,"Where this operator profile comes from")+
    '<div class="actions">'+(ci>=0?'<button class="btn" type="button" id="drillop">Drill '+CH[ci].name+'</button>':'')+
    '<button class="btn ghost" type="button" id="backd">All dossiers</button></div></div>';

  h+='<div class="sechdr">What they do, function by function</div><div class="card">';
  o.f.forEach(function(f){
    h+='<div class="frow"><p class="fname">'+f.k+' <span class="fv'+(f.n===0?" zero":"")+'">'+f.v+'</span></p>';
    if(f.ph&&f.ph.length){
      h+='<ul class="phr">';
      f.ph.forEach(function(p){
        h+='<li><span class="pc">&times;'+p.c+'</span>'+p.t+'<span class="ps">'+p.s.join(" &middot; ")+'</span></li>';
      });
      h+='</ul>';
    }
    h+='</div>';
  });
  h+='</div>';

  h+='<div class="sechdr">The portfolio</div><div class="card"><ul class="sites">';
  o.sites.forEach(function(s){
    h+='<li><span class="sn">'+s.nm+'</span><span class="sl">'+s.loc+'</span><span class="su">'+s.u+'</span></li>';
  });
  h+='</ul></div>';
  stage.innerHTML=h;
  document.getElementById("backd").addEventListener("click",function(){ SFX.tick(); DIDX=-1; render(); });
  var db=document.getElementById("drillop");
  if(db)db.addEventListener("click",function(){ SFX.tick(); S.ch=ci; S.i=0; Q=queueFor(ci); save(); setMode("drill"); });
}

/* ============ RENDER ============ */
var stage=document.getElementById("stage");
function render(){
  hud();
  if(MODE==="doss"){ return DIDX<0?renderDossList():renderDossOne(); }
  rail();
  if(S.i>=Q.length){ return renderChapterDone(); }
  var step=Q[S.i];
  if(step.t==="learn")return renderLearn(step);
  if(step.t==="quiz")return renderQuiz(step);
  return renderBoss(step);
}

function renderLearn(step){
  var d=CH[step.ci].items[step.ii];
  stage.innerHTML='<div class="card"><span class="kind k-learn">Learn</span>'+
    '<div class="bignum">'+d.n+'</div>'+
    '<h2 class="bigsub">'+d.t+'</h2>'+
    '<p class="ctx">'+d.c+'</p>'+
    '<div class="say"><div class="lab">Say it like this</div><p>'+d.say+'</p></div>'+
    srcHTML(d.s)+
    '<div class="actions"><button class="btn" type="button" id="got">Got it</button></div></div>';
  document.getElementById("got").addEventListener("click",function(){
    SFX.learn(); award(10);
    S.i++; save(); render();
  });
}

function renderQuiz(step){
  var d=CH[step.ci].items[step.ii];
  var html='<div class="card" id="qc"><span class="kind k-quiz">Drill</span>'+
    '<h2 class="q">'+d.q+'</h2><div class="opts">';
  d.o.forEach(function(o,i){ html+='<button class="opt" type="button" data-i="'+i+'"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>'; });
  html+='</div></div>';
  stage.innerHTML=html;
  var card=document.getElementById("qc");
  Array.prototype.forEach.call(stage.querySelectorAll(".opt"),function(b){
    b.addEventListener("click",function(){
      var ok=Number(b.dataset.i)===d.a;
      Array.prototype.forEach.call(stage.querySelectorAll(".opt"),function(x){
        x.disabled=true;
        if(Number(x.dataset.i)===d.a)x.classList.add("right");
        else if(x===b)x.classList.add("wrong");
        else x.classList.add("dim");
      });
      var gain=0;
      if(ok){
        S.streak++; S.right++;
        if(S.streak>(S.best||0))S.best=S.streak;
        gain=Math.round(25*mult());
        card.classList.add("flash-ok"); SFX.right(S.streak);
        var st=document.getElementById("streak"); st.classList.add("pop"); setTimeout(function(){st.classList.remove("pop");},200);
        if(S.streak===3){badge("hat","🔥","Hat trick","Three in a row. Multiplier is live at 1.5x.");}
        if(S.streak===5){badge("fire","⚡","On fire","Five straight. Multiplier now 2x.");}
        if(S.streak===8){badge("unstop","🎯","Unstoppable","Eight straight. Multiplier now 3x.");}
        if(S.right===1){badge("first","✅","First one down","That is the loop. Learn it, then prove it.");}
      }else{
        S.wrong++; S.streak=0; gain=5;
        card.classList.add("flash-no"); SFX.wrong();
      }
      save(); hud(); award(gain);
      var res=document.createElement("div"); res.className="res";
      res.innerHTML='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Right":"Not quite — but now you own it")+'</p>'+
        '<p class="why">'+d.w+'</p>'+
        '<div class="say"><div class="lab">Say it like this</div><p>'+d.say+'</p></div>'+
        srcHTML(d.s)+
        '<div class="actions"><button class="btn" type="button" id="nx">Next</button></div>';
      card.appendChild(res);
      document.getElementById("nx").addEventListener("click",function(){ SFX.tick(); S.i++; save(); render(); });
    });
  });
}

function renderBoss(step){
  var c=CH[step.ci], d=c.boss;
  if(!d){ return finishChapter(); }
  stage.innerHTML='<div class="card"><span class="kind k-boss">Boss round — '+
    (c.op?'you are in the room about '+c.op:'an owner asks')+'</span>'+
    '<h2 class="q">“'+d.q+'”</h2>'+
    '<p class="ctx" style="margin-top:10px">Say your answer out loud, then reveal. No peeking — the whole point is producing it.</p>'+
    '<div class="actions"><button class="btn" type="button" id="rev">I answered it — reveal</button></div></div>';
  document.getElementById("rev").addEventListener("click",function(){
    SFX.tick();
    stage.innerHTML='<div class="card"><span class="kind k-boss">Boss round</span>'+
      '<h2 class="q">“'+d.q+'”</h2>'+
      '<div class="res"><div class="say"><div class="lab">A strong answer</div><p>'+d.say+'</p></div>'+
      '<p class="why" style="margin-top:12px"><strong>Evidence:</strong> '+d.ev+'</p>'+
      srcHTML(d.s,"Every claim in that answer — click to check it")+
      '<div class="actions"><button class="btn" type="button" id="y">I had that — +60</button>'+
      '<button class="btn ghost" type="button" id="n">Not yet — +15</button></div></div></div>';
    document.getElementById("y").addEventListener("click",function(){ SFX.right(3); award(60); finishChapter(); });
    document.getElementById("n").addEventListener("click",function(){ SFX.tick(); award(15); finishChapter(); });
  });
}
function finishChapter(){ S.i=Q.length; save(); setTimeout(render,260); }

function renderChapterDone(){
  var first=!S.done["ch"+S.ch];
  if(first){ S.done["ch"+S.ch]=1; save(); SFX.chapter(); confetti();
    var c=CH[S.ch];
    if(c.op)badge("op-"+S.ch,"🏛️",c.op+" briefed","You can hold that conversation now. Their whole portfolio, not one site.");
    var ops=CH.filter(function(x){return x.op;});
    var allops=ops.every(function(x){return S.done["ch"+CH.indexOf(x)];});
    if(allops)badge("allops","🗺️","Every operator learned","Eight portfolios, fifty communities. You know who does what.");
    var all=CH.every(function(x,i){return S.done["ch"+i];});
    if(all)badge("allch","🏆","Every chapter cleared","You have been through the whole brief. Run the weak ones again.");
  }
  var more=S.ch<CH.length-1;
  stage.innerHTML='<div class="card done-card">'+
    '<p class="big">'+CH[S.ch].name+' cleared</p>'+
    '<p>'+CH[S.ch].blurb+'</p>'+
    '<div class="scorerow"><div><b>'+S.xp+'</b><span>total xp</span></div>'+
    '<div><b>'+(S.best||0)+'</b><span>best streak</span></div>'+
    '<div><b>'+S.right+'</b><span>drills right</span></div>'+
    '<div><b>'+(S.checked||0)+'</b><span>sources opened</span></div></div>'+
    '<div class="actions" style="justify-content:center">'+
    (more?'<button class="btn" type="button" id="nextch">Next chapter — '+CH[S.ch+1].name+'</button>':'')+
    '<button class="btn ghost" type="button" id="again">Run this chapter again</button></div></div>';
  var nb=document.getElementById("nextch");
  if(nb)nb.addEventListener("click",function(){ SFX.tick(); S.ch++; S.i=0; Q=queueFor(S.ch); save(); render(); });
  document.getElementById("again").addEventListener("click",function(){ SFX.tick(); S.i=0; Q=queueFor(S.ch); save(); render(); });
}

/* ============ CONTROLS ============ */
document.getElementById("sound").addEventListener("click",function(){
  SOUND=!SOUND; try{localStorage.setItem(KEY+"-snd",SOUND?"1":"0");}catch(e){}
  hud(); if(SOUND){ac();SFX.learn();}
});
document.getElementById("reset").addEventListener("click",function(){
  S={xp:0,streak:0,best:0,ch:0,i:0,done:{},badges:{},right:0,wrong:0,checked:0};
  save(); Q=queueFor(0); MODE="drill"; DIDX=-1; setMode("drill");
});
document.getElementById("mode").addEventListener("click",function(){
  SFX.tick(); setMode(MODE==="doss"?"drill":"doss");
});
/* opening a source is the habit worth rewarding, so it scores */
document.addEventListener("click",function(e){
  var a=e.target&&e.target.closest?e.target.closest(".srclinks a"):null;
  if(!a)return;
  S.checked=(S.checked||0)+1; save();
  award(15); SFX.learn();
  if(S.checked===1)badge("recpt1","🔎","Checked a source","That link is the difference between briefing an owner and reading them a deck.");
  if(S.checked===5)badge("recpt5","📎","Five receipts pulled","You are now harder to argue with than the research is.");
});
document.addEventListener("click",function once(){ ac(); document.removeEventListener("click",once); },{once:true});
render();
</script>
